version: 2

# Weekly update PRs against dev. The 14-day cooldown matches the team's two-week rule:
# a release must have aged two weeks before we pin it (ADR-0001).
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /mobile
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
