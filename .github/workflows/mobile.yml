name: mobile

# P0-25 (ADR-0001, ADR-0003, frontend-build.md): every mobile gate runs on PRs and on pushes to
# the long-lived branches. docs/api/** is included because the Dart client is generated from
# the contract (drift). Order fails fast: format/analyze/tests before the release build.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned toolchain (ADR-0001); bump together with mobile/pubspec.yaml `environment.flutter`.
  FLUTTER_VERSION: 3.47.7
  # Dummy endpoint: prod refuses to build without an HTTPS API_BASE_URL (AppConfig); CI never
  # talks to it. `.invalid` is reserved (RFC 2606) so it can never resolve.
  CI_API_BASE_URL: https://api.ci.invalid

jobs:
  # Branch protection requires the `-ok` job below, so this workflow runs on every PR
  # and decides here whether its gates apply (a workflow-level `paths` filter would leave
  # the required check "expected" forever on PRs that do not touch these paths).
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # On a PR, HEAD is the merge commit and HEAD^1 the base tip, so the diff is exactly
      # what the PR changes. Pushes to dev/main always run every gate.
      - name: Paths this workflow gates
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(mobile/|docs/api/|tools/mobile/|Makefile$|\.github/workflows/mobile\.yml$)'
        run: |
          if [ "$EVENT" != "pull_request" ] || git diff --name-only HEAD^1 HEAD | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Format, analyze, tests + coverage gate
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          # The action keys the pub cache on the SDK only; ours keys on pubspec.lock below.
          pub-cache: false
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - name: Resolve dependencies (lockfile enforced)
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      # pub get regenerates lib/l10n; a diff means the committed localizations are stale.
      - name: Generated localizations are committed
        run: git diff --exit-code -- mobile
      - name: dart format
        working-directory: mobile
        run: dart format --set-exit-if-changed .
      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze
      - name: Tests + coverage gate (>= 80% non-generated lib/)
        run: make mobile-cover
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  client:
    name: Dart client drift + ADR-0003 kind guard
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - name: Resolve dependencies (lockfile enforced)
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      # Regenerates the client (normalizer + kind guard, fails on a collision) and fails when
      # the committed lib/api/generated differs from docs/api/openapi.yaml.
      - name: Client drift (generated code matches docs/api/openapi.yaml)
        run: make mobile-client-check
      # Anything else the generator touched (e.g. new untracked files outside lib/api).
      - name: No other generated drift
        run: |
          git add --intent-to-add --all -- mobile
          git diff --exit-code -- mobile

  # M9 security gate F3: the backend has govulncheck; the app's packages get the same gate.
  # osv-scanner reads mobile/pubspec.lock (direct and transitive) against OSV's Pub advisories.
  # The version is pinned in the Makefile (OSV_SCANNER) and go run checks it against the Go
  # checksum database.
  deps:
    name: Dependency advisories (osv-scanner, pubspec.lock)
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: OSV scan of mobile/pubspec.lock
        run: make mobile-deps-scan

  release-android:
    name: Release build (prod, obfuscated) + artifact gate
    needs: [changes, check]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Prove the gate rejects symbols/maps before trusting its verdict on the real build.
      - name: Artifact gate self-test
        run: make mobile-artifact-check-test
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/app/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - name: Resolve dependencies (lockfile enforced)
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build release APK (prod, --obfuscate --split-debug-info)
        run: make mobile-build-apk FLAVOR=prod API_BASE_URL="$CI_API_BASE_URL"
      - name: Build release app bundle (prod, --obfuscate --split-debug-info)
        run: make mobile-build-aab FLAVOR=prod API_BASE_URL="$CI_API_BASE_URL"
      - name: Artifact gate (no symbols, debug info or source maps shipped)
        run: make mobile-artifact-check FLAVOR=prod
      # The split debug info (mobile/build/symbols/prod) is NOT uploaded: the repository is
      # public, so any workflow artifact is downloadable by anyone, and the symbols undo the
      # obfuscation (P0-30). CI builds are throwaway; REL-04 sends release symbols straight
      # to crash reporting with a secret-managed token.

  # The single required status check for this workflow. It always runs and fails unless
  # every gate succeeded or was skipped because the PR does not touch this workflow's
  # paths. A gate skipped because `changes` failed makes `changes` a failure here.
  ok:
    name: mobile-ok
    if: ${{ always() }}
    needs: [changes, check, client, deps, release-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed or did not apply
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a gate ended '$result'"; exit 1 ;;
            esac
          done
          echo "results: $RESULTS"
