name: contract

on:
  pull_request:
    paths:
      - 'docs/api/**'
      - 'redocly.yaml'
      - 'tools/contract/**'
      - 'Makefile'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: OpenAPI contract lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: tools/contract/package-lock.json
      - name: Ruleset tests
        run: make contract-lint-test
      - name: Lint docs/api/openapi.yaml
        run: make contract-lint
