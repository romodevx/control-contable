name: control_contable
description: "Control Contable: tax estimates for Mexican taxpayers (Flutter client)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# Pins follow ADR-0001 (Context7-verified 2026-10-13). Exact versions: upgrades are deliberate.
dependencies:
  app_settings: 9.0.0
  dio: 5.11.1
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  # Session (refresh) token store: Keychain on iOS, Keystore-backed on Android (M1-12, ADR-0001).
  flutter_secure_storage: 11.2.0
  # Runtime of the generated API client (ADR-0003 pins).
  freezed_annotation: 3.1.0
  go_router: 18.0.2
  intl: any
  json_annotation: 4.12.0
  retrofit: 4.10.0
  # Active-taxpayer id only (a non-secret preference, M2-10); never the RFC or tokens.
  shared_preferences: 2.5.5
  # Opens the legal documents (privacy notice, terms) in the in-app browser view (M1-11).
  url_launcher: 6.3.2

dev_dependencies:
  # Client generation toolchain (ADR-0003): `make mobile-client` from the repo root.
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  json_serializable: 6.14.1
  retrofit_generator: 10.2.11
  # In-memory preferences backend for the active-taxpayer store test.
  shared_preferences_platform_interface: 2.4.2
  swagger_parser: 1.45.0
  very_good_analysis: 11.0.0
  # Read by tool/normalize_openapi.dart (the contract is YAML).
  yaml: 3.1.4

flutter:
  uses-material-design: true
  generate: true
  # OFL notices of the bundled faces; registered in the app licenses at boot.
  assets:
    - assets/fonts/OFL-PublicSans.txt
    - assets/fonts/OFL-SourceSerif4.txt
  # Direction "A · Confianza sobria" faces, bundled so release builds never fetch fonts at
  # runtime (docs/design/DIRECTIONS.md). Latin subset, SIL OFL 1.1 (see assets/fonts/).
  fonts:
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700
