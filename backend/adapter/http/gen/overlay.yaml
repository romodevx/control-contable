# OpenAPI Overlay 1.0 applied by oapi-codegen before generation (see oapi-codegen.yaml).
# Codegen-only workarounds for OpenAPI 3.1 features oapi-codegen v2.8.0 cannot map.
# The contract (docs/api/openapi.yaml) stays the source of truth and is not changed.
# Every action here is recorded in ADR-0001 ("oapi-codegen and OpenAPI 3.1").
overlay: 1.0.0
info:
  title: control-contable codegen workarounds
  version: 1.0.0
actions:
  # Multi-type union `type: [string, boolean, 'null']`: v2.8.0 fails with
  # "unhandled Schema type: &[string boolean]" (its README says unions become `any`,
  # but only top-level ones do). Map the property to `any` explicitly; the
  # handler validates it against RegimeOptionDef.type.
  - target: $.components.schemas.RegimeOptionDef.properties.default
    update:
      x-go-type: any
  # Merge-patch `null` on an optional property (`type: [T, 'null']` or
  # `oneOf: [T, {type: 'null'}]`): v2.8.0 generates a plain pointer, so `null` and an
  # absent key both decode to nil and `null` could never clear the field. The three
  # clearable ExpenseUpdate properties become nullable.Nullable[T], which keeps
  # absent, null and a value apart. Only the Go type changes: the property schemas,
  # and the request validation against them, stay the contract's (M4-07).
  - target: $.components.schemas.ExpenseUpdate.properties.cfdi_uuid
    update:
      x-go-type: nullable.Nullable[string]
      x-go-type-import: { path: github.com/oapi-codegen/nullable }
      x-go-type-skip-optional-pointer: true
  - target: $.components.schemas.ExpenseUpdate.properties.deductible
    update:
      x-go-type: nullable.Nullable[bool]
      x-go-type-import: { path: github.com/oapi-codegen/nullable }
      x-go-type-skip-optional-pointer: true
  - target: $.components.schemas.ExpenseUpdate.properties.description
    update:
      x-go-type: nullable.Nullable[string]
      x-go-type-import: { path: github.com/oapi-codegen/nullable }
      x-go-type-skip-optional-pointer: true
