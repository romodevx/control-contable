    dof_date: 2025-12-31
    reference: "Artículos Primero y Segundo (vigencia hasta el 31 de diciembre de 2026)"
  - id: dof-uma-2025
    title: Unidad de medida y actualización, valores vigentes a partir del 1 de febrero de 2025 (INEGI en el DOF; accessed 2026-10-14)
