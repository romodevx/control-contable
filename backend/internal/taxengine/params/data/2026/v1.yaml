  - id: rliva
    title: Reglamento de la Ley del Impuesto al Valor Agregado, última reforma DOF 25-09-2014 (Cámara de Diputados; accessed 2026-10-14)
    url: https://www.diputados.gob.mx/LeyesBiblio/regley/Reg_LIVA_250914.pdf
