values:
  # IVA rates -----------------------------------------------------------------
  - key: iva.rate.general_16
    rate: "0.16"            # "la tasa del 16%"
    valid_from: 2026-01-01
    basis: [{source: liva, article: "Art. 1o."}]
  - key: iva.rate.zero
    rate: "0"               # "la tasa del 0%"
    valid_from: 2026-01-01
    basis: [{source: liva, article: "Art. 2o.-A"}]
  - key: iva.rate.border_8
    # The decrees grant "un crédito equivalente al 50% de la tasa" of LIVA 1o.
    # (16 %): the effective rate is 8 %. Extended to 31-12-2026 by DOF 31-12-2025.
    rate: "0.08"
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    basis:
      - {source: dof-frontera-norte-2018, article: "Art. Décimo Primero"}
      - {source: dof-frontera-sur-2020, article: "Art. Décimo"}
      - {source: dof-fronteras-2025, article: "Arts. Primero y Segundo"}
      - {source: liva, article: "Art. 1o."}

  # IVA withholding by personas morales (LIVA 1o.-A fr. II) -------------------
  # Re-read 2026-10-14 for WH-05 (docs/reviews/WH-05-params-verification.md).
  # The base differs per key: freight is a rate on the PRICE, scrap is a share
  # of the IVA charged. The 2/3 share of RLIVA 3 fr. I stays in code
  # (fiscal.ShareTwoThirds, see the header).
  - key: iva.withholding.freight_pm
    rate: "0.04"            # "la retención se hará por el 4% del valor de la contraprestación pagada efectivamente"
    valid_from: 2026-01-01
    basis:
      - {source: rliva, article: "Art. 3 fr. II"}
      - {source: liva, article: "Art. 1o.-A fr. II inciso c)"}
  - key: iva.withholding.scrap_pm
    # Desperdicios bought as an industrial input or to resell carry "la retención del
    # impuesto que se les traslade": the whole IVA. RLIVA 3 lowers it only for
    # fr. I (2/3) and fr. II (4 % freight); scrap is in neither, so 100 %.
    rate: "1"
    valid_from: 2026-01-01
    basis:
      - {source: liva, article: "Art. 1o.-A fr. II inciso b)"}
      - {source: liva, article: "Art. 1o.-A último párrafo"}
      - {source: rliva, article: "Art. 3 (no reduction for desperdicios)"}

  # ISR rates -----------------------------------------------------------------
  - key: isr.rate.persona_moral
    rate: "0.30"            # "la tasa del 30%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 9"}]
  - key: isr.rent.blind_deduction
    rate: "0.35"            # "deducir el 35% de los ingresos"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 115, segundo párrafo"}]

  # ISR withholding by personas morales ---------------------------------------
  - key: isr.withholding.fees_pm
    rate: "0.10"            # "la tasa del 10%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 106, penúltimo párrafo"}]
  - key: isr.withholding.rent_pm
    rate: "0.10"            # "la tasa del 10%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 116, penúltimo párrafo"}]
  - key: isr.withholding.resico_pf
    rate: "0.0125"          # "la tasa del 1.25%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-J"}]
  - key: isr.withholding.interest_annual
    rate: "0.009"           # "será del 0.90 por ciento" (annual LIF rate)
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    basis: [{source: lif-2026, article: "Art. 24"}]

  # ISR withheld by digital platforms -----------------------------------------
  - key: isr.platform.transport_delivery
    rate: "0.021"           # "la retención se hará por el 2.1%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-A, fr. I"}]
  - key: isr.platform.lodging
    rate: "0.04"            # "la retención se hará por el 4%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-A, fr. II"}]
  - key: isr.platform.goods_services
    # LIF 2026 replaces the 1 % of LISR 113-A fr. III: "aplicarán la tasa del 2.5 por ciento".
    rate: "0.025"
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    basis: [{source: lif-2026, article: "Art. 25, fr. VI, primer párrafo"}]
  - key: isr.platform.no_rfc
    rate: "0.20"            # "aplicando la tasa del 20%"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-C, fr. IV, segundo párrafo"}]
  - key: isr.platform.persona_moral
    rate: "0.025"           # "aplicando una tasa del 2.5 por ciento sin deducción alguna"
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    basis: [{source: lif-2026, article: "Art. 25, fr. VI, segundo párrafo"}]
  - key: isr.platform.persona_moral_no_rfc
    rate: "0.20"            # "la tasa de retención del 20 por ciento en sustitución de la tasa del 2.5"
    valid_from: 2026-01-01
    valid_to: 2026-12-31
    basis: [{source: lif-2026, article: "Art. 25, fr. VI, tercer párrafo"}]

  # Thresholds ----------------------------------------------------------------
  - key: regime.resico_pf.income_cap
    money: "3500000.00"     # "tres millones quinientos mil pesos"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-E, primer párrafo"}]
  - key: regime.resico_pm.income_cap
    money: "35000000.00"    # "35 millones de pesos"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 206, primer párrafo"}]
  - key: regime.platform.definitive_option_cap
    money: "300000.00"      # "trescientos mil pesos"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 113-B, fr. I"}]
  - key: deduction.cash_payment_limit
    money: "2000.00"        # "los pagos cuyo monto exceda de $2,000.00"
    valid_from: 2026-01-01
    basis: [{source: lisr, article: "Art. 27, fr. III"}]

  # UMA: January 2026 still uses the values in force from 1 February 2025 ------
  - key: uma.daily
    money: "113.14"
    valid_from: 2026-01-01
    valid_to: 2026-01-31
    basis: [{source: dof-uma-2025, article: "Valor diario"}]
  - key: uma.daily
    money: "117.31"
    valid_from: 2026-02-01
    valid_to: 2027-01-31
    basis: [{source: dof-uma-2026, article: "Valor diario"}]
  - key: uma.monthly
    money: "3439.46"
    valid_from: 2026-01-01
    valid_to: 2026-01-31
    basis: [{source: dof-uma-2025, article: "Valor mensual"}]
  - key: uma.monthly
    money: "3566.22"
    valid_from: 2026-02-01
    valid_to: 2027-01-31
    basis: [{source: dof-uma-2026, article: "Valor mensual"}]
  - key: uma.annual
    money: "41273.52"
    valid_from: 2026-01-01
    valid_to: 2026-01-31
    basis: [{source: dof-uma-2025, article: "Valor anual"}]
  - key: uma.annual
