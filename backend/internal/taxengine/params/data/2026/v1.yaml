# Tax parameters for fiscal year 2026, version 1 (PLAN M5-04).
#
# Transcribed from the official publications listed under `sources`, all
# fetched on 2026-10-14. Schema and rules: docs/architecture/tax-params-schema.md.
#
# Transcription rules followed here:
# - Amounts are copied as printed, with the thousands separators removed.
# - Percentages are written as fractions: "1.92 %" is "0.0192". Nothing else
#   is computed.
# - The art. 106 tables are the twelve tables Anexo 8 publishes, never derived
#   from January (December row 2 is 194.59, not 12 x 16.22 = 194.64).
# - The tariffs were extracted mechanically from the Anexo 8 PDF text and
#   matched cell by cell against docs/research/tax-regimes-mx-2026.md §A.2.2.
# - LISR 113-E/113-F print only "Hasta" (upper) amounts; each bracket's lower
#   bound is the previous upper + 0.01, the first is 0.01 (schema rule).
# - Legal fractions that are not a terminating decimal stay in code, exact:
#   the 2/3 IVA withholding (RLIVA 3 fr. I) is fiscal.ShareTwoThirds, and the
#   platform 50 % / 100 % IVA withholding (LIVA 18-J fr. II a) is
#   fiscal.ShareHalf / ShareWhole. A 6-decimal rate cannot hold 2/3.
fiscal_year: 2026
version: 1
published_on: 2026-10-14

sources:
  - id: anexo8-rmf-2026
    title: Anexo 8 de la Resolución Miscelánea Fiscal para 2026, tarifas del ISR (SAT copy of the DOF edition; accessed 2026-10-14)
