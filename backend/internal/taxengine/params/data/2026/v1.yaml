    dof_date: 2025-12-28
    reference: "Anexo 8, apartados B.V, B.VI, B.VII y C.II"
  - id: lisr
    title: Ley del Impuesto sobre la Renta, texto vigente, última reforma DOF 01-04-2024 (Cámara de Diputados; accessed 2026-10-14)
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LISR.pdf
    dof_date: 2024-04-01
    reference: "Arts. 9, 27 fr. III, 106, 113-A, 113-B, 113-C, 113-E, 113-F, 113-J, 115, 116, 206"
  - id: lif-2026
    title: Ley de Ingresos de la Federación para el Ejercicio Fiscal de 2026 (Cámara de Diputados; accessed 2026-10-14)
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LIF_2026.pdf
    dof_date: 2025-11-07
    reference: "Arts. 24 y 25 fr. VI"
  - id: liva
    title: Ley del Impuesto al Valor Agregado, texto vigente, última reforma DOF 12-11-2021 (Cámara de Diputados; accessed 2026-10-14)
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LIVA.pdf
    dof_date: 2021-11-12
