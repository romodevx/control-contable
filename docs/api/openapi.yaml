  # ---------------------------------------------------------------- M8 History
  # Frozen at M8-01 (docs/project-specs/MODULE-history.md §9, OQ-H1..OQ-H7 DECIDED).
  /v1/taxpayers/{taxpayerId}/history:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [History]
      operationId: getHistory
      x-frozen: sha256:507b2c6921d3b3566befb9d27e8494ea66ed65f89a2dcbab57d6f335a91bcc15
      summary: Fiscal-year history of one taxpayer - every month's estimate, status and changed marker
      description: >-
        For the taxpayer and `fiscal_year`, one row per month with the estimated totals,
        the taxpayer-level status and whether the displayed figures changed since the caller
        last viewed that month. Every figure is recalculated from the current records on each
        read (ADR-0002 §5); History stores only what the user saw, never a tax figure.


        **Months.** January .. December for a past year; January .. the current month
        (America/Mexico_City) for the current year. Ordered **newest first** (the current
        month, `is_current: true`, at the top). The list is always contiguous: a month in
        which the taxpayer held no regime comes back with `status: none` and `tax: null`
        ("Sin régimen en este mes"), never as a hole. Each month's figures are the same
        `totals` that `getTaxpayerEstimate` answers for that `period`, to the centavo; the
        client never recomputes or re-rounds them. `year_totals` is the sum of the returned
        months' estimates ("Suma de estimados mensuales"), **not** an annual return; a saldo a
        favor never subtracts from it.


        **Changed since viewed** (driven only by `figures_fingerprint`, OQ-H4). For a month
        with a stored view: same figures fingerprint → `changed_since_viewed: false`,
        whatever the inputs or the engine did; different, and the engine version or parameter
        set differs from the one viewed → `true`, `change_reason: engine`; different
        otherwise → `true`, `change_reason: records` (when both causes apply, `engine` wins).
        A never-viewed month (`viewed_at: null`, OQ-H1) and the current month (OQ-H3) are
        never marked. `change_reason` is non-null if and only if `changed_since_viewed` is
        `true`. Opening a month and calling `markHistoryViewed` clears its marker; the marker
        also clears by itself when the figures return to the viewed ones.


        **Flags (server-enforced).** `module_history` requires `module_tax_engine` (and,
        through it, `module_taxpayers`): with any of them OFF the module is effectively OFF
        and this route answers `404`, indistinguishable from an unknown taxpayer; no tax
        figure leaves the server. `module_incomes` / `module_expenses` OFF never change the
        figures (the engine still reads the records); `has_records` then counts only the
        enabled modules' records, and the app hides the matching "Ver ingresos" / "Ver
        gastos" link.


        **Access.** Open to read-only users (no `402`) and to archived taxpayers. Per-user
        budget `history_reads`, 600 per hour (burst 600, ADR-0005), separate from
        `estimate_reads`; spent → `429 rate_limited` with `Retry-After`. No partial mode: if
        any month's estimate fails the whole request fails (`500`).


        `FieldError.code` values beyond JSON Schema keywords: `fiscal_year` → `out_of_range`
        (a year after the current one, America/Mexico_City). `422 business_rule_violation`
        details: `fiscal_year` → `parameters_unavailable` (2022..2025: no published tax
        parameters).
