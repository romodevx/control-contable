          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxInputs' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M6 Dashboard
  /v1/taxpayers/{taxpayerId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Home for the active taxpayer
      x-module: module_dashboard
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - name: months
          in: query
          schema: { type: integer, minimum: 6, maximum: 12, default: 12 }
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M7 Subscriptions
  /v1/subscription:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Access status (trial, pro, comp, read-only) and plan
      x-module: module_subscriptions
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/subscription/sync:
    post:
      tags: [Subscriptions]
      operationId: syncSubscription
      summary: Pull current state from RevenueCat (post-purchase / restore)
      x-module: module_subscriptions
      responses:
        '200':
          description: Refreshed status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/webhooks/revenuecat:
    post:
      tags: [Subscriptions]
      operationId: receiveRevenueCatWebhook
      summary: RevenueCat webhook receiver (idempotent by event id)
      description: |
        Authenticated by the shared secret configured in RevenueCat, sent as
        `Authorization: Bearer <secret>`. Duplicate `event.id` returns 200 with no effect.
        State is re-fetched from RevenueCat, so out-of-order delivery is safe.
      x-module: module_subscriptions
      security:
        - revenueCatWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueCatWebhook' }
      responses:
        '200': { description: Accepted (processed or duplicate). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- M8 History
  /v1/taxpayers/{taxpayerId}/history:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [History]
      operationId: getHistory
      summary: Monthly summaries for a fiscal year
      x-module: module_history
      parameters:
        - name: fiscal_year
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FiscalYear' }
      responses:
        '200':
          description: Months of the fiscal year.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryYear' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/history/{period}/viewed:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/PeriodPath'
    post:
      tags: [History]
      operationId: markHistoryViewed
      summary: Mark a month as viewed (stores the current records fingerprint)
      x-module: module_history
      responses:
        '204': { description: Marked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M9 Reminders
  /v1/devices:
    post:
      tags: [Reminders]
      operationId: registerDevice
      summary: Register or refresh a push token
      x-module: module_reminders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '200':
          description: Already registered; refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Reminders]
      operationId: unregisterDevice
      summary: Remove a push token (logout / opt-out)
      x-module: module_reminders
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/reminder-settings:
    get:
      tags: [Reminders]
      operationId: getReminderSettings
      summary: Reminder preferences (defaults if never set)
      x-module: module_reminders
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Reminders]
      operationId: putReminderSettings
      summary: Replace reminder preferences
      x-module: module_reminders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/tax-calendar:
    get:
      tags: [Reminders]
      operationId: getTaxCalendar
      summary: Monthly due dates for a year (day 17 moved past weekends/holidays)
      x-module: module_reminders
      parameters:
        - name: year
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FiscalYear' }
      responses:
        '200':
          description: Calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token, 15 min TTL (ADR-0001 O6).
    revenueCatWebhookSecret:
      type: http
      scheme: bearer
      description: Shared secret configured in the RevenueCat dashboard as the Authorization header value.

  parameters:
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RegimeCodePath:
      name: regimeCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RegimeCode' }
    PeriodPath:
      name: period
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    PeriodQuery:
      name: period
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    RegimeQuery:
      name: regime
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RegimeCode' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `next_cursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Confirm:
      name: confirm
      in: query
      required: false
      description: Must be `true` to perform a destructive or data-affecting action.
      schema: { type: boolean, default: false }
    OnDate:
      name: 'on'
      in: query
      required: false
      description: Date the dated parameters are read on (America/Mexico_City); defaults to today. `2022-01-01` … today (`out_of_range`).
      schema: { type: string, format: date }

  headers:
    NoStore:
      x-frozen: sha256:0e38e657527212cb20ce74557d6a041ed2ba91434f6050d1a2e62d8897cf2496
      description: Responses carrying tokens or account data must not be stored by any cache (RFC 9111; RFC 6749 section 5.1).
      required: true
      schema: { type: string, const: no-store }
    WWWAuthenticate:
      x-frozen: sha256:1fb572380b171f3d3847035780f005b1158e8a42950cfd242777120d95b7c79c
      description: >-
        The bearer challenge every `401` of a secured operation carries (RFC 9110 section
        15.5.2; RFC 6750 section 3). One fixed value with no `error` attribute, so it never
        says why the credentials were refused.
      required: true
      schema: { type: string, const: 'Bearer realm="control-contable"' }

    NoStoreOnError:
      x-frozen: sha256:f93c7edd6e7b3b59a6d2f83259c90c1a7cfd78fc7ae5f30fda8ed95175385822
      description: >-
        `Cache-Control: no-store` on the error responses of record operations (M3/M4, S-11;
        P0-30 D-6). Optional in the contract because a 404 written before the module is reached
        (flag OFF, unknown route) may omit it; every error the module's handlers write sends it.
      required: false
      schema: { type: string, const: no-store }

  responses:
    BadRequest:
      description: Input does not match the contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - field: amount_cents
                  code: minimum
                  message: Must be greater than or equal to 0.
    Unauthorized:
      x-frozen: sha256:cecf02689502978ec9e4f2d8fa5e7e31d9a83bb8706fced34b5814fd59f8bb34
      description: Missing, invalid or expired credentials.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: Authentication required., request_id: req_01J9Z6Q4X8 }
    PaymentRequired:
      description: Trial ended or cap reached and no active plan (read-only access).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    NotFound:
      description: Resource does not exist, belongs to another user, or its module is disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    UnprocessableEntity:
      description: Well-formed but violates a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: invalid_regime_combination
              message: RESICO cannot be combined with regime 612 for the same taxpayer.
              request_id: req_01J9Z6Q4X8
              details:
                - field: regimes
                  code: incompatible
                  message: 626 is incompatible with 612.
    TooManyRequests:
      x-frozen: sha256:f8089f8519a6c89a82d5c1be41732117e53e4f6e7042c713d6d6ac127fea5b3e
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: >-
            Whole seconds until the next attempt can be admitted (RFC 9110 §10.2.3, delay-seconds
            form), rounded up, at least 1. Sent on every 429 (M1-10).
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., request_id: req_01J9Z6Q4X8 }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }
    ServiceUnavailable:
      description: Dependency unavailable (database, RevenueCat); retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: upstream_unavailable, message: Service temporarily unavailable., request_id: req_01J9Z6Q4X8 }

    # M3/M4 record errors (S-11 / P0-30 D-6): they declare `Cache-Control: no-store`. The
    # shared 401 and 429 above are frozen and written before the module is reached.
    RecordBadRequest:
      x-frozen: sha256:f12d33b72a30b44330c8b367ec6665d2d3da79e76e27bad201ca92c62fce2b95
      description: Input does not match the contract (query parameter, path or body).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: period, code: pattern, message: Usa el formato AAAA-MM. }
    RecordReadOnly:
      x-frozen: sha256:c1299ddf61d9cd0f49039bbff4ce79db094875cbcd3936fa740f2b8672cef28f
      description: Read-only access (trial over, no active plan). Never a trial-cap refusal.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    RecordNotFound:
      x-frozen: sha256:c6dae32a37504e595548ee4cb265478e4d55db19194c742902dcc08453c9c00f
      description: >-
        The taxpayer or record does not exist, belongs to another user, is deleted or purged,
        its id is malformed, or the module is disabled (indistinguishable on purpose).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    RecordTaxpayerArchived:
      x-frozen: sha256:b66f9bb35ad2a974e840f92ec2dda4b7e9d777fee6985e3202a153933c2db265
      description: The taxpayer is archived; archive freezes its records (OQ-5).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: business_rule_violation
              message: This taxpayer is archived. Unarchive it to make changes.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    RecordRestoreRefused:
      x-frozen: sha256:b1873a050742287d1052152f8f21f656e0ebe12dd6e8514b19a1403d712a6aad
      description: >-
        The regime no longer covers the record's dates (`regime_not_active`), or the
        taxpayer is archived (`taxpayer_archived`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            regimeNotActive:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime_code, code: regime_not_active, message: El régimen ya no cubre la fecha de este registro. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    IncomeRuleViolation:
      x-frozen: sha256:f7d8df739837a67a0b6b9667009d3e5ce7a801c4d6468bb1aa941f94a1a25ef3
      description: >-
        Well-formed but violates an income rule: regime window, archived taxpayer, IVA rate
        or amount, withholdings, 625 activity (`details[].code`: see `createIncome`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            regimeNotActive:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime_code, code: regime_not_active, message: No tienes este régimen en la fecha del ingreso. }
            rateNotValidOnDate:
              value:
                error:
                  code: business_rule_violation
                  message: The IVA rate is not valid on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: iva_rate, code: rate_not_valid_on_date, message: La tasa de 8 % no está vigente en esa fecha. }
            ivaAmountMismatch:
              value:
                error:
                  code: business_rule_violation
                  message: The IVA amount does not match the rate.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: iva_cents, code: iva_amount_mismatch, message: El IVA no corresponde a la tasa elegida. }
            withholdingNotApplicable:
              value:
                error:
                  code: business_rule_violation
                  message: This withholding does not apply.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: isr_withheld_cents, code: withholding_not_applicable, message: Una persona física no te retiene ISR. }
            activityNotHeld:
              value:
                error:
                  code: business_rule_violation
                  message: The activity is not among the taxpayer's platform activities.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: platform_activity, code: activity_not_held, message: No registraste esta actividad en el régimen 625. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    ExpenseRuleViolation:
      x-frozen: sha256:c55b311d08f2cf5cf27ae61256cfbaa7c72f56107b51946c68e5540e33b6763f
      description: >-
        Well-formed but violates an expense rule: regime window, archived taxpayer, IVA rate
        or amount, withholdings (`details[].code`: see `createExpense`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            regimeNotActive:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime_code, code: regime_not_active, message: No tienes este régimen en la fecha del pago. }
            withholdingNotApplicable:
              value:
                error:
                  code: business_rule_violation
                  message: This withholding does not apply.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: isr_withheld_cents, code: withholding_not_applicable, message: Sólo una persona moral retiene a sus proveedores. }
            withholdingExceedsBase:
              value:
                error:
                  code: business_rule_violation
                  message: The withholding is larger than its base.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: iva_withheld_cents, code: withholding_exceeds_base, message: La retención de IVA no puede ser mayor que el IVA. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    RecordInternalError:
      x-frozen: sha256:5858fcd0e7a448f789705e367a96b2ff9252d1de37af59c6c02dd5b5b687b549
      description: Unexpected server error.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }

  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      examples: [0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80]
    Period:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    FiscalYear:
      type: integer
      minimum: 2022
      maximum: 2100
      examples: [2026]
    RegimeCode:
      x-frozen: sha256:3f49f98d72a3b659908b61f100b5335d9748fd3ede9229802c6a4c82c1904014
      type: string
      pattern: '^[0-9]{3}$'
      description: SAT c_RegimenFiscal code.
      examples: ['612']
    MoneyCents:
      type: integer
      format: int64
      description: Signed amount in MXN centavos.
      examples: [1250000]
    NonNegativeCents:
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999999999
      description: Amount in MXN centavos (>= 0).
