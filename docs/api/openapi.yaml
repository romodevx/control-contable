        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
