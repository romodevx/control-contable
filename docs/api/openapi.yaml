          schema: { $ref: '#/components/schemas/FiscalYear' }
      responses:
        '200':
          description: Calendar.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token, 15 min TTL (ADR-0001 O6).
    revenueCatWebhookSecret:
      type: http
      scheme: bearer
      description: Shared secret configured in the RevenueCat dashboard as the Authorization header value.

  parameters:
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RegimeCodePath:
      name: regimeCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RegimeCode' }
    PeriodPath:
      name: period
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    PeriodQuery:
      name: period
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    RegimeQuery:
      name: regime
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RegimeCode' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `next_cursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Confirm:
      name: confirm
      in: query
      required: false
      description: Must be `true` to perform a destructive or data-affecting action.
      schema: { type: boolean, default: false }
    OnDate:
      name: 'on'
      in: query
      required: false
      description: >-
        Date the dated parameters are read on (America/Mexico_City); defaults to today.
        `2026-01-01` (the first fiscal year with a tax parameter set) … today (`out_of_range`).
      schema: { type: string, format: date }
    # Shared query parameters of the two withholding previews (ADR-0008).
    PreviewRegime:
      name: regime
      in: query
      required: true
      description: The record's `regime_code`; must be held by the taxpayer on `on` (`422 regime_not_active`).
      schema: { $ref: '#/components/schemas/RegimeCode' }
    PreviewAmountCents:
      name: amount_cents
      in: query
      required: true
      description: Subtotal before IVA, MXN centavos (as `amount_cents` of the record).
      schema: { $ref: '#/components/schemas/PositiveCents' }
    PreviewIvaRate:
      name: iva_rate
      in: query
      required: true
      schema: { $ref: '#/components/schemas/IvaRate' }
    PreviewIvaCents:
      name: iva_cents
      in: query
      required: true
      description: The IVA of the record, the base of the IVA shares (same tolerance rule as the record).
      schema: { $ref: '#/components/schemas/NonNegativeCents' }
    PreviewOperationKind:
      name: operation_kind
      in: query
      required: false
      description: Omitted → the default the matching create would store.
      schema: { $ref: '#/components/schemas/OperationKind' }
    PreviewResidentialRent:
      name: residential_rent
      in: query
      required: false
      description: Default `false`; `true` requires `iva_rate=exempt` (`422 residential_rent_exempt`).
      schema: { type: boolean }

    # Annual (ANN-02, ADR-0009).
    FiscalYearPath:
      name: fiscalYear
      in: path
      required: true
      description: Fiscal year (2026 .. the current year, America/Mexico_City). Before 2026 → `422`; after the current year → `400 out_of_range`.
      schema: { $ref: '#/components/schemas/FiscalYear' }
    FiscalYearQuery:
      name: fiscal_year
      in: query
      required: true
      description: Fiscal year (2026 .. the current year, America/Mexico_City). Before 2026 → `422`; after the current year → `400 out_of_range`.
      schema: { $ref: '#/components/schemas/FiscalYear' }
    StatementId:
      name: statementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    DeductionId:
      name: deductionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  headers:
    NoStore:
      x-frozen: sha256:54eb73c86a25f912c1a1c22a4e6556ebc433a024e2a0e05d9c262e1ac8247077
      description: >-
        Every response of the API, success or error, carries `Cache-Control: no-store` (RFC 9111
        section 5.2.2.5; RFC 6749 section 5.1): tokens, account data, taxpayer and financial
        records, estimates and error envelopes are never kept by any cache (S-11; M3/M4
        security gate G-1). One edge middleware writes it, so it is also on a `404` written
        before routing (module OFF, unknown route), a `401`, a `429` and a `500`. The only
        exception is the public `200` of `listLegalDocuments` (`public, max-age=300`); an error
        is always `no-store`.
      required: true
      schema: { type: string, const: no-store }
    WWWAuthenticate:
      x-frozen: sha256:1fb572380b171f3d3847035780f005b1158e8a42950cfd242777120d95b7c79c
      description: >-
        The bearer challenge every `401` of a secured operation carries (RFC 9110 section
        15.5.2; RFC 6750 section 3). One fixed value with no `error` attribute, so it never
        says why the credentials were refused.
      required: true
      schema: { type: string, const: 'Bearer realm="control-contable"' }

  responses:
    BadRequest:
      description: Input does not match the contract.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - field: amount_cents
                  code: minimum
                  message: Must be greater than or equal to 0.
    Unauthorized:
      x-frozen: sha256:050a311e4c04ae350c31f81dc9b5962588bd1d9bbdb20103e4fea5d6a1a0e8d0
      description: Missing, invalid or expired credentials.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: Authentication required., request_id: req_01J9Z6Q4X8 }
    PaymentRequired:
      description: Trial ended or cap reached and no active plan (read-only access).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    NotFound:
      description: Resource does not exist, belongs to another user, or its module is disabled.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    TooManyRequests:
      x-frozen: sha256:89eccc2094ae6459e884b30bab0fe97caf134e85f3d8dc00997b2e7e328c46bd
      description: Rate limit exceeded.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After:
          description: >-
            Whole seconds until the next attempt can be admitted (RFC 9110 §10.2.3, delay-seconds
            form), rounded up, at least 1. Sent on every 429 (M1-10).
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., request_id: req_01J9Z6Q4X8 }
    InternalError:
      description: Unexpected server error.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }
    ServiceUnavailable:
      description: Dependency unavailable (database, RevenueCat); retry later.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: upstream_unavailable, message: Service temporarily unavailable., request_id: req_01J9Z6Q4X8 }

    # M3/M4 record errors (S-11 / P0-30 D-6). Like every response, they declare
    # `Cache-Control: no-store` (components.headers.NoStore).
    RecordBadRequest:
      x-frozen: sha256:db359836813d00d97649cc65e9fbe10f4d16fabdd186a105cb9f4ae5573a8bda
      description: Input does not match the contract (query parameter, path or body).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: period, code: pattern, message: Usa el formato AAAA-MM. }
    RecordReadOnly:
      x-frozen: sha256:d0dca045341a9696eba5958e92221869012696716a1c6ee7a8fabf8a9197e140
      description: Read-only access (trial over, no active plan). Never a trial-cap refusal.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    RecordNotFound:
      x-frozen: sha256:ee57806752a735c218b89426deda55195c351f8dcba2b954e8ca7b760773f882
      description: >-
        The taxpayer or record does not exist, belongs to another user, is deleted or purged,
        its id is malformed, or the module is disabled (indistinguishable on purpose).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    RecordTaxpayerArchived:
      x-frozen: sha256:166b5ae2ae464eae66e8a147d3406a6b51b8f6b4bb266dbbc0fe8bc89415819f
      description: The taxpayer is archived; archive freezes its records (OQ-5).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: business_rule_violation
              message: This taxpayer is archived. Unarchive it to make changes.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    RecordRestoreRefused:
      x-frozen: sha256:23726f1aaed623f5495c6f2f415e28b7f55036754552c0241b65299cdbb1f160
      description: >-
        The regime no longer covers the record's dates (`regime_not_active`), or the
        taxpayer is archived (`taxpayer_archived`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            regimeNotActive:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime_code, code: regime_not_active, message: El régimen ya no cubre la fecha de este registro. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    IncomeRuleViolation:
      x-frozen: sha256:954d42efac186995b1ac869807399df3369c8df19abb9c3bed0b5c939a0e47db
      description: >-
        Well-formed but violates an income rule: regime window, archived taxpayer, IVA rate
        or amount, withholdings, 625 activity (`details[].code`: see `createIncome`).
        `withholding_not_applicable` and `withholding_exceeds_base` are retired by WH-06 (no
        typed amount is left to check); `residential_rent_exempt` is new in 0.10.0.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            regimeNotActive:
              value:
                error:
