    # ------------------------------------------------------------ subscriptions
    SubscriptionPlan:
      type: object
      description: |
        Active store plan. A named component (not inline in `SubscriptionStatus.plan`):
        inline objects inside `oneOf` make the Dart generator name their enums after the
        bare property, and `period` overwrote the `Period` component (ADR-0003).
      required: [product_id, period, store, expires_at, will_renew]
      properties:
        product_id: { type: string }
        period: { type: string, enum: [weekly, monthly, yearly] }
        store: { type: string, enum: [app_store, play_store] }
        expires_at: { type: string, format: date-time }
        will_renew: { type: boolean }
        management_url: { type: [string, 'null'], format: uri }
      examples:
        - product_id: cc_pro_monthly
          period: monthly
          store: app_store
          expires_at: '2026-11-13T16:00:00Z'
          will_renew: true
          management_url: 'https://apps.apple.com/account/subscriptions'
    SubscriptionStatus:
      type: object
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccessSummary' }
        plan:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionPlan'
            - type: 'null'
      examples:
        - access: { access: trial, trial_ends_at: '2026-10-20T16:00:00Z', incomes_remaining: 3, expenses_remaining: 5 }
          plan: null
    RevenueCatWebhook:
      type: object
      required: [api_version, event]
      description: Subset we rely on; unknown fields are accepted and stored raw.
      properties:
        api_version: { type: string, examples: ['1.0'] }
        event:
          type: object
          required: [id, type, app_user_id, event_timestamp_ms]
          additionalProperties: true
          properties:
            id: { type: string }
            type: { type: string, examples: [INITIAL_PURCHASE, RENEWAL, CANCELLATION, EXPIRATION, TRANSFER, TEST] }
            app_user_id: { type: string }
            original_app_user_id: { type: string }
            product_id: { type: string }
            entitlement_ids:
              type: [array, 'null']
              items: { type: string }
            environment: { type: string, enum: [SANDBOX, PRODUCTION] }
            store: { type: string }
            event_timestamp_ms: { type: integer, format: int64 }
            expiration_at_ms: { type: [integer, 'null'], format: int64 }
      examples:
        - api_version: '1.0'
          event:
            id: CDD2F2E3-6A2C-4B1F-9E0D-3F5A7B9C1D2E
            type: INITIAL_PURCHASE
            app_user_id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
            original_app_user_id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
            product_id: cc_pro_monthly
            entitlement_ids: [pro]
            environment: SANDBOX
            store: APP_STORE
            event_timestamp_ms: 1791907200000
            expiration_at_ms: 1794585600000

