        (§2.3). Persona moral taxpayers only: for a persona física any supplier parameter
        answers `422` `supplier_not_applicable` (the form has no such section). `on` is the
        payment date (default today): it picks the dated rates and `remit_due_on`.
        `operation_kind` omitted → the default of `category_code`. Same validation and codes
        as `createExpense` for the fields it takes (`400`: malformed, `out_of_range`,
        `unknown_category`; `422`: `regime_not_active`, `rate_not_valid_on_date`,
        `iva_amount_mismatch`, `residential_rent_exempt`, `supplier_not_applicable`). Reads are
        allowed for a read-only user and an archived taxpayer (no `402`). Budget
        `withholding_previews` (1200 per hour per user, shared with
        `previewIncomeWithholdings`); spent → `429 rate_limited` with `Retry-After`.
