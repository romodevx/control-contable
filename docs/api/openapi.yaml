  /v1/taxpayers/{taxpayerId}/annual-estimates/{fiscalYear}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/FiscalYearPath'
    get:
      tags: [Annual]
      operationId: getAnnualEstimate
      x-frozen: sha256:e7b9e026bda2aea190b5a26d20cfc253ea09be005fea54c4579b3f76bf5c45ce
      summary: Annual return estimate (declaración anual) of one taxpayer and fiscal year
      description: >-
        Roughly how much the taxpayer will owe, or get back, in the annual return of
        `fiscalYear`, and by when. Derived from the current records, annual inputs and tax
        inputs on every read, never stored (ADR-0002 §5, ADR-0009); same inputs, parameters
        and engine version → byte-identical JSON. It never files and never changes a monthly
        figure.


        **Sections** (MODULE-annual §2.2, fixed order `pf_art152`, `pf_resico_check`,
        `pm_601`, `pm_resico`, then one `explanation` per other regime held in the year, in
        catalog order). A persona física's 605, 606, 612 and 625 non-definitive incomes are
        aggregated in **one** `pf_art152` section (LISR 152); RESICO PF (626) is an
        informative 113-F check that never has a payable or refundable balance (rule 3.13.7);
        PM 601 and RESICO PM are estimated per regime; every other regime is an `explanation`
        section with its deadline and no figure. A regime counts when its window intersects
        the fiscal year, archived regimes included for their active months.
        `headline_sections` names the sections whose `tax.balance` is the headline: PF the
        `pf_art152` section, PM its 601 / RESICO PM sections (each shown on its own, never
        netted); informational sections never feed it.


        **Status per section** (precedence `informational` > `incomplete` > `complete`):
        `incomplete` is computed with the documented fallback and lists `missing_inputs`
        (whose `target` is the screen the "Completa tus datos" CTA opens). A month with no
        filed payment uses the app's own monthly estimate (`payments_estimated` disclaimer),
        which is **not** missing unless that month's estimate was itself incomplete.


        **Year in progress.** When `fiscalYear` is the current year (America/Mexico_City),
        `year_status` is `in_progress`, every figure uses the records through `data_through`
        (the last closed month, `null` in January) and the `year_in_progress` disclaimer is
        present; December is never extrapolated (OQ-A3).


        `legend` is the mandatory constant; the client renders the server field. Rules a CPA
        has not validated still run with their documented default, set `cpa_review_pending`,
        list `cpa_topics` and add the `cpa_review_pending` disclaimer (severity `strong`).
        Reads are allowed for a read-only user and for an archived taxpayer (no `402`).
        Budget: `estimate_reads` (ADR-0005), one read plus one more when the 12-month
        estimate range is needed for default payments; spent → `429` with `Retry-After`.


        `FieldError.code` values beyond JSON Schema keywords: `fiscalYear` → `out_of_range`
        (a year after the current one). `422 business_rule_violation` details: `fiscalYear`
        → `parameters_unavailable` (before 2026, the first fiscal year with transcribed
        parameters).
