                      - { key: ytd_before_app_income, label: Ingresos del ejercicio antes de usar la app, kind: money, required: false }
                      - { key: ytd_before_app_deductions, label: Deducciones del ejercicio antes de usar la app, kind: money, required: false }
                      - { key: ptu_paid, label: PTU pagada en el ejercicio, kind: money, required: false }
                      - { key: prior_year_losses, label: Pérdidas fiscales de ejercicios anteriores, kind: money, required: false }
                    values:
                      - { key: prior_provisional_payments, month: 1, value_cents: 200000, value_rate: null, value_bool: null }
                      - { key: prior_provisional_payments, month: 2, value_cents: 200000, value_rate: null, value_bool: null }
