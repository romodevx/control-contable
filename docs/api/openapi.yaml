      tags: [Incomes]
      operationId: getIncome
      summary: Get an income
      x-module: module_incomes
      responses:
        '200':
          description: Income.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Incomes]
      operationId: updateIncome
      summary: Edit an income (402 when access is read-only)
      x-module: module_incomes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Incomes]
      operationId: deleteIncome
      summary: Soft-delete an income (undo via restore)
      x-module: module_incomes
      responses:
        '204': { description: Deleted (restorable). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/incomes/{incomeId}/restore:
