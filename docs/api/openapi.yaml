        '400': { $ref: '#/components/responses/AnnualBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AnnualNotFound' }
        '422': { $ref: '#/components/responses/RecordTaxpayerArchived' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/personal-deductions/{deductionId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/DeductionId'
    post:
      tags: [Annual]
      operationId: restorePersonalDeduction
      x-frozen: sha256:353493f649331f71c29d7655009dc0e442082e5ca6c2dce51c243035c32b4df7
      summary: Undo a personal-deduction delete
      description: >-
        Clears `deleted_at`. Allowed for a read-only user (no access check, never `402`):
        Undo gives back the user's own row and uses no trial slot, as `restoreIncome`. The
        list bound **is** re-checked: it bounds the unpaginated list and the O(rows)
        deduction pass (ADR-0009), so a year that already holds 500 live deductions (rows
        created after the delete) answers `422 limit_reached` and the row stays restorable
        until it is purged. Restoring a live deduction answers `200` unchanged; a purged
        one, or another user's, `404`. An archived taxpayer answers `422 taxpayer_archived`.
        `warnings` are computed as on create. Budget: `annual_writes`.


        `422 business_rule_violation` details: `taxpayerId` → `taxpayer_archived`; `body` →
        `limit_reached` (500 live deductions in the row's fiscal year).
      x-module: module_annual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restored.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalDeduction' }
        '400': { $ref: '#/components/responses/AnnualBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AnnualNotFound' }
        '422': { $ref: '#/components/responses/AnnualRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/regimes/{regimeCode}/filed-payments/{fiscalYear}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/RegimeCodePath'
      - $ref: '#/components/parameters/FiscalYearPath'
    get:
      tags: [Annual]
      operationId: getFiledPayments
      x-frozen: sha256:bf10c2a7cbb93da3bcab19acd431f6709801f07bf9cf09dffeec7498feb0609e
      summary: The 12 provisional ISR payments of one regime and year, with their source
      description: >-
        One row per month (January .. December) with the provisional ISR payment the
        annual estimate credits and where it comes from (MODULE-annual §2.5, OQ-A1):
        **(1)** `filed_cents`, the amount the user confirmed or typed here → **(2)**
        `tax_input_cents`, the M5 tax input `prior_provisional_payments` of that month →
        **(3)** `app_estimate_cents`, the app's own monthly estimate for the regime
        (`max(0, isr)`). `effective_cents` and `source` are the first present. A month
        outside the regime's window, or not closed yet in the current year, is `in_window:
        false` or carries `source: none`. The screen prefills the 12 inline rows with
        `effective_cents`; "Confirmar todos" sends them to `putFiledPayments`.


        Only regimes with provisional ISR payments: 606, 612, 625 (without the definitive
        option), 626, 601. Reads are allowed for a read-only user and an archived taxpayer.
        Budget: `estimate_reads` (one read plus one for the 12-month estimate range).


        `FieldError.code` values beyond JSON Schema keywords: `fiscalYear` → `out_of_range`
        (a future year). `422 business_rule_violation` details: `fiscalYear` →
        `parameters_unavailable`; `regimeCode` → `regime_not_active` (not held in any month
        of the year) or `payments_not_applicable` (a held regime without provisional ISR
        payments, e.g. 605 or 625 with the definitive option).
      x-module: module_annual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The year's 12 months.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiledPayments' }
        '400': { $ref: '#/components/responses/AnnualBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/AnnualNotFound' }
        '422': { $ref: '#/components/responses/AnnualRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    put:
      tags: [Annual]
      operationId: putFiledPayments
      x-frozen: sha256:40ede7cb4573f07603704290b2d939435b7dd4cd4b636eee7121dd34f419095f
      summary: Replace the confirmed provisional ISR payments of one regime and year
      description: >-
        Replaces **all** confirmed months of `(taxpayer, regime, fiscalYear)` with
        `months` (an empty array clears them; an absent month is "not confirmed", so the
        estimate falls back to the tax input or the app estimate). Idempotent. At most one
        entry per month; `amount_cents >= 0` is the amount actually paid (`0` is a confirmed
        zero). Answers the same body as `getFiledPayments`.


        **Order of checks:** schema (`400`) → read-only access (`402`, OQ-A9) → archived
        taxpayer, fiscal year, regime and window (`422`) → month rules (`400`) → replace.
        Budget: `annual_writes` plus the `estimate_reads` of the answer. Audited as
        `annual_filed_payments.updated` with user, taxpayer, regime and fiscal year only.


        `FieldError.code` values beyond JSON Schema keywords (`field` is
        `months.<index>[.<property>]`): `invalid` (a repeated month); `out_of_range` (a
        month not closed yet in the current year); `fiscalYear` → `out_of_range` (a future
        year). `422 business_rule_violation` details: `taxpayerId` → `taxpayer_archived`;
        `fiscalYear` → `parameters_unavailable`; `regimeCode` → `regime_not_active` or
        `payments_not_applicable`; `months.<index>.month` → `regime_not_active` (a month
        outside the regime's window).
      x-module: module_annual
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiledPaymentsUpdate' }
      responses:
        '200':
          description: Saved; the 12 months as `getFiledPayments` answers them.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiledPayments' }
        '400': { $ref: '#/components/responses/AnnualBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/RecordReadOnly' }
        '404': { $ref: '#/components/responses/AnnualNotFound' }
        '422': { $ref: '#/components/responses/AnnualRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

  # ---------------------------------------------------------------- M9 Reminders
  /v1/devices:
