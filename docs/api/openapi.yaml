          period: '2026-03'
          is_empty: false
          estimate:
            taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
            period: '2026-03'
            due_date: '2026-04-17'
            legend: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
            disclaimers:
              - code: not_tax_advice
                text: Estimación informativa. No sustituye la declaración ante el SAT ni la asesoría de un contador. Cálculo basado en LISR, LIVA, LIF 2026 y Anexo 8 RMF 2026.
