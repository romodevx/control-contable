      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/RegimeCodePath'
      - name: fiscal_year
        in: query
        required: true
        description: Fiscal year of the inputs; 2026 … the current year (America/Mexico_City).
        schema: { $ref: '#/components/schemas/FiscalYear' }
    get:
      tags: [TaxEngine]
      operationId: getTaxInputs
      x-frozen: sha256:288c63ecc9fa4c7c0bdb0ce85d76b7b7b6aa376f609ab1c6a5608529e635699c
      summary: Tax inputs of one regime and fiscal year, with their definitions
      description: >-
        The per-fiscal-year inputs the regime's estimate needs (`definitions`, exactly the
        catalog's `regimes.required_inputs`) and the stored `values`. A key with no value is
        absent from `values`. `TaxInputDef.required` says the key can be required in some
        period of the year; which keys and months are missing **for a given period** is
        `RegimeEstimate.missing_inputs` (e.g. prior provisional payments are never required
        for January). This is the target of the "Completa tus datos" CTA. Reads are allowed
        for a read-only user and for an archived taxpayer.


        `FieldError.code` values beyond JSON Schema keywords: `fiscal_year` → `out_of_range`
        (a future year). `422 business_rule_violation` details: `fiscal_year` →
        `parameters_unavailable` (before 2026); `regimeCode` → `regime_not_active` (the
        taxpayer does not hold the regime in any month of that fiscal year).
      x-module: module_tax_engine
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inputs and definitions.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxInputs' }
              examples:
                regime612:
                  summary: 612 PF, 2026, prior payments for January and February
                  value:
