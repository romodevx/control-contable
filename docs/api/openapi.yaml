    WarningCode:
      type: string
      description: >-
        Append-only (like `ErrorCode`, not frozen): the single list of `Warning.code` values.
        Clients show the `message` of a code they do not know. Taxpayers (M2):
        `rfc_check_digit_mismatch` on `rfc` (D-RFC); `regime_combination_needs_cpa_review` on
        `regimes.N.regime_code` (create) or `regime_code` (add regime), the pair overlaps in
        time and its compatibility is not yet verified by a CPA, `message` carries the pair's
        `reason`. Incomes (M3): `duplicate_cfdi_uuid` on `cfdi_uuid` (another live record of
        the taxpayer has the same folio fiscal); `withholding_differs_from_rate` on
        `isr_withheld_cents` / `iva_withheld_cents` (the CFDI wins); `provisional_parameters`
        on `collected_on` / `invoiced_on` (the rates checked on that date come from a
        provisional parameter set: its fiscal year is not published yet, so the previous
        year's values apply, or the set is marked provisional; M3-04). Expenses (M4):
        `cash_over_threshold` on `payment_method`; `no_cfdi` on `has_cfdi`;
        `not_isr_deductible_in_regime` and `category_not_deductible` on `deductible`;
        `duplicate_cfdi_uuid` on `cfdi_uuid`; `iva_not_creditable_cash_payment` on
        `payment_method` (a cash payment over the limit claimed as deductible: the claim
        stands for ISR, its IVA is not creditable, LIVA 5 fr. II ⚠️; 0.6.0);
        `provisional_parameters` on `paid_on` (the payment date's fiscal year has no published
        tax parameters yet, so the IVA and cash rules used the previous year's; M4-05).
        Withholdings (MODULE-withholdings §6, ADR-0008; 0.10.0): `withholding_cpa_unverified` on
        `withholding` (a ⚠️ rule a CPA has not confirmed matched); `foreign_counterparty_not_supported`
        on `counterparty_kind` (incomes) or `supplier_kind` (expenses); `supplier_regime_unknown`
        on `supplier_regime` (derived as 612); `deduction_requires_remittance` on `withholding`
        (an expense with a withholding above 0 is deductible only if it is remitted by the 17th
        of the next month). `withholding_differs_from_rate` is **retired**: WH-06 stops sending
        it, and it stays in the list because the list is append-only. Annual (MODULE-annual,
        0.11.0): `cash_not_deductible` on `payment_method` (a personal deduction of a
        cash-restricted category paid in cash is stored but never applied);
        `salary_regime_not_held` on `fiscal_year` (a salary constancia of a year in which the
        taxpayer does not hold 605: accepted, add the regime, OQ-A2).
      enum:
        - rfc_check_digit_mismatch
        - regime_combination_needs_cpa_review
        - duplicate_cfdi_uuid
        - withholding_differs_from_rate
        - cash_over_threshold
        - no_cfdi
        - not_isr_deductible_in_regime
        - category_not_deductible
        - iva_not_creditable_cash_payment
        - provisional_parameters
        - withholding_cpa_unverified
        - foreign_counterparty_not_supported
        - supplier_regime_unknown
        - deduction_requires_remittance
        - cash_not_deductible
        - salary_regime_not_held
