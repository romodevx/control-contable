                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: period, code: parameters_unavailable, message: Sólo hay datos desde enero de 2026. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

