      description: No password and no name (D8); both go in `VerifyEmailRequest`.
      properties:
        email: { type: string, format: email, maxLength: 254, description: 'Trimmed, lower-cased and NFC-normalised server-side before lookup or hashing.' }
        accepted_documents:
          type: array
