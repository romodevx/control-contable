openapi: 3.1.0
info:
  title: Control Contable API
  version: 0.11.2
  summary: Monthly IVA and provisional ISR estimates for Mexican taxpayers.
  description: |
    Spec-first contract (single source of truth). Server stubs (oapi-codegen),
    request validation, contract tests and the Dart client are generated from it.

    Conventions:
    - Money is `int64` centavos (`*_cents`). Rates travel as decimal strings. No floats.
    - Periods are `YYYY-MM`. Business dates are `date` (America/Mexico_City calendar).
    - Every error uses the single `ErrorResponse` envelope.
    - Every operation declares `x-module`. When that module's flag is OFF the server
      answers `404 not_found`, indistinguishable from a missing resource.
    - Operations without authentication declare `security: []` AND `x-public: true`.
    - Nodes marked `x-frozen: sha256:<hash>` are frozen; changing them is governed by
      `docs/api/CONTRACT.md` (lint fails when a frozen node drifts from its hash).
    - Resources of other users answer `404` (RLS), never `403`.
    - Create operations accept a client-generated UUID `id`; retrying the same POST
      returns the existing resource (idempotent against double submit).
      Reusing an `id` with a different body, or an `id` that already exists outside
      the caller's scope, answers `409 conflict` (never reveals the other row).

    Status: DRAFT 0.1.0 (Phase 2 Design). Regime-specific shapes (regime options,
    tax-input keys, breakdown concepts) are generic until
    `docs/research/tax-regimes-mx-2026.md` lands.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin. Local dev is http://localhost:8080; shared environments are set per deployment (ADR-0001 OWNER 2).
security:
  - bearerAuth: []
tags:
  - name: Platform
    description: P0 foundation (health, flags). No module flag.
  - name: Auth
    description: M1 `module_auth` - registration, sessions, account.
  - name: Taxpayers
    description: M2 `module_taxpayers` - regime catalog, taxpayers, regimes.
  - name: Incomes
    description: M3 `module_incomes`.
  - name: Expenses
    description: M4 `module_expenses`.
  - name: TaxEngine
    description: M5 `module_tax_engine` - estimates, breakdown, tax inputs.
  - name: Dashboard
    description: M6 `module_dashboard`.
  - name: Subscriptions
    description: M7 `module_subscriptions` - RevenueCat.
  - name: History
    description: M8 `module_history`.
  - name: Annual
    description: '`module_annual` - annual return estimate, its inputs (salary statements, personal deductions, filed payments). Requires `module_tax_engine` and `module_taxpayers`.'
  - name: Reminders
    description: M9 `module_reminders` - devices, settings, tax calendar.

paths:
  # ---------------------------------------------------------------- P0
  /healthz:
    get:
      tags: [Platform]
      operationId: getHealth
      x-frozen: sha256:c52fe40208663e106221cd0556cf7db0fad862ba18eeb38a767eb48e86969484
      summary: Liveness and readiness
      x-module: platform
      x-public: true
      security: []
      responses:
        '200':
          description: Service and database reachable.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok, database: ok, version: 0.1.0 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/flags:
    get:
      tags: [Platform]
      operationId: listEnabledFlags
      x-frozen: sha256:f777b8d30732afeaa05bbcfe381c65e286bc32f9ccf6e11e5e644cd6f1591a7f
      summary: Modules enabled for the client (UX only; server enforces)
      x-module: platform
      x-public: true
      security: []
      responses:
        '200':
          description: Enabled module keys.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnabledFlags' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M1 Auth
  # Frozen at M1-01 (docs/project-specs/MODULE-auth.md, decisions D1-D8). Every M1
  # operation is gated by `module_auth`: flag OFF answers 404 before decode or authn.
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      x-frozen: sha256:7189292365fa7c01d44f45e37e0f24df12017815f6b4157deaf0a3c601f3fad6
      summary: Start registration (emails a 6-digit verification code)
      description: >-
        Always answers `202 {status: verification_sent}` with the same body and comparable
        latency, whether the address is new, has a pending sign-up or already belongs to a
        verified account, so accounts cannot be enumerated (US-A1a). For a verified account
        no code is created and the owner gets a "someone tried to sign up with your email"
        notice, at most once per hour (D3). Register takes no password and no name: both are
        set at `verifyEmail` by whoever proves they own the inbox, so pre-registering someone
        else's address gives the attacker nothing (D8). For an email with a live (unexpired)
        pending sign-up the stored accepted documents are never changed: the call behaves
        like `resendVerification` for that email (same generic 202, same cooldown and rate
        limits) (D7). Only once the pending sign-up has expired does a new register replace
        it. Nothing is written to users, consents or entitlements until `verifyEmail`
        (ADR-0001 OWNER decision 1, option A).

        `accepted_documents` must carry the current version (from `listLegalDocuments`) of
        `terms` and of one privacy notice (`privacy_notice_integral` or
        `privacy_notice_simplified`). A stale version or a missing kind answers
        `400 validation_failed` on `accepted_documents`.
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              integralNotice:
                summary: Full privacy notice accepted
                value:
                  email: ana.gomez@example.mx
                  accepted_documents:
                    - { kind: privacy_notice_integral, version: '2026-10-01' }
                    - { kind: terms, version: '2026-10-01' }
              simplifiedNotice:
                summary: Simplified privacy notice accepted
                value:
                  email: jose.hernandez@example.mx
                  accepted_documents:
                    - { kind: privacy_notice_simplified, version: '2026-10-01' }
                    - { kind: terms, version: '2026-10-01' }
      responses:
        '202':
          description: Generic acknowledgement; a code was emailed if the address can register.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSent' }
        '400':
          description: Input does not match the contract or the current legal document versions.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                staleDocument:
                  summary: Accepted a legal document version that is no longer current
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - field: accepted_documents
                          code: document_version_not_current
                          message: Accept the current privacy notice and terms.
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      x-frozen: sha256:664cf2826de015ee6c601dd3bb2471251419b691ade4281d51f9bd21ff7248da
      summary: Confirm the emailed code and set the password; creates the account, starts the trial, issues tokens
      description: >-
        The password (and the optional name) is chosen here, by whoever holds the emailed
        code, never at `register`: an attacker who pre-registers someone else's address
        cannot choose the password of the account the owner later verifies (D8).

        In one transaction: creates the user with this password, stores the accepted consents
        (kind, version, accepted_at), consumes the pending sign-up and starts the trial on
        the server clock only if the email's keyed hash is not already in the trial registry
        (an account deleted and created again gets no second trial; same `201`) (US-A1b).

        The body, the password policy and the name are checked before the code: a short,
        long, common or breached password answers `400 validation_failed` on `password` (the
        value is never echoed) and does not count as a try. A wrong, expired, consumed or
        unknown code, or an unknown email, answers `401` with one generic message. Each wrong
        try counts against the code; after 5 the code is dead and every try answers `401`
        until `resendVerification`.
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '201':
          description: Account created and session started.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          description: Input does not match the contract or the password policy (checked before the code; not a try).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                weakPassword:
                  summary: Password common or breached (a short or long one fails the schema first, code minLength/maxLength)
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - field: password
                          code: password_policy
                          message: Use at least 12 characters that are not a common or leaked password.
        '401':
          description: The code is wrong, expired, consumed or unknown (one generic answer).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: unauthorized, message: The code is invalid or has expired., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      x-frozen: sha256:0dcd40ee679254a559bf076bc760ecadd8ab508850dd7e5b5d1462439bb20387
      summary: Email a new verification code for a pending sign-up
      description: >-
        For a pending sign-up, a new code replaces the old one (attempts reset). Always
        answers the same `202 {status: verification_sent}`: also when there is no pending
        sign-up, the email is already verified, or the last resend was less than 60 s ago
        (the cooldown is silent so it is not an oracle; the app shows a 60 s countdown)
        (US-A1c, D2). A `register` for an email with a live pending sign-up takes this same
        path and shares its cooldown and limits; neither call ever changes the pending
        sign-up's accepted documents (D7). A pending sign-up holds no password: it is set at
        `verifyEmail` (D8).
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendVerificationRequest' }
      responses:
        '202':
          description: Generic acknowledgement; a new code was emailed if a pending sign-up exists and the cooldown allows it.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationSent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-frozen: sha256:7471ae4366808d69707fe5d7fb244cc1b4399292f76a2932dda3379d7d616d63
      summary: Log in with email and password (starts a new token family)
      description: >-
        A wrong password, an unknown email and a pending (unverified) sign-up all answer the
        same `401` body with comparable latency (US-A2a). Too many failures for the account
        or the client answer `429 rate_limited` with `Retry-After`.
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong credentials, unknown email or unverified sign-up (one generic answer).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: unauthorized, message: Email or password is incorrect., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-frozen: sha256:74d54569e018dd94c95ec58a26c8ac027fe6d614176275eae9fbbfe3fa6d8527
      summary: Rotate the refresh token
      description: >-
        A live refresh token is rotated: the response carries a new pair and the old token
        is marked rotated (US-A2b). Reusing an already-rotated token revokes its whole family
        and answers `401`; of two concurrent refreshes with the same token exactly one wins
        and the other is treated as reuse. An expired (30-day sliding or 90-day absolute),
        revoked, malformed or foreign token answers `401`.
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refresh token expired, revoked, reused, malformed or unknown (one generic answer).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: unauthorized, message: Your session has ended. Sign in again., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-frozen: sha256:301257a867a314c9dab566d583aa7afc1be45ff7fcc8959a1b46f561899a2ecf
      summary: Revoke the refresh token family
      description: >-
        Revokes the family of the given refresh token (US-A2c). Idempotent: a refresh token
        that is already revoked or not the caller's also answers `204`, so another user's
        token state is never revealed. A missing or invalid bearer answers `401`.
      x-module: module_auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Logged out (also when the token was already revoked or not the caller's).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      x-frozen: sha256:e176376569713d53dada92cdc1d2c1a3a4aa0ea451ab88ba693039980f5d11ae
      summary: Current user profile
      x-module: module_auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Auth]
      operationId: updateMe
      x-frozen: sha256:9eca15091a862adc715f4c1eaec4bd00c218a5253eda2e30e467f2154f6a8feb
      summary: Update profile (name only; email change is out of scope)
      x-module: module_auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated profile.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Auth]
      operationId: deleteMe
      x-frozen: sha256:4c78c18fbed0a897c45127cd5555f0eb0e4f4fd03bfcf76966a221d476259676
      summary: Delete the account and all its data (irreversible; requires the current password)
      description: >-
        Re-authenticates with the current password (D4), then in one transaction deletes the
        user and everything it owns (taxpayers, records, consents, refresh tokens, usage,
        entitlements) and answers `204` (US-A4). Consents are deleted too (D6); only the
        keyed email hash survives in the trial registry (no second trial). The store
        subscription is not cancelled (the app explains how). Any later call with the old
        access token answers `401`.

        A wrong password answers `403 invalid_password` and deletes nothing: the bearer was
        valid, so it is not a `401` (which always means the bearer, carries the challenge and
        is the client's cue to refresh). Each account gets 5 password attempts, then one more
        every 3 minutes (`429 rate_limited` with `Retry-After`); a body without `password`
        answers `400 validation_failed` and spends no attempt.
      x-module: module_auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204':
          description: Account and all its data deleted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Wrong current password; nothing was deleted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: invalid_password, message: The password is incorrect., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/legal/documents:
    get:
      tags: [Auth]
      operationId: listLegalDocuments
      x-frozen: sha256:f32c46b4e9b150c8d423a8974896170d8fbc35ac4725a43ef2dcee0948d8e3b8
      summary: Current privacy notices and terms
      description: >-
        The current version of each legal document kind (US-A5). The register screen links to
        them and sends back the versions shown in `accepted_documents`. Versions are data,
        not code.
      x-module: module_auth
      x-public: true
      security: []
      responses:
        '200':
          description: Current version of each kind.
          headers:
            Cache-Control:
              description: >-
                Shared caches may keep the list for 5 minutes (RFC 9111): it is public and
                the same for everyone, and a new version takes effect within that window.
              required: true
              schema: { type: string, const: 'public, max-age=300' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M2 Taxpayers
  /v1/regimes:
    get:
      tags: [Taxpayers]
      operationId: listRegimes
      x-frozen: sha256:d7712355da7dc80498e5e396989864b238727d228cbc2fed215b556a912d89cf
      summary: Regime catalog for one person type (support level, options, inputs, compatibility)
      description: >-
        Every SAT `c_RegimenFiscal` key selectable for `person_type` (catalog key is
        `(code, person_type)`: 626 and 610 exist for both). `treatment` is the support level:
        `full`, `partial` or `informational` (an informational or partial regime carries a
        plain-language `explanation`, shown at selection time). `option_defs` drive the
        per-regime options form and their server-side validation; `required_inputs` are the
        per-fiscal-year tax-input keys the estimate needs (M5, not options);
        `incompatible_with` lists the regimes it cannot overlap in time, with the reason.
        Global, read-only data: a read-only user may list it.
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      parameters:
        - name: person_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PersonType' }
      responses:
        '200':
          description: Regimes selectable for the person type, ordered by code.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegimeList' }
        '400':
          description: '`person_type` is missing or not `fisica`/`moral`.'
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: person_type, code: required, message: Choose persona física or persona moral. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers:
    get:
      tags: [Taxpayers]
      operationId: listTaxpayers
      x-frozen: sha256:fd8d9a031b4264454442720fa03d8b008a8394b86998de7d009733ec9e0bc8ee
      summary: Taxpayers managed by the user (feeds the active-taxpayer switcher)
      description: >-
        The caller's taxpayers ordered by `created_at`, then `id`. Archived taxpayers are
        left out unless `include_archived=true`. At most 10 exist per user (OD-2), so the list
        is not paginated.
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      parameters:
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Taxpayers.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Taxpayers]
      operationId: createTaxpayer
      x-frozen: sha256:af3025c4a46145a86e9ff8f7ad164c94c88529c418668d6f834c14cdc496b53b
      summary: Create a taxpayer with its regimes and options in one transaction (onboarding)
      description: >-
        Onboarding order (OD-3): person type, then RFC and display name, then regimes, then
        per-regime options. The taxpayer, every regime and every option are written in one
        transaction: on any failure nothing is persisted. `regimes` is required (at least
        one); year-to-date tax inputs are not part of this call (M5).


        The RFC is normalized (trim, upper-case, NFC, inner spaces and `-` removed), then
        validated: length for the person type (13 física, 12 moral), alphabet, real calendar
        date; the generic RFCs `XAXX010101000` and `XEXX010101000` are refused. The SAT
        módulo 11 check digit does NOT reject (D-RFC: some SAT-issued RFCs fail the published
        algorithm): a mismatch is accepted and the response carries the non-blocking warning
        `{code: rfc_check_digit_mismatch, field: rfc}` so the app asks the user to double-check.
        It is never checked against the SAT. The full RFC is never returned or echoed in an
        error: the response carries only `rfc_masked`.


        Order of checks: schema (400) → access policy (`402 entitlement_required` for a
        read-only user) → idempotent retry → cap → business rules. Retrying with a client
        `id` the caller already owns answers `200` with the existing taxpayer, even at the
        cap or for a read-only user; an `id` that exists outside the caller's scope answers
        `409 conflict`. The cap is 10 taxpayers per user for every plan, archived included,
        counted under a row lock so concurrent creates cannot overshoot
        (`422 taxpayer_limit_reached`, not 402: paying does not lift it).


        `FieldError.code` values beyond JSON Schema keywords: `rfc` → `rfc_length_mismatch`,
        `rfc_format`, `rfc_date`, `rfc_generic`;
        `regimes.N.regime_code` → `not_for_person_type`, `duplicate` (same code twice in the
        body); `regimes.N.options.<key>` → `unknown_option`, `invalid_option`, `required`;
        `regimes.N.start_period` → `out_of_range` (allowed `2026-01`, the first fiscal year
        with tax parameters, … the current month, America/Mexico_City).


        Regime compatibility (`regime_compatibility`): an overlapping pair the catalog marks
        not allowed answers `422 invalid_regime_combination`; an overlapping pair whose
        verdict still needs CPA review is allowed and the response carries one warning per
        such pair, `{code: regime_combination_needs_cpa_review, field: regimes.N.regime_code}`
        (N = the later of the two in the body), with the pair's `reason` as `message`.
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerCreate' }
            examples:
              personaFisica:
                summary: Persona física with 606 and 625 (options defaulted where omitted)
                value:
                  id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                  person_type: fisica
                  rfc: GOMA800101AB6
                  display_name: Ana (personal)
                  regimes:
                    - regime_code: '606'
                      options: { deduction_mode: blind_35 }
                      start_period: '2026-01'
                    - regime_code: '625'
                      options: { activities: [goods_services] }
                      start_period: '2026-01'
              personaMoral:
                summary: Persona moral with one regime
                value:
                  person_type: moral
                  rfc: EEJ150310QK2
                  display_name: Empresa Ejemplo
                  regimes:
                    - regime_code: '601'
                      options: { iva_fully_taxable: true }
      responses:
        '201':
          description: >-
            Created (with `warnings` when the RFC check digit does not match or a regime pair
            still needs CPA review).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
              examples:
                created:
                  value:
                    id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    person_type: moral
                    display_name: Empresa Ejemplo
                    rfc_masked: EEJ******QK2
                    regimes:
                      - regime_code: '601'
                        name: General de Ley Personas Morales
                        treatment: full
                        options: { iva_fully_taxable: true }
                        start_period: '2026-10'
                        end_period: null
                    archived_at: null
                    created_at: '2026-10-13T16:20:00Z'
                checkDigitMismatch:
                  summary: Accepted; the check digit does not match, so the app asks to double-check (D-RFC)
                  value:
                    id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    person_type: fisica
                    display_name: Ana (personal)
                    rfc_masked: GOMA******AB3
                    regimes:
                      - regime_code: '612'
                        name: Personas Físicas con Actividades Empresariales y Profesionales
                        treatment: full
                        options: { iva_fully_taxable: true }
                        start_period: '2026-01'
                        end_period: null
                    archived_at: null
                    created_at: '2026-10-13T16:05:00Z'
                    warnings:
                      - code: rfc_check_digit_mismatch
                        field: rfc
                        message: Revisa tu RFC; la homoclave no coincide con el dígito verificador.
        '200':
          description: Idempotent retry; the caller already owns a taxpayer with this `id`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '400':
          description: >-
            Input does not match the contract, or an RFC, regime, option or period rule
            (`details[].code`: see the operation description).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                rfcDate:
                  summary: The RFC date is not a real calendar date (the RFC is never echoed)
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: rfc, code: rfc_date, message: La fecha del RFC no es válida. }
                missingOption:
                  summary: A required option without default was not sent
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimes.0.options.rif_year, code: required, message: Indica el año de tributación en el RIF. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The RFC is already registered in the caller's account (active or archived), or the
            client `id` exists outside the caller's scope (generic, reveals nothing).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                rfcAlreadyRegistered:
                  value:
                    error: { code: rfc_already_registered, message: This RFC is already registered in your account., request_id: req_01J9Z6Q4X8 }
                idConflict:
                  value:
                    error: { code: conflict, message: The request conflicts with the current state., request_id: req_01J9Z6Q4X8 }
        '422':
          description: >-
            Two regimes in the body overlap in time and are incompatible, or the user already
            has 10 taxpayers (archived included).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidRegimeCombination:
                  value:
                    error:
                      code: invalid_regime_combination
                      message: A persona moral holds one regime at a time.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimes.1.regime_code, code: incompatible, message: 626 is incompatible with 601. }
                taxpayerLimitReached:
                  value:
                    error: { code: taxpayer_limit_reached, message: You have reached the maximum of 10 taxpayers., request_id: req_01J9Z6Q4X8 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Taxpayers]
      operationId: getTaxpayer
      x-frozen: sha256:18cebfe15967d9099675416948a10b6ef08d7eeee5df4021194a4a18ebfe8d88
