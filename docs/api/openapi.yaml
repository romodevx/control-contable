  /v1/taxpayers/{taxpayerId}/expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [Expenses]
      operationId: getExpense
      x-frozen: sha256:9749da319178522571a49de6761b91ef623c4ab3dcd3aa270d9d853ff9e85092
      summary: Get an expense
      description: >-
        A live expense of the taxpayer. A soft-deleted, purged, foreign or unknown expense, or
        a malformed id, answers `404`. `warnings` is always `[]` here.
      x-module: module_expenses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expense.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    patch:
      tags: [Expenses]
      operationId: updateExpense
      x-frozen: sha256:2f3aa58b2b0e3e561602bb524c7069edd93c6cd702033db019cac3ddcc578fa8
      summary: Edit an expense (merge-patch; null clears a nullable field or the override)
      description: >-
        Merge-patch on top-level fields as `updateIncome`: absent is unchanged, `null` clears
        `cfdi_uuid` or `description`, and `deductible: null` clears the user's override (the
        default applies again). Without an override the default `deductible` is recomputed
        when the category, regime, payment method, amounts, `has_cfdi` or `paid_on` change;
        an override is kept as is. Every rule of `createExpense` is re-run on the merged
        expense with the same `details[].code` values and `warnings`, and `withholding` is
        re-derived (ADR-0008). A read-only user gets
        `402`; an archived taxpayer `422 taxpayer_archived`.
      x-module: module_expenses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdate' }
            examples:
              overrideDeductible:
                summary: The user claims a restaurant expense as deductible
                value: { deductible: true }
              useSuggestedValue:
                summary: '"Usar el valor sugerido": clear the override'
                value: { deductible: null }
              changeCategory:
                value: { category_code: capacitacion }
      responses:
        '200':
          description: Updated (with `warnings` as on create).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: Input does not match the contract, or a category, CFDI or date rule (see `createExpense`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: category_code, code: unknown_category, message: Elige una categoría de la lista. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/RecordReadOnly' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/ExpenseRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      x-frozen: sha256:7404aedc82e817a02f91708ca9a7f8a0ed72e4d5566a75eddf5977797ac6c293
      summary: Soft-delete an expense (Undo via restore)
      description: >-
        As `deleteIncome`: sets `deleted_at`, restorable for 30 days, `204` also when already
        deleted, allowed for a read-only user, never frees a trial slot; an archived taxpayer
        answers `422 taxpayer_archived`.
      x-module: module_expenses
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted (restorable).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/RecordTaxpayerArchived' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/expenses/{expenseId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Expenses]
      operationId: restoreExpense
      x-frozen: sha256:c8c2b1c28f7bfe1b730290a0478994cbaa56e703d36ed324528427201601ec73
      summary: Undo a delete (never consumes a trial slot)
      description: >-
        As `restoreIncome`: clears `deleted_at` without consuming a trial slot (Undo works at
        5/5), allowed for a read-only user (never `402`, 0.6.1), regime window re-checked
        (`422 regime_not_active`), archived taxpayer `422 taxpayer_archived`, a live expense
        `200` unchanged, a purged one or another user's `404`. `deductible` is not recomputed;
        `warnings` are computed as on create; a `withholding` derived by an older
        `table_version` is re-derived (ADR-0008).
      x-module: module_expenses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restored.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/RecordRestoreRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

  # ---------------------------------------------------------------- M5 Tax engine
  # Frozen at M5-01 (docs/project-specs/MODULE-tax-engine.md §9, OQ-T1..OQ-T10 DECIDED).
  /v1/taxpayers/{taxpayerId}/estimates:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [TaxEngine]
      operationId: getTaxpayerEstimate
      x-frozen: sha256:0bef646e31e50ae467f1c16217213a46bdc9ec5957b15e3530b31bc611481b6f
      summary: Monthly IVA + provisional ISR estimate of one month, per regime and total
      description: >-
        Informational estimate for the taxpayer and `period`, derived from the current
        records and tax inputs on every read (never stored, ADR-0002 §5). `period` is
        optional: absent means the current month in America/Mexico_City. Past months back to
        the first fiscal year with published parameters (2026) are allowed; the current,
        still-open month estimates with the records so far.


        **Content.** One `RegimeEstimate` per regime held in the period (archived regimes
        included for periods up to their `end_period`), in catalog order. A taxpayer with no
        regime in the period answers `200` with `regimes: []` and zero totals. Monthly IVA is
        consolidated per taxpayer in `totals.iva` (`Σ charged_collected − Σ
        definitive_excluded − Σ creditable_paid − Σ withheld_from_taxpayer` over every
        regime, OQ-T2); it is never presented per regime as an amount to pay. A negative
        result is `in_favor` (saldo a favor, not carried to the next month, OQ-T5) and is not
