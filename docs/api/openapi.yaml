      summary: Step-by-step computation of one regime's estimate, with legal basis
      description: >-
        The computation trace of `regime` in `period` (ADR-0002 §1: strategies compute only
        by appending lines, so the explanation cannot drift from the math). `period` is
        required here and follows the rules of `getTaxpayerEstimate` (no future month,
        nothing before 2026). `lines` are in `seq` order: the regime's ISR lines, its IVA
        component lines, the taxpayer's consolidated IVA lines (`tax: iva`, LIVA 5-D, with
        `needs_cpa_review` when two or more regimes contribute IVA) and its withholdings to
        remit (`tax: withholding`). Every line except `info` and `rounding_adjustment` cites
        at least one legal basis, and `source` says where its figure comes from. Lines are
        displayed rounded to the centavo; when the displayed lines of a result do not add up
        to its rounded value, one `rounding_adjustment` line ("Ajuste por redondeo")
        reconciles them: never a hidden centavo. An `informational` regime answers its
        explanation with `lines: []`. The header is `regime.parameter_set` and
        `engine_version`. Reads are allowed for a read-only user and an archived taxpayer.


