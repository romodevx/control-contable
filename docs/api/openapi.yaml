  /v1/taxpayers/{taxpayerId}/annual-estimates/{fiscalYear}/breakdown:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/FiscalYearPath'
    get:
      tags: [Annual]
      operationId: getAnnualBreakdown
      x-frozen: sha256:5b701301ecd0ab10c75083ff2891daf57677aa1cfbf0e0bac9abaa59f6cdca0d
      summary: Step-by-step computation of one annual section, with legal basis
      description: >-
        The computation trace of `section` in `fiscalYear` (ADR-0002 §1: strategies compute
        only by appending lines, so the explanation cannot drift from the math). `fiscalYear`
        follows the rules of `getAnnualEstimate`. `lines` are in `seq` order; every line
        except `info` and `rounding_adjustment` cites at least one legal basis, and `source`
        says where its figure comes from (each provisional payment line is `filed_payment`,
        `tax_input:prior_provisional_payments` or `estimated_by_app`, §2.5). Every cap that
        binds is an `info` line "Tope aplicado: {concepto}, de {x} a {y}"; every excluded
        deduction (cash in a restricted category, donations without the prior year's
        income) is an `info` line too. One `rounding_adjustment` line reconciles displayed
        lines with a rounded result, never a hidden centavo. `disclaimers` are the estimate's
        disclaimers that bear on this section, same order. Reads are allowed for a read-only
        user and an archived taxpayer. Budget: `estimate_reads`, as `getAnnualEstimate`.


        `FieldError.code` values beyond JSON Schema keywords: `fiscalYear` → `out_of_range`
        (a future year). `422 business_rule_violation` details: `fiscalYear` →
        `parameters_unavailable` (before 2026); `section` → `section_not_present` (the
        estimate of that year has no such section).
      x-module: module_annual
      security:
        - bearerAuth: []
      parameters:
        - name: section
          in: query
          required: true
          description: A computed section kind of the estimate (`explanation` sections have no trace).
          schema: { $ref: '#/components/schemas/AnnualComputedSectionKind' }
      responses:
        '200':
          description: Breakdown of the section (always carries the annual legend and its disclaimers).
