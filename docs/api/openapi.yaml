        display_name: { type: string, minLength: 1, maxLength: 80 }
        regimes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TaxpayerRegimeCreate' }
      examples:
        - person_type: fisica
          rfc: GOMA800101AB3
          display_name: Ana (personal)
          regimes:
            - regime_code: '612'
              start_period: '2026-01'
    TaxpayerUpdate:
