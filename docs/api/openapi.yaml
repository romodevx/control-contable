                    error: { code: conflict, message: This regime has already ended., request_id: req_01J9Z6Q4X8 }
        '422':
          description: >-
            Records exist after `end_period`, it is the last active regime, or the taxpayer
            is archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                recordsAfterEndPeriod:
                  value:
                    error:
                      code: business_rule_violation
                      message: This regime has records after the end period.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: end_period, code: records_after_end_period, message: Elige un periodo igual o posterior al último registro. }
                lastActiveRegime:
                  value:
                    error:
                      code: business_rule_violation
                      message: A taxpayer needs at least one active regime. Archive the taxpayer instead.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimeCode, code: last_active_regime, message: Archive the taxpayer instead. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M3 Incomes
  /v1/taxpayers/{taxpayerId}/incomes:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Incomes]
      operationId: listIncomes
      x-frozen: sha256:ead5984c5b0b5db82e60c3b9bdeb9002e1fc8e86e91be10b4ece5ed2e3ee6769
      summary: List a month's incomes (keyset pagination) with period totals
      description: >-
        Live (not deleted) incomes of the taxpayer whose **booking date** falls in `period`:
        `invoiced_on` for accrual regimes (PM Título II), `collected_on` for cash regimes
        (MODULE-incomes §2.2). Ordered by booking date, then `id`, both descending; `cursor`
        is the opaque `next_cursor` of the previous page (`limit` 1–100, default 50). `regime`
        narrows items and totals. `totals` cover the whole filtered period, not the page.
        Accrual incomes with `collected_on: null` come with `pending_collection: true`
        ("Por cobrar"). Archived taxpayers can be listed. Reads are allowed for a read-only
        user. `warnings` is always `[]` here (warnings are computed per write, never stored).
      x-module: module_incomes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of incomes.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomePage' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    post:
      tags: [Incomes]
      operationId: createIncome
      x-frozen: sha256:8fa5b3ec62c4ee013f257def7b68c8b7be5254ec714ba3f73a764552ef46e4dc
      summary: Record an income (idempotent client id; trial cap enforced)
      description: >-
        Records an income of the active taxpayer. Amounts are MXN centavos (`int64`), the
        amount is the subtotal **before IVA**; there is no currency field.


        **Idempotency (double submit).** The client generates `id` (UUIDv7 recommended) once
        per form session and resends it on every retry; the server generates one when it is
        absent. Before any access check: a new `id` → `201`; an `id` the caller already owns
        for the same taxpayer, not deleted, with the same persisted fields (compared after
        normalization) → `200` with the stored income, no second record and no trial slot
        (even at 5/5); the same `id` with other fields, another taxpayer, or a soft-deleted
        income → `409 conflict` with `{field: id, code: id_reused}`; an `id` that belongs to
        another user → `409 conflict` with no `details` (it reveals no ownership).


        **Order of checks** (one transaction): schema (`400`) → idempotency (`200`/`409`) →
        read-only access (`402`) → regime window and archive (`422`) → domain rules (`400`/`422`)
        → trial slot (`402`, atomic) → insert. A failed insert gives the slot back.


        **Trial cap.** 5 incomes per user across all taxpayers, independent of the 5 expenses.
        A spent cap answers `402 entitlement_required` with
        `{field: incomes_remaining, code: trial_cap_reached}`; deleting never frees a slot.


        `FieldError.code` values beyond JSON Schema keywords (`required`, `minimum`, `enum`,
        `format`, `pattern`, `maxLength`, `additionalProperties`, …):
        `collected_on` / `invoiced_on` → `required` (the date the regime's basis needs:
        `collected_on` for cash regimes, `invoiced_on` for accrual), `out_of_range` (before
        2022-01-01 or after today, America/Mexico_City);
        `platform_activity` → `required` (625 with more than one activity), `not_for_regime`
        (sent for a regime other than 625);
        `amount_cents` → `minimum` (0 is refused at the edge; `must_be_positive` is the
        domain's backstop code for the same rule).
        `422 business_rule_violation` details: `regime_code` → `regime_not_active` (the regime
        is not held on one of the income's dates); `taxpayerId` → `taxpayer_archived`;
        `iva_rate` → `rate_not_valid_on_date` (rate not allowed on the IVA date, e.g. `rate_8`
        after the border decree ends); `iva_cents` → `iva_amount_mismatch` (`rate_0`/`exempt`
        with IVA > 0, or more than 100 centavos away from `amount_cents × rate`);
        `isr_withheld_cents` / `iva_withheld_cents` → `withholding_not_applicable` (the
        person type, regime and `counterparty_type` allow no such withholding),
        `withholding_exceeds_base` (ISR above `amount_cents`, IVA above `iva_cents`);
        `platform_activity` → `activity_not_held` (not among the taxpayer's 625 activities).


        Success bodies carry non-blocking `warnings` (MODULE-incomes §2.8):
        `duplicate_cfdi_uuid` on `cfdi_uuid` (another live income of the taxpayer has the
        same folio fiscal: legit for partial collections) and `withholding_differs_from_rate`
        on `isr_withheld_cents` / `iva_withheld_cents` (the CFDI wins). Messages never carry
        amounts, descriptions or UUIDs.
      x-module: module_incomes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeCreate' }
            examples:
              professionalFees:
                summary: 612 fees paid by a persona moral (ISR 10 %, IVA 2/3 withheld)
                value:
                  id: 0199d4a3-1a2b-7d3c-8e4f-5a6b7c8d9e01
                  regime_code: '612'
                  counterparty_type: persona_moral
                  amount_cents: 1000000
                  iva_rate: rate_16
                  iva_cents: 160000
                  isr_withheld_cents: 100000
                  iva_withheld_cents: 106667
                  invoiced_on: '2026-09-05'
                  collected_on: '2026-09-10'
                  cfdi_uuid: 6F3B2C1D-8A4E-4B7F-9C2D-1E5A7B9C3D4F
                  description: Diseño de logotipo
              accrualPendingCollection:
                summary: 601 invoice not yet collected ("Por cobrar")
                value:
                  id: 0199d4a3-3c4d-7f5e-a061-7c8d9e0f1a23
                  regime_code: '601'
                  counterparty_type: persona_moral
                  amount_cents: 4500000
                  iva_rate: rate_16
                  iva_cents: 720000
                  invoiced_on: '2026-09-05'
                  collected_on: null
                  description: Consultoría de procesos, septiembre
              platformLodging:
                summary: 625 lodging through a platform (activity defaulted when the taxpayer holds one)
                value:
                  id: 0199d4a3-4d5e-7a6f-b172-8d9e0f1a2b34
                  regime_code: '625'
                  counterparty_type: plataforma
                  amount_cents: 1500000
                  iva_rate: rate_16
                  iva_cents: 240000
                  isr_withheld_cents: 60000
                  iva_withheld_cents: 120000
                  collected_on: '2026-09-20'
      responses:
        '201':
          description: Created (with `warnings` when the folio fiscal repeats or a withholding differs from the suggested rate).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
              examples:
                created:
                  value:
                    id: 0199d4a3-1a2b-7d3c-8e4f-5a6b7c8d9e01
                    taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    regime_code: '612'
                    counterparty_type: persona_moral
                    amount_cents: 1000000
                    iva_rate: rate_16
                    iva_cents: 160000
                    isr_withheld_cents: 100000
                    iva_withheld_cents: 106667
                    invoiced_on: '2026-09-05'
                    collected_on: '2026-09-10'
                    platform_activity: null
                    cfdi_uuid: 6F3B2C1D-8A4E-4B7F-9C2D-1E5A7B9C3D4F
                    description: Diseño de logotipo
                    pending_collection: false
                    warnings: []
                    created_at: '2026-09-10T17:00:00Z'
                    updated_at: '2026-09-10T17:00:00Z'
                duplicateCfdiUuid:
                  summary: Accepted; another live income has the same folio fiscal (partial collection)
                  value:
                    id: 0199d4a3-5e6f-7b70-8283-9e0f1a2b3c45
                    taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    regime_code: '612'
                    counterparty_type: persona_moral
                    amount_cents: 500000
                    iva_rate: rate_16
                    iva_cents: 80000
                    isr_withheld_cents: 50000
                    iva_withheld_cents: 53333
                    invoiced_on: '2026-09-05'
                    collected_on: '2026-09-25'
                    platform_activity: null
                    cfdi_uuid: 6F3B2C1D-8A4E-4B7F-9C2D-1E5A7B9C3D4F
                    description: Segundo pago del logotipo
                    pending_collection: false
                    warnings:
                      - code: duplicate_cfdi_uuid
                        field: cfdi_uuid
                        message: Ya registraste otro ingreso con este folio fiscal. Si es un pago parcial, está bien.
                    created_at: '2026-09-25T19:12:00Z'
                    updated_at: '2026-09-25T19:12:00Z'
        '200':
          description: Idempotent retry; the caller already owns this income with the same fields. No trial slot is used.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400':
          description: >-
            Input does not match the contract, or a date, activity or amount rule
            (`details[].code`: see the operation description).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missingCollectedOn:
                  summary: A cash-basis regime (612) without `collected_on`
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: collected_on, code: required, message: Indica la fecha de cobro. }
                futureDate:
                  summary: A date after today (America/Mexico_City)
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: collected_on, code: out_of_range, message: La fecha no puede ser futura ni anterior a 2022. }
                zeroAmount:
                  summary: '`amount_cents: 0`'
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: amount_cents, code: minimum, message: El monto debe ser mayor que cero. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: >-
            Read-only access (trial over, no active plan), or the income trial cap is spent:
            `details[0]` names the cap (`incomes_remaining` / `trial_cap_reached`). Never on
            an idempotent retry.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                trialCapReached:
                  value:
                    error:
                      code: entitlement_required
                      message: You have used every income of your trial. Subscribe to keep adding incomes.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - field: incomes_remaining
                          code: trial_cap_reached
                          message: You have used every income of your trial. Subscribe to keep adding incomes.
                readOnly:
                  value:
                    error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '409':
          description: >-
            The client `id` is reused: by the caller with other fields, another taxpayer or a
            deleted income (`details`: `id` / `id_reused`), or it belongs to another user (no
            `details`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                idReused:
                  value:
                    error:
                      code: conflict
                      message: The request conflicts with the current state.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: id, code: id_reused, message: Este identificador ya se usó con otros datos. }
                foreignId:
                  value:
                    error: { code: conflict, message: The request conflicts with the current state., request_id: req_01J9Z6Q4X8 }
        '422': { $ref: '#/components/responses/IncomeRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/incomes/defaults:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Incomes]
      operationId: getIncomeDefaults
      x-frozen: sha256:13e400f9f1e5149353f4fb6f7daa675efbec43c858f4f37b23d1a62a173d7f58
      summary: IVA rates and suggested withholding rates for a new income (prefills the form)
      description: >-
        Resolved from the rate catalog (`RateCatalog`, dated parameter data) for the
        taxpayer's person type, the regime and its options (625 `activities`,
        `rfc_given_to_platform`), the counterparty and the date `on` (default: today,
        America/Mexico_City). The app never hard-codes a rate. A suggestion is UX only:
        the stored value is what the user enters (the CFDI wins). `iva_rates_allowed` lists
        the rates valid on `on` (`rate_8` disappears when the border decree ends). A
        withholding that is not allowed has `*_allowed: false` and a `null` rate (the value
        must be 0); an allowed one without a suggestion has `*_allowed: true` and a `null`
        rate. The ISR rate applies to `amount_cents`, the IVA rate to `iva_cents`. For 625,
        `platform_activity` selects the ISR rate; it defaults to the taxpayer's only activity
        and stays `null` when there are several and none is sent. Reads are allowed for a
        read-only user and for an archived taxpayer. `regime` must be held by the taxpayer
        on `on` (`422 regime_not_active`).
