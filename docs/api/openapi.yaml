        - $ref: '#/components/parameters/OnDate'
        - $ref: '#/components/parameters/PreviewAmountCents'
        - $ref: '#/components/parameters/PreviewIvaRate'
        - $ref: '#/components/parameters/PreviewIvaCents'
        - name: counterparty_kind
