      format: uuid
      examples: [0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80]
    Period:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    FiscalYear:
      type: integer
      minimum: 2022
      maximum: 2100
      examples: [2026]
