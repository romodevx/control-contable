        - name: counterparty_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CounterpartyType' }
        - $ref: '#/components/parameters/OnDate'
        - name: platform_activity
          in: query
          required: false
          description: 625 only (`not_for_regime` otherwise); must be one of the taxpayer's activities (`activity_not_held`).
          schema: { $ref: '#/components/schemas/PlatformActivity' }
      responses:
        '200':
          description: Defaults for the form.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomeDefaults' }
              examples:
                fisica612PersonaMoral:
                  summary: 612 paid by a persona moral
                  value:
                    iva_rates_allowed: [rate_16, rate_8, rate_0, exempt]
                    suggested_iva_rate: rate_16
                    isr_withholding_allowed: true
                    isr_withholding_rate: '0.10'
                    iva_withholding_allowed: true
                    iva_withholding_rate: '0.666667'
                    platform_activity: null
                platform625Lodging:
                  summary: 625 lodging, RFC given to the platform
                  value:
                    iva_rates_allowed: [rate_16, rate_8, rate_0, exempt]
                    suggested_iva_rate: rate_16
                    isr_withholding_allowed: true
                    isr_withholding_rate: '0.04'
                    iva_withholding_allowed: true
                    iva_withholding_rate: '0.5'
                    platform_activity: lodging
                publicoGeneral:
                  summary: Sale to the general public (no withholding)
                  value:
                    iva_rates_allowed: [rate_16, rate_8, rate_0, exempt]
                    suggested_iva_rate: rate_16
                    isr_withholding_allowed: false
                    isr_withholding_rate: null
                    iva_withholding_allowed: false
                    iva_withholding_rate: null
                    platform_activity: null
        '400':
          description: >-
            Input does not match the contract: `on` out of range (`out_of_range`, 2022-01-01 …
            today), or `platform_activity` for a regime other than 625 (`not_for_regime`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime, code: required, message: Indica el régimen. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422':
          description: The regime is not held on `on`, or the 625 activity is not among the taxpayer's.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                regimeNotActive:
                  value:
                    error:
                      code: business_rule_violation
                      message: The taxpayer does not hold this regime on that date.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regime, code: regime_not_active, message: No tienes este régimen en esa fecha. }
                activityNotHeld:
                  value:
                    error:
                      code: business_rule_violation
                      message: The activity is not among the taxpayer's platform activities.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: platform_activity, code: activity_not_held, message: No registraste esta actividad en el régimen 625. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
