    get:
      tags: [Incomes]
      operationId: previewIncomeWithholdings
      x-frozen: sha256:ba7396ad2852eb4c6c3ce0373b300786d714e5c56153f640ca8f67bc3a4aa9af
      summary: Derive the withholdings of an income without storing it (live card of the form)
      description: >-
        Runs the same derivation `createIncome` stores (ADR-0008, MODULE-withholdings §3) on the
        facts in the query and stores nothing; the form calls it debounced as the user types
        (§2.3). Same validation as `createIncome` for the fields it takes: `400` for malformed
        or out-of-range input (`on` before 2026-01-01 or after today → `out_of_range`;
        `via_platform: true` outside 625 and persona moral regimes or `platform_activity`
        outside 625 → `not_for_regime`), `422` for `regime_not_active`,
        `rate_not_valid_on_date`, `iva_amount_mismatch`, `residential_rent_exempt`,
        `activity_not_held`. `on` is the income's withholding date (`collected_on`, else
        `invoiced_on`; default today, America/Mexico_City): it picks the dated rates. Reads
        are allowed for a read-only user and an archived taxpayer (no `402`). Per-user budget
        `withholding_previews`, 1200 per hour (burst 1200, ADR-0005), shared with
        `previewExpenseWithholdings` and separate from the record budgets; spent → `429
        rate_limited` with `Retry-After`. The query carries amounts, never a name, an RFC or a
        description; the server does not log it.
      x-module: module_incomes
      security:
