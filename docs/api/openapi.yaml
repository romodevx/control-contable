  /v1/taxpayers/{taxpayerId}/incomes/defaults:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Incomes]
      operationId: getIncomeDefaults
      x-frozen: sha256:256de17b2fe9ed9e298a25cdd4c1b9a59af62860852cd7b2e90d0e5a113de084
      summary: IVA rates and suggested withholding rates for a new income (prefills the form)
      description: >-
        Resolved from the rate catalog (`RateCatalog`, dated parameter data) for the
        taxpayer's person type, the regime and its options (625 `activities`,
        `rfc_given_to_platform`), the counterparty and the date `on` (default: today,
        America/Mexico_City). The app never hard-codes a rate. A suggestion is UX only:
        the stored value is what the user enters (the CFDI wins). `iva_rates_allowed` lists
        the rates valid on `on` (`rate_8` disappears when the border decree ends). A
        withholding that is not allowed has `*_allowed: false` and a `null` rate (the value
        must be 0); an allowed one without a suggestion has `*_allowed: true` and a `null`
        rate. The ISR rate applies to `amount_cents`, the IVA rate to `iva_cents`. For 625,
        `platform_activity` selects the ISR rate; it defaults to the taxpayer's only activity
        and stays `null` when there are several and none is sent. Reads are allowed for a
        read-only user and for an archived taxpayer. `regime` must be held by the taxpayer
        on `on` (`422 regime_not_active`).


        **0.10.0 (ADR-0008):** `last_used` carries the withholding facts to preselect
        (MODULE-withholdings §2.1). The `*_withholding_*` fields and the `counterparty_type`
        parameter are deprecated; WH-06 removes them (the derived figures come from
        `previewIncomeWithholdings`).
      x-module: module_incomes
      security:
        - bearerAuth: []
      parameters:
        - name: regime
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RegimeCode' }
        - name: counterparty_type
          in: query
          required: true
          deprecated: true
          x-deprecated-reason: Removed by WH-06 (ADR-0008); withholdings are derived.
          description: Deprecated in 0.10.0; removed by WH-06 (ADR-0008).
          schema: { $ref: '#/components/schemas/CounterpartyType' }
        - $ref: '#/components/parameters/OnDate'
        - name: platform_activity
          in: query
          required: false
          description: 625 only (`not_for_regime` otherwise); must be one of the taxpayer's activities (`activity_not_held`).
          schema: { $ref: '#/components/schemas/PlatformActivity' }
      responses:
        '200':
          description: Defaults for the form.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
