    patch:
      tags: [Taxpayers]
      operationId: updateTaxpayer
      x-frozen: sha256:3973a485b90cebb7257a9891609193455114dc7b909faaeb35fc73ef810a5dc9
      summary: Rename a taxpayer or correct its RFC (person type is immutable)
      description: >-
        `display_name` is trimmed and NFC-normalized (1–80 characters). `rfc` corrects a
        mistyped RFC of the same person type (OQ-1): it is normalized and validated as in
        `createTaxpayer` (same `details[].code` values; a check-digit mismatch is accepted with
        the `rfc_check_digit_mismatch` warning), re-encrypted, re-hashed and checked
        for uniqueness in the caller's account. `person_type` or any other field answers
        `400` (`additionalProperties`). A read-only user gets `402`; an archived taxpayer
        `422 business_rule_violation` (`taxpayer_archived`).
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerUpdate' }
            examples:
              rename:
                value: { display_name: Ana (negocio) }
              correctRfc:
                value: { rfc: GOMA800101AB6 }
      responses:
        '200':
          description: Updated.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '400':
          description: Input does not match the contract, or the corrected RFC is invalid.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: rfc, code: rfc_length_mismatch, message: Una persona física tiene un RFC de 13 caracteres. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The corrected RFC is already registered in the caller's account.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: rfc_already_registered, message: This RFC is already registered in your account., request_id: req_01J9Z6Q4X8 }
        '422':
          description: The taxpayer is archived; unarchive it first.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Unarchive the taxpayer first. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Taxpayers]
      operationId: deleteTaxpayer
      x-frozen: sha256:8daf095e4e91c5fe7e147d291cc1fe85b4720ff58f7ab41e1f5fa78c5f16ae68
      summary: Permanently delete a taxpayer and all its records (irreversible)
      description: >-
        Requires `confirm=true`; without it answers `400 validation_failed` (`confirm` /
        `confirm_required`) and deletes nothing. Deletes the taxpayer, its regimes, incomes,
        expenses, tax inputs and estimate history in one transaction. Frees one cap slot and
        the RFC; trial usage counters are not decremented. Allowed for a read-only user and
        for an archived taxpayer.
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Confirm'
      responses:
        '204':
          description: Deleted.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400':
          description: '`confirm=true` is missing, or the input does not match the contract.'
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: confirm, code: confirm_required, message: Confirm the deletion. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
