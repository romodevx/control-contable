      tags: [Incomes]
      operationId: restoreIncome
      x-frozen: sha256:4ec6aab1542fd898db80cb5876aa2df84154306a667c081b79d55e338ce03206
      summary: Undo a delete (never consumes a trial slot)
      description: >-
        Clears `deleted_at`. **Never consumes a trial slot**: the slot was used once at
        creation and never freed, so Undo works at 5/5 with no paywall. Only the read-only
        check applies (`402` without `details`). The regime window is re-checked
        (`422 regime_not_active` when the regime no longer covers the income's dates); an
        archived taxpayer answers `422 taxpayer_archived`. Restoring a live income answers
        `200` unchanged; a purged one `404`. `warnings` are computed as on create.
      x-module: module_incomes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restored.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/RecordReadOnly' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/RecordRestoreRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

  # ---------------------------------------------------------------- M4 Expenses
  /v1/taxpayers/{taxpayerId}/expense-categories:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Expenses]
      operationId: listExpenseCategories
      x-frozen: sha256:250cabadb86ef2f393099e0d73b35b486926912b5157383fddff115e1057b5ae
      summary: Expense categories with deductibility resolved for the taxpayer's regime and options
      description: >-
        Replaces the global `GET /v1/expense-categories` (OQ-E1): the hint depends on the
        taxpayer's person type (626 PF vs 626 PM) and regime options (606 `deduction_mode`,
        625 `definitive_option`), so the catalog is read per taxpayer. Every category comes
        with `deductibility` (the hint shown), `default_deductible` (the boolean a new
        expense starts with; conservative for partial cases), the `note` and the article-level
        `legal_basis`, ordered by the catalog's `sort_order`. `iva_rates_allowed` and
        `cash_payment_limit_cents` are dated parameter data on `on` (default: today, America/
        Mexico_City). `legend` is the mandatory text the form shows under the category. The
        catalog is pending CPA review (⚠️). Allowed for a read-only user and for an archived
        taxpayer. `regime` must be held by the taxpayer on `on` (`422 regime_not_active`).
      x-module: module_expenses
      security:
        - bearerAuth: []
      parameters:
        - name: regime
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RegimeCode' }
        - $ref: '#/components/parameters/OnDate'
      responses:
        '200':
          description: Categories for the regime.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategoryList' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422':
          description: The taxpayer does not hold `regime` on `on`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime, code: regime_not_active, message: No tienes este régimen en esa fecha. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/expenses:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Expenses]
      operationId: listExpenses
      x-frozen: sha256:b8c1a87910a417004daac47ce3b4cd6f69cd6dd4f01f6282147ae4055968cf57
      summary: List a month's expenses (keyset pagination) with period totals
      description: >-
        Live (not deleted) expenses of the taxpayer whose `paid_on` (the booking date for
        every regime) falls in `period`, ordered by `paid_on`, then `id`, both descending;
        pagination, `regime` filter and totals as `listIncomes`. `legend` is the mandatory
        text of the list header. `warnings` is always `[]` here.
      x-module: module_expenses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of expenses.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePage' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    post:
      tags: [Expenses]
      operationId: createExpense
      x-frozen: sha256:32aebb34497600cd41396779054fb80c171230b51a914d91b05107c76027f6d6
      summary: Record an expense (idempotent client id; trial cap enforced)
      description: >-
        Records an expense of the active taxpayer. Idempotency, order of checks, regime
        window, IVA rate validity and the `iva_cents` tolerance are those of `createIncome`
        (same `200` / `409 id_reused` rules). Trial cap: 5 expenses per user across all
        taxpayers, independent of incomes; a spent cap answers `402` with
        `{field: expenses_remaining, code: trial_cap_reached}`.


        **Deductibility.** `deductible` omitted or `null` → the default: the category rule for
        the regime, person type and options (MODULE-expenses §2.2–2.3) AND `has_cfdi` AND NOT
        a cash payment over the limit (`payment_method: cash` with `amount_cents + iva_cents`
        above `cash_payment_limit_cents`, or any cash `combustible`). A boolean is the user's
        override (`deductible_source: user`). Non-deductibility is never an error.


        `FieldError.code` values beyond JSON Schema keywords: `category_code` →
        `unknown_category`; `cfdi_uuid` → `has_cfdi_mismatch` (a folio fiscal with
        `has_cfdi: false`); `paid_on` → `out_of_range` (before 2022-01-01 or after today).
        `422 business_rule_violation` details: `regime_code` → `regime_not_active`;
        `taxpayerId` → `taxpayer_archived`; `iva_rate` → `rate_not_valid_on_date`;
        `iva_cents` → `iva_amount_mismatch`; `isr_withheld_cents` / `iva_withheld_cents` →
        `withholding_not_applicable` (only a persona moral withholds from its suppliers),
        `withholding_exceeds_base`.


        Success bodies carry non-blocking `warnings`: `cash_over_threshold` on
        `payment_method`, `no_cfdi` on `has_cfdi`, `not_isr_deductible_in_regime` and
        `category_not_deductible` on `deductible` (an override to `true` against the hint),
        `duplicate_cfdi_uuid` on `cfdi_uuid`.
      x-module: module_expenses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
            examples:
              software:
                summary: 612 software paid by card, with CFDI
                value:
                  id: 0199d4a3-2b3c-7e4d-9f50-6b7c8d9e0f12
                  regime_code: '612'
                  category_code: software
                  amount_cents: 50000
                  iva_rate: rate_16
                  iva_cents: 8000
                  payment_method: card_debit
                  paid_on: '2026-09-12'
                  has_cfdi: true
                  cfdi_uuid: 3A9C7E21-5B4D-4F6A-8E2C-9D1B7A3F5C60
                  description: Suscripción anual de diseño
              cashOverLimit:
                summary: Stationery paid in cash above $2,000 (accepted, not deductible)
                value:
                  id: 0199d4a3-6f70-7c81-9394-0f1a2b3c4d56
                  regime_code: '612'
                  category_code: papeleria
                  amount_cents: 200000
                  iva_rate: rate_16
                  iva_cents: 32000
                  payment_method: cash
                  paid_on: '2026-09-15'
                  has_cfdi: true
              moralFeesWithholding:
                summary: 601 professional fees with ISR and IVA withheld from the supplier
                value:
                  id: 0199d4a3-7081-7d92-a4a5-1a2b3c4d5e67
                  regime_code: '601'
                  category_code: servicios_profesionales
                  amount_cents: 1000000
                  iva_rate: rate_16
                  iva_cents: 160000
                  payment_method: transfer
                  paid_on: '2026-09-30'
                  has_cfdi: true
                  isr_withheld_cents: 100000
                  iva_withheld_cents: 106667
                  description: Honorarios de auditoría
      responses:
        '201':
          description: Created (with `warnings` for non-deductibility risks or a repeated folio fiscal).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
              examples:
                deductible:
                  value:
                    id: 0199d4a3-2b3c-7e4d-9f50-6b7c8d9e0f12
                    taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    regime_code: '612'
                    category_code: software
                    amount_cents: 50000
                    iva_rate: rate_16
                    iva_cents: 8000
                    payment_method: card_debit
                    paid_on: '2026-09-12'
                    has_cfdi: true
                    cfdi_uuid: 3A9C7E21-5B4D-4F6A-8E2C-9D1B7A3F5C60
                    isr_withheld_cents: 0
                    iva_withheld_cents: 0
                    description: Suscripción anual de diseño
                    deductible: true
                    deductible_source: category_default
                    warnings: []
                    legend: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
                    created_at: '2026-09-12T18:30:00Z'
                    updated_at: '2026-09-12T18:30:00Z'
                cashOverThreshold:
                  summary: Paid in cash above $2,000 with IVA; default deductible is false
                  value:
                    id: 0199d4a3-6f70-7c81-9394-0f1a2b3c4d56
                    taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
                    regime_code: '612'
                    category_code: papeleria
                    amount_cents: 200000
                    iva_rate: rate_16
                    iva_cents: 32000
                    payment_method: cash
                    paid_on: '2026-09-15'
                    has_cfdi: true
                    cfdi_uuid: null
                    isr_withheld_cents: 0
                    iva_withheld_cents: 0
                    description: null
                    deductible: false
                    deductible_source: category_default
                    warnings:
                      - code: cash_over_threshold
                        field: payment_method
                        message: Los pagos en efectivo de más de $2,000 no son deducibles.
                    legend: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
                    created_at: '2026-09-15T15:42:00Z'
                    updated_at: '2026-09-15T15:42:00Z'
        '200':
          description: Idempotent retry; the caller already owns this expense with the same fields. No trial slot is used.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400':
          description: >-
            Input does not match the contract, an unknown category, a folio fiscal without
            CFDI, or a date out of range (`details[].code`: see the operation description).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unknownCategory:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: category_code, code: unknown_category, message: Elige una categoría de la lista. }
                hasCfdiMismatch:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: cfdi_uuid, code: has_cfdi_mismatch, message: 'Si capturas el folio fiscal, indica que tienes factura.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: >-
            Read-only access (trial over, no active plan), or the expense trial cap is spent:
            `details[0]` names the cap (`expenses_remaining` / `trial_cap_reached`). Never on
            an idempotent retry.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                trialCapReached:
                  value:
                    error:
                      code: entitlement_required
                      message: You have used every expense of your trial. Subscribe to keep adding expenses.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - field: expenses_remaining
                          code: trial_cap_reached
                          message: You have used every expense of your trial. Subscribe to keep adding expenses.
                readOnly:
                  value:
                    error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '409':
          description: >-
            The client `id` is reused: by the caller with other fields, another taxpayer or a
            deleted expense (`details`: `id` / `id_reused`), or it belongs to another user (no
            `details`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStoreOnError' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                idReused:
                  value:
                    error:
                      code: conflict
                      message: The request conflicts with the current state.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: id, code: id_reused, message: Este identificador ya se usó con otros datos. }
                foreignId:
                  value:
                    error: { code: conflict, message: The request conflicts with the current state., request_id: req_01J9Z6Q4X8 }
        '422': { $ref: '#/components/responses/ExpenseRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [Expenses]
      operationId: getExpense
      x-frozen: sha256:9749da319178522571a49de6761b91ef623c4ab3dcd3aa270d9d853ff9e85092
      summary: Get an expense
      description: >-
        A live expense of the taxpayer. A soft-deleted, purged, foreign or unknown expense, or
        a malformed id, answers `404`. `warnings` is always `[]` here.
      x-module: module_expenses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expense.
