      description: >-
        Sets `archived_at`. The taxpayer leaves the list and the switcher; reads by id and
        past estimates still work; writes are refused until it is unarchived. It still counts
        toward the cap and keeps its RFC reserved. Archiving an archived taxpayer answers
        `200` unchanged. Allowed for a read-only user.
      x-module: module_taxpayers
      security:
