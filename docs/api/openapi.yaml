    # ------------------------------------------------------------ tax engine
    ParameterSetRef:
      type: object
      required: [fiscal_year, version]
      properties:
        fiscal_year: { $ref: '#/components/schemas/FiscalYear' }
        version: { type: integer, minimum: 1 }
    TaxResult:
      type: object
      required: [amount_cents, payable_rounded_cents, outcome]
      properties:
        amount_cents:
          $ref: '#/components/schemas/MoneyCents'
          description: Exact result; negative = saldo a favor.
        payable_rounded_cents:
          $ref: '#/components/schemas/MoneyCents'
          description: Payment amount. Equals amount_cents (centavo precision) until the CPA confirms CFF art. 20 whole-peso rounding (ADR-0002 §4).
        outcome: { type: string, enum: [payable, in_favor, zero] }
    RegimeEstimate:
      type: object
      required: [regime_code, regime_name, treatment, status, parameter_set]
      properties:
        regime_code: { $ref: '#/components/schemas/RegimeCode' }
        regime_name: { type: string }
        treatment: { $ref: '#/components/schemas/Treatment' }
        status: { type: string, enum: [complete, incomplete, informational] }
        missing_inputs:
          type: array
          items: { type: string }
        explanation: { type: [string, 'null'] }
        isr:
          oneOf:
            - $ref: '#/components/schemas/TaxResult'
            - type: 'null'
        iva_components:
          oneOf:
            - $ref: '#/components/schemas/IvaComponents'
            - type: 'null'
        withheld_to_remit_cents:
          $ref: '#/components/schemas/NonNegativeCents'
          description: ISR/IVA the taxpayer withheld from suppliers in this regime.
        parameter_set: { $ref: '#/components/schemas/ParameterSetRef' }
    IvaComponents:
      type: object
      description: This regime's contribution; monthly IVA is netted per taxpayer in totals.iva.
      required: [charged_collected_cents, creditable_paid_cents, withheld_from_taxpayer_cents]
      properties:
        charged_collected_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        creditable_paid_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        withheld_from_taxpayer_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        definitive_excluded_cents:
          $ref: '#/components/schemas/NonNegativeCents'
          description: IVA already definitive via withholding (e.g. 625 under LIVA 18-M).
    EstimateTotals:
      type: object
      required: [iva, isr, withholdings_to_remit_cents, total_payable_rounded_cents]
      properties:
        iva:
          $ref: '#/components/schemas/TaxResult'
          description: Monthly IVA consolidated across the taxpayer's regimes.
        isr:
          $ref: '#/components/schemas/TaxResult'
          description: Sum of per-regime provisional ISR (payable parts only; favor balances per regime).
        withholdings_to_remit_cents:
          $ref: '#/components/schemas/NonNegativeCents'
          description: Withheld ISR/IVA to remit in full (not netted against IVA, LIVA 1-A).
        total_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
    TaxpayerEstimate:
      type: object
      required: [taxpayer_id, period, due_date, legend, disclaimers, regimes, totals, engine_version]
