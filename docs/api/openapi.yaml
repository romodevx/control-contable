        period: { type: string, enum: [weekly, monthly, yearly] }
        store: { type: string, enum: [app_store, play_store] }
        expires_at: { type: string, format: date-time }
        will_renew: { type: boolean }
        management_url: { type: [string, 'null'], format: uri }
      examples:
        - product_id: cc_pro_monthly
          period: monthly
          store: app_store
          expires_at: '2026-11-13T16:00:00Z'
          will_renew: true
          management_url: 'https://apps.apple.com/account/subscriptions'
    SubscriptionStatus:
      type: object
      required: [access]
      properties:
        access: { $ref: '#/components/schemas/AccessSummary' }
        plan:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionPlan'
            - type: 'null'
      examples:
        - access: { access: trial, trial_ends_at: '2026-10-20T16:00:00Z', incomes_remaining: 3, expenses_remaining: 5 }
          plan: null
    RevenueCatWebhook:
      type: object
      required: [api_version, event]
      description: Subset we rely on; unknown fields are accepted and stored raw.
      properties:
        api_version: { type: string, examples: ['1.0'] }
        event:
          type: object
          required: [id, type, app_user_id, event_timestamp_ms]
          additionalProperties: true
          properties:
            id: { type: string }
            type: { type: string, examples: [INITIAL_PURCHASE, RENEWAL, CANCELLATION, EXPIRATION, TRANSFER, TEST] }
            app_user_id: { type: string }
            original_app_user_id: { type: string }
            product_id: { type: string }
            entitlement_ids:
              type: [array, 'null']
              items: { type: string }
            environment: { type: string, enum: [SANDBOX, PRODUCTION] }
            store: { type: string }
            event_timestamp_ms: { type: integer, format: int64 }
            expiration_at_ms: { type: [integer, 'null'], format: int64 }
      examples:
        - api_version: '1.0'
          event:
            id: CDD2F2E3-6A2C-4B1F-9E0D-3F5A7B9C1D2E
            type: INITIAL_PURCHASE
            app_user_id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
            original_app_user_id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
            product_id: cc_pro_monthly
            entitlement_ids: [pro]
            environment: SANDBOX
            store: APP_STORE
            event_timestamp_ms: 1791907200000
            expiration_at_ms: 1794585600000

    # ------------------------------------------------------------ history
    HistoryMonth:
      type: object
      required: [period, status, total_payable_rounded_cents, changed_since_viewed]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        status: { type: string, enum: [complete, incomplete, informational, no_records] }
        iva: { oneOf: [{ $ref: '#/components/schemas/TaxResult' }, { type: 'null' }] }
        isr: { oneOf: [{ $ref: '#/components/schemas/TaxResult' }, { type: 'null' }] }
        total_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        changed_since_viewed: { type: boolean }
        last_viewed_at: { type: [string, 'null'], format: date-time }
    HistoryYear:
      type: object
      required: [taxpayer_id, fiscal_year, months, legend]
      properties:
        taxpayer_id: { $ref: '#/components/schemas/Uuid' }
        fiscal_year: { $ref: '#/components/schemas/FiscalYear' }
        months:
          type: array
          items: { $ref: '#/components/schemas/HistoryMonth' }
        legend: { $ref: '#/components/schemas/Legend' }
      examples:
        - taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
          fiscal_year: 2026
          months:
            - period: '2026-01'
              status: complete
              iva: { amount_cents: 213333, payable_rounded_cents: 213333, outcome: payable }
              isr: { amount_cents: 15096, payable_rounded_cents: 15096, outcome: payable }
              total_payable_rounded_cents: 228429
              changed_since_viewed: false
              last_viewed_at: '2026-02-10T18:00:00Z'
            - period: '2026-02'
              status: no_records
              iva: null
              isr: null
              total_payable_rounded_cents: 0
              changed_since_viewed: false
              last_viewed_at: null
          legend: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.

    # ------------------------------------------------------------ reminders
    DeviceCreate:
      type: object
      required: [id, platform, push_token]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        platform: { type: string, enum: [ios, android] }
        push_token: { type: string, minLength: 1, maxLength: 4096 }
        app_version: { type: string, maxLength: 32 }
      examples:
        - id: 0199d4a4-3c4d-7f5e-8a61-7c8d9e0f1a23
          platform: ios
          push_token: example-fcm-registration-token
          app_version: 1.0.0
    Device:
      type: object
      required: [id, platform, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        platform: { type: string, enum: [ios, android] }
        created_at: { type: string, format: date-time }
      examples:
        - id: 0199d4a4-3c4d-7f5e-8a61-7c8d9e0f1a23
          platform: ios
          created_at: '2026-10-13T16:10:00Z'
    ReminderSettings:
      type: object
      required: [enabled, on_due_date, send_time, show_amounts]
      properties:
        enabled: { type: boolean, default: false }
        early_day:
          type: [integer, 'null']
          minimum: 1
          maximum: 16
          default: 14
          description: Day of month for the early reminder; null disables it.
        on_due_date: { type: boolean, default: true }
        send_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          default: '10:00'
          description: Local time, America/Mexico_City.
        show_amounts: { type: boolean, default: false, description: Lock-screen privacy opt-in. }
      examples:
        - { enabled: true, early_day: 14, on_due_date: true, send_time: '10:00', show_amounts: false }
    TaxCalendarEntry:
      type: object
      required: [period, obligation, nominal_due_date, due_date]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        obligation: { type: string, enum: [monthly_isr_iva] }
        nominal_due_date: { type: string, format: date }
        due_date: { type: string, format: date }
        moved_reason: { type: [string, 'null'], enum: [weekend, holiday, null] }
    TaxCalendar:
      type: object
      required: [year, entries]
      properties:
        year: { $ref: '#/components/schemas/FiscalYear' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TaxCalendarEntry' }
      examples:
        - year: 2026
          entries:
            - { period: '2026-01', obligation: monthly_isr_iva, nominal_due_date: '2026-02-17', due_date: '2026-02-17', moved_reason: null }
            - { period: '2026-04', obligation: monthly_isr_iva, nominal_due_date: '2026-05-17', due_date: '2026-05-18', moved_reason: weekend }
