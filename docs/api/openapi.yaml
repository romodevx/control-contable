    # ------------------------------------------------------------ dashboard / access
    AccessLevel:
      x-frozen: sha256:fe644e379c34e4cdc8d18c3798c7f3d95fcd88d0ec7c4d870e9853fb9a68cdad
      type: string
      enum: [trial, pro, comp, read_only]
      description: >-
        The caller's access (P0-16, PRD §7): `trial` (running trial, capped records), `pro`
        (store plan), `comp` (granted), `read_only` (trial over and no plan: reads, deletes
        and restores stay, creates and edits answer `402`).
    AccessSummary:
      x-frozen: sha256:1de20135ee15892d01048cd5179417c247a1c4bd8f61a2c90f4633c87d88d81c
      type: object
      required: [access, trial_ends_at, trial_days_left, incomes_remaining, expenses_remaining]
      description: >-
        The caller's access state, computed by the server so the client never uses its own
        clock (OQ-D6). Per user, across all taxpayers (PRD Q2). One shape for every screen
        that needs it: the Home banner (`getDashboard`), the subscription status (M7) and the
        check before a create wizard (MODULES.md M7, PR #58 follow-up: M7-01 exposes this
        same schema to the app regardless of `module_subscriptions`).
        `trial`: `trial_ends_at` (exclusive), `trial_days_left` (whole days left, rounded
        up, at least 1 while the trial runs) and the records left of each kind.
        `read_only`: both counters `0`, the trial fields `null`. `pro`, `comp`: every other
        field `null` (no limit applies).
      properties:
        access: { $ref: '#/components/schemas/AccessLevel' }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        trial_days_left: { type: [integer, 'null'], minimum: 1 }
        incomes_remaining: { type: [integer, 'null'], minimum: 0 }
        expenses_remaining: { type: [integer, 'null'], minimum: 0 }
      examples:
        - { access: trial, trial_ends_at: '2026-10-20T16:00:00Z', trial_days_left: 3, incomes_remaining: 2, expenses_remaining: 5 }
    DashboardMonth:
      x-frozen: sha256:1cf2fdcb39c3f00875f6c80758f1fa0be5ce3541175b165854d2866131d95bc8
      type: object
      required: [income_cents, expense_cents]
      description: >-
        Income collected (`collected_on`) and expenses paid (`paid_on`) in the dashboard's
        `period`, before IVA, live records only. A field is `null` when its module
        (`module_incomes` / `module_expenses`) is effectively OFF; `0` when ON with no record.
      properties:
        income_cents: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 99999999999999 }
        expense_cents: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 99999999999999 }
      examples:
        - { income_cents: 3000000, expense_cents: 1000000 }
    TaxpayerEstimateStatus:
      x-frozen: sha256:d6ca03ec7cdfccddfbe6585c34b9241c91fe778b8559b5a7e4ea163945b022d3
      type: string
      enum: [complete, incomplete, partial, informational, none]
      description: >-
        Taxpayer-level status of one month's estimate, derived server-side from its regimes
        with the M5 precedence: `informational` (every regime informational) > `incomplete`
        (any regime incomplete) > `partial` (any partial) > `complete`; `none` when the
        taxpayer holds no regime that month (`regimes: []`).
    TrendTax:
      x-frozen: sha256:44ff3314e2f2529950b648be217e291bff85ee69d2b86b388907a6967eaaa5a5
      type: object
      required: [iva_payable_rounded_cents, isr_payable_rounded_cents, withholdings_to_remit_cents, total_payable_rounded_cents, iva_outcome, status]
      description: >-
        One month's tax figures, from the same estimate `getTaxpayerEstimate` answers for that
        month (`totals`). A saldo a favor never adds to a bar: `iva_payable_rounded_cents` is
        `0` and `iva_outcome` is `in_favor`. `total_payable_rounded_cents =
        iva_payable_rounded_cents + isr_payable_rounded_cents + withholdings_to_remit_cents`.
      properties:
        iva_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        isr_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        withholdings_to_remit_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        total_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        iva_outcome: { type: string, enum: [payable, in_favor, zero] }
        status: { $ref: '#/components/schemas/TaxpayerEstimateStatus' }
      examples:
        - { iva_payable_rounded_cents: 213333, isr_payable_rounded_cents: 15096, withholdings_to_remit_cents: 0, total_payable_rounded_cents: 228429, iva_outcome: payable, status: complete }
    TrendPoint:
      x-frozen: sha256:ed58e50bbf963a0d2342ddfed6b46ccf6c4a9ce2afbb901bc8032301e54d2407
      type: object
      required: [period, income_cents, expense_cents, tax]
      description: >-
        One month of the trend. Income and expense as in `DashboardMonth` (`null` ⇔ that
        module OFF); `tax` is `null` ⇔ `module_tax_engine` OFF. A month with no record is a
        point with zeros, never a hole.
      properties:
        period: { $ref: '#/components/schemas/Period' }
        income_cents: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 99999999999999 }
        expense_cents: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 99999999999999 }
        tax:
          oneOf:
            - $ref: '#/components/schemas/TrendTax'
            - type: 'null'
      examples:
        - period: '2026-03'
          income_cents: 3000000
          expense_cents: 1000000
          tax: { iva_payable_rounded_cents: 213333, isr_payable_rounded_cents: 15096, withholdings_to_remit_cents: 0, total_payable_rounded_cents: 228429, iva_outcome: payable, status: complete }
    Dashboard:
      x-frozen: sha256:969b103b2f7f2891289e04504bd71b35f9a6249f009185a02636ccbbd83d784c
      type: object
      required: [taxpayer_id, period, is_empty, month, estimate, trend, access]
      description: >-
        Home of one taxpayer for `period` (see `getDashboard`). `is_empty` is true when the
        taxpayer has no live income and no live expense in any period (enabled modules only):
        the client shows the empty state instead of the hero and the chart. `estimate` is
        `null` ⇔ `module_tax_engine` OFF. `trend` is oldest first and ends at `period`.
        `legend` is the mandatory constant, present if and only if `estimate` is not `null`;
        the client renders it under every tax figure, never a copy of its own. The
        `strong` disclaimers (`cpa_review_pending`) travel inside `estimate.disclaimers`.
      properties:
        taxpayer_id: { $ref: '#/components/schemas/Uuid' }
        period: { $ref: '#/components/schemas/Period' }
        is_empty: { type: boolean }
        month: { $ref: '#/components/schemas/DashboardMonth' }
        estimate:
          oneOf:
            - $ref: '#/components/schemas/TaxpayerEstimate'
            - type: 'null'
        trend:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/TrendPoint' }
        access: { $ref: '#/components/schemas/AccessSummary' }
        legend: { $ref: '#/components/schemas/Legend' }
      examples:
        - taxpayer_id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
          period: '2026-02'
          is_empty: false
          month: { income_cents: 2500000, expense_cents: 2900000 }
          estimate: null
          trend:
            - { period: '2026-01', income_cents: 0, expense_cents: 0, tax: null }
            - { period: '2026-02', income_cents: 2500000, expense_cents: 2900000, tax: null }
          access: { access: trial, trial_ends_at: '2026-02-20T16:00:00Z', trial_days_left: 3, incomes_remaining: 2, expenses_remaining: 5 }

