  /v1/taxpayers/{taxpayerId}/incomes/{incomeId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/IncomeId'
    get:
      tags: [Incomes]
      operationId: getIncome
      x-frozen: sha256:dbd746b911e7f52c7871550ccba0f6a81a605f8b134e59e2573a0d8a029cec8b
      summary: Get an income
      description: >-
        A live income of the taxpayer. A soft-deleted, purged, foreign or unknown income, or
        a malformed id, answers `404`. `warnings` is always `[]` here.
      x-module: module_incomes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Income.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    patch:
      tags: [Incomes]
      operationId: updateIncome
      x-frozen: sha256:cff26c8bf0e5bf43301647325e3589014933d98f33f2a71612b0626623ecb995
      summary: Edit an income (merge-patch; null clears a nullable field)
      description: >-
        Partial update with merge-patch semantics on top-level fields: an absent field is
        unchanged; `null` clears a nullable one (`invoiced_on`, `collected_on`,
        `platform_activity`, `cfdi_uuid`, `description`). `id` cannot be sent
        (`additionalProperties`). Every rule of `createIncome` is re-run on the merged income,
        with the same `details[].code` values and `warnings`; moving it to another
        `regime_code` re-checks the regime window. Setting `collected_on` on an accrual income
        clears `pending_collection`. Any change re-derives `withholding` from the merged facts
        (ADR-0008; e.g. `counterparty_kind: pf_with_activity` zeroes it, US-W9). A read-only
        user gets `402`; an archived taxpayer `422 taxpayer_archived`. Last write wins (no ETag
        in v1).
      x-module: module_incomes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeUpdate' }
            examples:
              correctAmounts:
                value: { amount_cents: 1200000, iva_cents: 192000 }
              markCollected:
                summary: A 601 income gets collected (leaves "Por cobrar")
                value: { collected_on: '2026-10-02' }
              clearUuid:
                value: { cfdi_uuid: null }
              changeCounterparty:
                summary: US-W9 — billed to a persona física with activity instead (withholding re-derived to 0)
                value: { counterparty_type: persona_fisica, counterparty_kind: pf_with_activity }
      responses:
        '200':
          description: Updated (with `warnings` as on create).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400':
          description: Input does not match the contract, or a date, activity or amount rule (see `createIncome`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: id, code: additionalProperties, message: Este campo no se puede modificar. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/RecordReadOnly' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/IncomeRuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    delete:
      tags: [Incomes]
      operationId: deleteIncome
      x-frozen: sha256:f1b329a092f74a567df946a0b7e80d651b0d149d838a59a6fc58c5f99451872c
      summary: Soft-delete an income (Undo via restore)
      description: >-
        Sets `deleted_at`: the income leaves lists, totals and the estimate at once and can be
        restored for 30 days (then it is purged). Deleting an already deleted income answers
        `204`. Allowed for a read-only user. Never frees a trial slot. An archived taxpayer
        answers `422 taxpayer_archived` (archive freezes the data).
      x-module: module_incomes
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted (restorable).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/RecordTaxpayerArchived' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/incomes/{incomeId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/IncomeId'
    post:
      tags: [Incomes]
      operationId: restoreIncome
      x-frozen: sha256:a89fa910de8faf1e0952d4ea58ea5cf6f3101e05b17b5b8ec44dc1750594b8c6
      summary: Undo a delete (never consumes a trial slot)
      description: >-
        Clears `deleted_at`. **Never consumes a trial slot**: the slot was used once at
        creation and never freed, so Undo works at 5/5 with no paywall. **Allowed for a
        read-only user** (no access check, never `402`): Undo gives back the user's own record
        and creates nothing (0.6.1, MODULE-incomes §2.7). The regime window is re-checked
        (`422 regime_not_active` when the regime no longer covers the income's dates); an
        archived taxpayer answers `422 taxpayer_archived`. Restoring a live income answers
        `200` unchanged; a purged one, or another user's, `404`. `warnings` are computed as on
        create. A restored income whose `withholding.table_version` is older than the current
        table is re-derived (ADR-0008), like the backfill would.
      x-module: module_incomes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Restored.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422': { $ref: '#/components/responses/RecordRestoreRefused' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

  # ---------------------------------------------------------------- M4 Expenses
  /v1/taxpayers/{taxpayerId}/expense-categories:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Expenses]
      operationId: listExpenseCategories
      x-frozen: sha256:e95fbb0074a296114a8ad80f50335110cf159176798a8c5767681d1ef28c6ec5
      summary: Expense categories with deductibility resolved for the taxpayer's regime and options
      description: >-
        Replaces the global `GET /v1/expense-categories` (OQ-E1): the hint depends on the
        taxpayer's person type (626 PF vs 626 PM) and regime options (606 `deduction_mode`,
        625 `definitive_option`), so the catalog is read per taxpayer. Every category comes
        with `deductibility` (the hint shown), `default_deductible` (the boolean a new
        expense starts with; conservative for partial cases), the `note` and the article-level
        `legal_basis`, ordered by the catalog's `sort_order`. `iva_rates_allowed` and
        `cash_payment_limit_cents` are dated parameter data on `on` (default: today, America/
        Mexico_City). `legend` is the mandatory text the form shows under the category. The
        catalog is pending CPA review (⚠️). Allowed for a read-only user and for an archived
        taxpayer. `regime` must be held by the taxpayer on `on` (`422 regime_not_active`).
      x-module: module_expenses
      security:
        - bearerAuth: []
      parameters:
        - name: regime
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RegimeCode' }
        - $ref: '#/components/parameters/OnDate'
      responses:
        '200':
          description: Categories for the regime.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategoryList' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '422':
          description: The taxpayer does not hold `regime` on `on`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime on that date.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime, code: regime_not_active, message: No tienes este régimen en esa fecha. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
  /v1/taxpayers/{taxpayerId}/expenses:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Expenses]
      operationId: listExpenses
      x-frozen: sha256:b8c1a87910a417004daac47ce3b4cd6f69cd6dd4f01f6282147ae4055968cf57
      summary: List a month's expenses (keyset pagination) with period totals
      description: >-
        Live (not deleted) expenses of the taxpayer whose `paid_on` (the booking date for
        every regime) falls in `period`, ordered by `paid_on`, then `id`, both descending;
        pagination, `regime` filter and totals as `listIncomes`. `legend` is the mandatory
        text of the list header. `warnings` is always `[]` here.
      x-module: module_expenses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of expenses.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePage' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    post:
      tags: [Expenses]
      operationId: createExpense
      x-frozen: sha256:4dcd1f275a997fa10cbdeeb4d9adf179c65f0e4159747db7a7b6be0c19ed5730
      summary: Record an expense (idempotent client id; trial cap enforced)
      description: >-
        Records an expense of the active taxpayer. Idempotency, order of checks, regime
        window, IVA rate validity and the `iva_cents` tolerance are those of `createIncome`
        (same `200` / `409 id_reused` rules). Trial cap: 5 expenses per user across all
        taxpayers, independent of incomes; a spent cap answers `402` with
        `{field: expenses_remaining, code: trial_cap_reached}`.


        **Deductibility.** `deductible` omitted or `null` → the default: the category rule for
        the regime, person type and options (MODULE-expenses §2.2–2.3) AND `has_cfdi` AND NOT
        a cash payment over the limit (`payment_method: cash` with `amount_cents + iva_cents`
        above `cash_payment_limit_cents`, or any cash `combustible`). A boolean is the user's
        override (`deductible_source: user`). Non-deductibility is never an error.


        `FieldError.code` values beyond JSON Schema keywords: `category_code` →
        `unknown_category`; `cfdi_uuid` → `has_cfdi_mismatch` (a folio fiscal with
        `has_cfdi: false`); `paid_on` → `out_of_range` (before 2026-01-01, the first fiscal year
        with a tax parameter set, or after today; see `BusinessDate`).
        `422 business_rule_violation` details: `regime_code` → `regime_not_active`;
        `taxpayerId` → `taxpayer_archived`; `iva_rate` → `rate_not_valid_on_date`;
        `iva_cents` → `iva_amount_mismatch`; `isr_withheld_cents` / `iva_withheld_cents` →
        `withholding_not_applicable` (only a persona moral withholds from its suppliers),
        `withholding_exceeds_base`, both retired by WH-07; `supplier_kind` /
        `supplier_regime` / `operation_kind` / `residential_rent` → `supplier_not_applicable`
        (a persona física taxpayer, or `supplier_regime` without `supplier_kind:
        pf_with_activity`); `iva_rate` → `residential_rent_exempt`. Once WH-07 lands a persona
        moral without `supplier_kind` answers `400` `required` on it.


        **Withholdings are derived (ADR-0008, MODULE-withholdings §2.2, §3).** For a persona
        moral the server derives what it must withhold from the supplier and remit (ISR and
        IVA), stores it with the rule ids and `table_version`, and returns it read-only in
        `withholding` (`withholder: you`, `remit_due_on` the 17th of the next month);
        `deductible` keeps the category rule, and the deduction is conditioned on the
        remittance (warning `deduction_requires_remittance`). A persona física taxpayer always
        gets a zero `withholding` with `withholder: none`. **Transition:** until WH-07 lands the
        server still stores the typed amounts of the deprecated fields and omits
        `withholding`; WH-07 removes them (contract step, 0.10.x).


        Success bodies carry non-blocking `warnings`: `cash_over_threshold` on
        `payment_method`, `no_cfdi` on `has_cfdi`, `not_isr_deductible_in_regime` and
        `category_not_deductible` on `deductible` (an override to `true` against the hint),
        `duplicate_cfdi_uuid` on `cfdi_uuid`, `iva_not_creditable_cash_payment` on
        `payment_method` (a cash payment over the limit claimed as deductible: the claim
        stands for ISR, its IVA is not creditable, LIVA 5 fr. II ⚠️; added in 0.6.0,
        append-only); since 0.10.0 `deduction_requires_remittance` and
        `withholding_cpa_unverified` on `withholding`, `supplier_regime_unknown` on
        `supplier_regime`, `foreign_counterparty_not_supported` on `supplier_kind`.
      x-module: module_expenses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
            examples:
              software:
