    put:
      tags: [TaxEngine]
      operationId: putTaxInputs
      x-frozen: sha256:b7b79832c795962214fe90949c733dcd17db5f25b07ec728922b9c176bcd2ba8
      summary: Replace the tax inputs of one regime and fiscal year
      description: >-
        Replaces **all** values of `(taxpayer, regime, fiscal_year)` with `values` (an empty
        array clears them). Idempotent: the same body twice leaves the same state. Values are
        validated against the regime's `required_inputs` (catalog data): the key must be one
        of them, and exactly the value field of its `kind` is set: `value_cents` for `money`,
        `value_cents` plus `month` (1-12) for `money_monthly`, `value_rate` for `rate`,
        `value_bool` for `boolean`; every other value field is absent or `null`. Money is
        `>= 0`; the coeficiente de utilidad is `0 <= cu <= 1` and used as given. At most one
        value per key (per key and month for `money_monthly`). A `money_monthly` value, e.g.
        a monthly prior provisional payment (OQ-T1), is the amount actually paid for that
        month: the app may prefill its own estimate, the server never assumes it.


        **Order of checks:** schema (`400`) → read-only access (`402`) → archived taxpayer,
        regime window and fiscal year (`422`) → value rules (`400`) → replace. Per-user write
        budget: 60 per hour (ADR-0005, `429`). Audited as `tax_inputs.updated` with user,
        taxpayer, regime and fiscal year only, never the values.


        `FieldError.code` values beyond JSON Schema keywords (`field` is
        `values.<index>[.<property>]`): `unknown_input` (the key is not among the regime's
        inputs); `invalid` (the value field does not match the kind, both or neither are
        set, `month` on a non-monthly key or missing on a monthly one, or a repeated key or
        key and month); `out_of_range` (a rate outside `[0, 1]`); `fiscal_year` →
        `out_of_range` (a future year). `422 business_rule_violation` details: `taxpayerId`
        → `taxpayer_archived`; `regimeCode` → `regime_not_active`; `fiscal_year` →
        `parameters_unavailable`.
      x-module: module_tax_engine
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxInputsUpdate' }
      responses:
        '200':
          description: Saved; the stored inputs.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxInputs' }
        '400':
          description: >-
            Input does not match the contract, or a value does not fit its definition
            (`details[].code`: `unknown_input`, `invalid`, `out_of_range`; see the operation).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                unknownInput:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: values.0.key, code: unknown_input, message: Este dato no aplica a este régimen. }
                rateOutOfRange:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: values.0.value_rate, code: out_of_range, message: El coeficiente debe estar entre 0 y 1. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/RecordReadOnly' }
        '404': { $ref: '#/components/responses/TaxEngineNotFound' }
        '422':
          description: >-
            The taxpayer is archived (`taxpayer_archived`), does not hold the regime in that
            fiscal year (`regime_not_active`), or the fiscal year is before 2026
            (`parameters_unavailable`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                taxpayerArchived:
                  value:
                    error:
                      code: business_rule_violation
                      message: This taxpayer is archived. Unarchive it to make changes.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
                regimeNotActive:
                  value:
                    error:
                      code: business_rule_violation
                      message: The taxpayer does not hold this regime in that fiscal year.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimeCode, code: regime_not_active, message: No tienes este régimen en ese ejercicio. }
                parametersUnavailable:
                  value:
                    error:
                      code: business_rule_violation
                      message: There are no tax parameters for that fiscal year.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: fiscal_year, code: parameters_unavailable, message: Sólo podemos estimar desde 2026. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }

