        - { isr_payable_rounded_cents: 15096, iva_payable_rounded_cents: 213333, iva_outcome: payable, iva_in_favor_cents: 0, withholdings_to_remit_cents: 0, total_payable_rounded_cents: 228429 }
    HistoryMonth:
      x-frozen: sha256:7616d572c07fd5038886a890ee7c98c9fa0dc2ca7adadd01a6a9cf07b29794d7
      type: object
      required: [period, status, has_records, tax, due_date, cpa_review_pending, is_current, records_fingerprint, figures_fingerprint, engine_version, parameter_set, viewed_at, changed_since_viewed, change_reason]
      description: >-
        One month of `HistoryYear`. `status` uses the M5 precedence (`TaxpayerEstimateStatus`;
        `none` when no regime is held that month). `tax` is `null` if and only if `status` is
        `none` or every regime is informational (no amount shown). `has_records`: any live
        income or expense dated in the month, counting only enabled modules ("Sin registros
        en este mes" when `false`; a YTD regime may still show a figure). `is_current`: the
        current month (America/Mexico_City), labelled "Mes en curso", never marked.
        `records_fingerprint`, `figures_fingerprint`, `engine_version` and `parameter_set`
        are the current estimate's (opaque to the client; the app posts the values of the
        estimate it renders to `markHistoryViewed`). `viewed_at`: the caller's last view
        (server clock), `null` if never viewed. `changed_since_viewed` and `change_reason`
        follow `getHistory`: `change_reason` is non-null if and only if
        `changed_since_viewed` is `true`, which needs a view and a non-current month.
      properties:
        period: { $ref: '#/components/schemas/Period' }
        status: { $ref: '#/components/schemas/TaxpayerEstimateStatus' }
        has_records: { type: boolean }
        tax:
