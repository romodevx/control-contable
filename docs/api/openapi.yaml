    TaxInputDef:
      x-frozen: sha256:ce5cc5e6d4cbd306543804c8213a73f8943b1e201866075f92b30e9a0cbb9ed7
      type: object
      required: [key, label, kind, required]
      description: >-
        One per-fiscal-year tax input of a regime (`regimes.required_inputs`, catalog data).
        `kind`: `money` (one amount for the year, centavos `>= 0`), `money_monthly` (one
        amount per month 1-12, e.g. the prior provisional payments, OQ-T1), `rate` (decimal
        string in `[0, 1]`) or `boolean`. `required`: the key can be required in some period
        of the year; whether it is missing for a period is `RegimeEstimate.missing_inputs`.
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$', maxLength: 64, examples: [coeficiente_utilidad] }
        label: { type: string, description: Spanish label shown in the tax-inputs form. }
        kind: { type: string, enum: [money, money_monthly, rate, boolean] }
        required: { type: boolean }
      examples:
        - { key: prior_provisional_payments, label: Pagos provisionales anteriores del ejercicio, kind: money_monthly, required: true }
    TaxInputValue:
      x-frozen: sha256:a9cd1f021eb4d5f9f7230705be3e3f31efc9cd3264898257a0b6f4bbf2fc1802
      type: object
      required: [key]
      additionalProperties: false
      description: >-
        One stored value. Exactly the field of the key's `kind` is set (`value_cents` for
        `money` and `money_monthly`, `value_rate` for `rate`, `value_bool` for `boolean`);
        the others are absent or `null`. `month` (1-12) is set only for `money_monthly`.
        Responses send every field, `null` when not set.
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$', maxLength: 64 }
        month:
          type: [integer, 'null']
          minimum: 1
          maximum: 12
          description: Month of the fiscal year, only for `money_monthly`.
        value_cents:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeCents'
            - type: 'null'
        value_rate:
          oneOf:
            - $ref: '#/components/schemas/DecimalRate'
            - type: 'null'
        value_bool: { type: [boolean, 'null'] }
      examples:
        - { key: prior_provisional_payments, month: 1, value_cents: 200000 }
    TaxInputs:
      x-frozen: sha256:4ec47e9f7fb2b8d278720ce7b1d31d97fea218c8957399bf7f4c7ba42d92c771
