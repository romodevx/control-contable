        regime that is already active answers `409 conflict`; adding an
        ended one reopens it (`end_period` cleared, original `start_period` kept, body
        options applied) and answers `201`. A read-only user gets `402`; an archived taxpayer
        `422 business_rule_violation` (`taxpayer_archived`).
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
