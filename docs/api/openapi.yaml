openapi: 3.1.0
info:
  title: Control Contable API
  version: 0.1.0
  summary: Monthly IVA and provisional ISR estimates for Mexican taxpayers.
  description: |
    Spec-first contract (single source of truth). Server stubs (oapi-codegen),
    request validation, contract tests and the Dart client are generated from it.

    Conventions:
    - Money is `int64` centavos (`*_cents`). Rates travel as decimal strings. No floats.
    - Periods are `YYYY-MM`. Business dates are `date` (America/Mexico_City calendar).
    - Every error uses the single `ErrorResponse` envelope.
    - Every operation declares `x-module`. When that module's flag is OFF the server
      answers `404 not_found`, indistinguishable from a missing resource.
    - Operations without authentication declare `security: []` AND `x-public: true`.
    - Nodes marked `x-frozen: sha256:<hash>` are frozen; changing them is governed by
      `docs/api/CONTRACT.md` (lint fails when a frozen node drifts from its hash).
    - Resources of other users answer `404` (RLS), never `403`.
    - Create operations accept a client-generated UUID `id`; retrying the same POST
      returns the existing resource (idempotent against double submit).
      Reusing an `id` with a different body, or an `id` that already exists outside
      the caller's scope, answers `409 conflict` (never reveals the other row).

    Status: DRAFT 0.1.0 (Phase 2 Design). Regime-specific shapes (regime options,
    tax-input keys, breakdown concepts) are generic until
    `docs/research/tax-regimes-mx-2026.md` lands.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same origin. Local dev is http://localhost:8080; shared environments are set per deployment (ADR-0001 OWNER 2).
security:
  - bearerAuth: []
tags:
  - name: Platform
    description: P0 foundation (health, flags). No module flag.
  - name: Auth
    description: M1 `module_auth` - registration, sessions, account.
  - name: Taxpayers
    description: M2 `module_taxpayers` - regime catalog, taxpayers, regimes.
  - name: Incomes
    description: M3 `module_incomes`.
  - name: Expenses
    description: M4 `module_expenses`.
  - name: TaxEngine
    description: M5 `module_tax_engine` - estimates, breakdown, tax inputs.
  - name: Dashboard
    description: M6 `module_dashboard`.
  - name: Subscriptions
    description: M7 `module_subscriptions` - RevenueCat.
  - name: History
    description: M8 `module_history`.
  - name: Reminders
    description: M9 `module_reminders` - devices, settings, tax calendar.

paths:
  # ---------------------------------------------------------------- P0
  /healthz:
    get:
      tags: [Platform]
      operationId: getHealth
      x-frozen: sha256:b4f83c0a29fd89904250bdcf1ba50bf98e991d986b3c131e3f121d41d504aba9
      summary: Liveness and readiness
      x-module: platform
      x-public: true
      security: []
      responses:
        '200':
          description: Service and database reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { status: ok, database: ok, version: 0.1.0 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/flags:
    get:
      tags: [Platform]
      operationId: listEnabledFlags
      x-frozen: sha256:4440fb8f1b6af759162efbdfbd0daf5ddc4ddc9af207f4b2fd8f245c4530bad6
      summary: Modules enabled for the client (UX only; server enforces)
      x-module: platform
      x-public: true
      security: []
      responses:
        '200':
          description: Enabled module keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnabledFlags' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M1 Auth
  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Start registration (sends a verification code)
      description: |
        Always answers `202` with the same body, whether or not the email exists,
        so accounts cannot be enumerated (US-A1). Tokens are issued by
        `verifyEmail`. Requires acceptance of the current legal documents.
        (ADR-0001 OWNER decision 1, option A.)
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Verification code sent if the address can register.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the emailed code; creates the account, starts the trial, issues tokens
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '201':
          description: Account created and session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh token
      description: Reusing an already-rotated token revokes its whole family and returns 401.
      x-module: module_auth
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh token family
      x-module: module_auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user profile
      x-module: module_auth
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Update profile
      x-module: module_auth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Auth]
      operationId: deleteMe
      summary: Delete account and all its data (irreversible)
      description: |
        Deletes the user, taxpayers and records (cascade) and revokes all sessions.
        Does not cancel the store subscription (the app explains how). The keyed
        email hash stays in the trial registry (no second trial).
      x-module: module_auth
      responses:
        '204': { description: Account deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/legal/documents:
    get:
      tags: [Auth]
      operationId: listLegalDocuments
      summary: Current privacy notices and terms
      x-module: module_auth
      x-public: true
      security: []
      responses:
        '200':
          description: Current versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M2 Taxpayers
  /v1/regimes:
    get:
      tags: [Taxpayers]
      operationId: listRegimes
      summary: Regime catalog filtered by person type
      x-module: module_taxpayers
      parameters:
        - name: person_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/PersonType' }
      responses:
        '200':
          description: Regimes selectable for the person type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegimeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers:
    get:
      tags: [Taxpayers]
      operationId: listTaxpayers
      summary: Taxpayers managed by the user
      x-module: module_taxpayers
      parameters:
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Taxpayers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Taxpayers]
      operationId: createTaxpayer
      summary: Create a taxpayer (onboarding order - person type, RFC, regimes, options)
      x-module: module_taxpayers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '200':
          description: Idempotent retry; the taxpayer with this `id` already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            Well-formed but violates a business rule: an invalid regime combination, or
            `taxpayer_limit_reached` when the user already has the fair-use maximum of
            taxpayers (PRD Q4). The cap is not an entitlement (402): paying does not lift it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_regime_combination:
                  value:
                    error:
                      code: invalid_regime_combination
                      message: RESICO cannot be combined with regime 612 for the same taxpayer.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - field: regimes
                          code: incompatible
                          message: 626 is incompatible with 612.
                taxpayer_limit_reached:
                  value:
                    error:
                      code: taxpayer_limit_reached
                      message: You have reached the maximum number of taxpayers. Contact support to raise it.
                      request_id: req_01J9Z6Q4X8
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Taxpayers]
      operationId: getTaxpayer
      summary: Get a taxpayer
      x-module: module_taxpayers
      responses:
        '200':
          description: Taxpayer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Taxpayers]
      operationId: updateTaxpayer
      summary: Rename a taxpayer (person type and RFC are immutable)
      x-module: module_taxpayers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Taxpayers]
      operationId: deleteTaxpayer
      summary: Permanently delete a taxpayer and its records (irreversible)
      x-module: module_taxpayers
      parameters:
        - $ref: '#/components/parameters/Confirm'
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/archive:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    post:
      tags: [Taxpayers]
      operationId: archiveTaxpayer
      summary: Archive (hide) a taxpayer, keeping its data
      x-module: module_taxpayers
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Taxpayer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/regimes:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    post:
      tags: [Taxpayers]
      operationId: addTaxpayerRegime
      summary: Add a regime to a taxpayer
      x-module: module_taxpayers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerRegimeCreate' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerRegime' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/regimes/{regimeCode}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/RegimeCodePath'
    patch:
      tags: [Taxpayers]
      operationId: updateTaxpayerRegime
      summary: Update regime options
      x-module: module_taxpayers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxpayerRegimeUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerRegime' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Taxpayers]
      operationId: archiveTaxpayerRegime
      summary: Archive a regime with an end period (records are kept)
      description: If the regime has records and `confirm` is not `true`, answers `409 regime_has_records`.
      x-module: module_taxpayers
      parameters:
        - $ref: '#/components/parameters/Confirm'
        - name: end_period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerRegime' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M3 Incomes
  /v1/taxpayers/{taxpayerId}/incomes:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Incomes]
      operationId: listIncomes
      summary: List a month's incomes (keyset pagination) with period totals
      x-module: module_incomes
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of incomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Incomes]
      operationId: createIncome
      summary: Record an income (trial cap enforced)
      x-module: module_incomes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '200':
          description: Idempotent retry; already created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/incomes/{incomeId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/IncomeId'
    get:
      tags: [Incomes]
      operationId: getIncome
      summary: Get an income
      x-module: module_incomes
      responses:
        '200':
          description: Income.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Incomes]
      operationId: updateIncome
      summary: Edit an income (402 when access is read-only)
      x-module: module_incomes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Incomes]
      operationId: deleteIncome
      summary: Soft-delete an income (undo via restore)
      x-module: module_incomes
      responses:
        '204': { description: Deleted (restorable). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/incomes/{incomeId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/IncomeId'
    post:
      tags: [Incomes]
      operationId: restoreIncome
      summary: Undo a delete
      x-module: module_incomes
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Income' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M4 Expenses
  /v1/expense-categories:
    get:
      tags: [Expenses]
      operationId: listExpenseCategories
      summary: Expense categories with deductibility hints per regime
      x-module: module_expenses
      parameters:
        - name: regime
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RegimeCode' }
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategoryList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/expenses:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: List a month's expenses (keyset pagination) with period totals
      x-module: module_expenses
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of expenses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpensePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Record an expense (trial cap enforced)
      x-module: module_expenses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreate' }
      responses:
        '201':
          description: Created. `warnings` may flag non-deductibility risks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '200':
          description: Idempotent retry; already created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [Expenses]
      operationId: getExpense
      summary: Get an expense
      x-module: module_expenses
      responses:
        '200':
          description: Expense.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Expenses]
      operationId: updateExpense
      summary: Edit an expense
      x-module: module_expenses
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      summary: Soft-delete an expense (undo via restore)
      x-module: module_expenses
      responses:
        '204': { description: Deleted (restorable). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/expenses/{expenseId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [Expenses]
      operationId: restoreExpense
      summary: Undo a delete
      x-module: module_expenses
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M5 Tax engine
  /v1/taxpayers/{taxpayerId}/estimates:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [TaxEngine]
      operationId: getTaxpayerEstimate
      summary: Monthly IVA + provisional ISR estimate, per regime and total
      x-module: module_tax_engine
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
      responses:
        '200':
          description: Estimate (always includes the mandatory legend).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/estimates/{period}/breakdown:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/PeriodPath'
    get:
      tags: [TaxEngine]
      operationId: getEstimateBreakdown
      summary: Step-by-step breakdown with legal basis for one regime
      x-module: module_tax_engine
      parameters:
        - name: regime
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RegimeCode' }
      responses:
        '200':
          description: Breakdown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Breakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/regimes/{regimeCode}/tax-inputs:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/RegimeCodePath'
      - name: fiscal_year
        in: query
        required: true
        schema: { $ref: '#/components/schemas/FiscalYear' }
    get:
      tags: [TaxEngine]
      operationId: getTaxInputs
      summary: Tax inputs (YTD, coeficiente, losses, prior payments) with which keys are required
      x-module: module_tax_engine
      responses:
        '200':
          description: Inputs and definitions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxInputs' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [TaxEngine]
      operationId: putTaxInputs
      summary: Replace tax inputs for the fiscal year
      x-module: module_tax_engine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxInputsUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxInputs' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M6 Dashboard
  /v1/taxpayers/{taxpayerId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Home for the active taxpayer
      x-module: module_dashboard
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - name: months
          in: query
          schema: { type: integer, minimum: 6, maximum: 12, default: 12 }
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M7 Subscriptions
  /v1/subscription:
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Access status (trial, pro, comp, read-only) and plan
      x-module: module_subscriptions
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/subscription/sync:
    post:
      tags: [Subscriptions]
      operationId: syncSubscription
      summary: Pull current state from RevenueCat (post-purchase / restore)
      x-module: module_subscriptions
      responses:
        '200':
          description: Refreshed status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/webhooks/revenuecat:
    post:
      tags: [Subscriptions]
      operationId: receiveRevenueCatWebhook
      summary: RevenueCat webhook receiver (idempotent by event id)
      description: |
        Authenticated by the shared secret configured in RevenueCat, sent as
        `Authorization: Bearer <secret>`. Duplicate `event.id` returns 200 with no effect.
        State is re-fetched from RevenueCat, so out-of-order delivery is safe.
      x-module: module_subscriptions
      security:
        - revenueCatWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevenueCatWebhook' }
      responses:
        '200': { description: Accepted (processed or duplicate). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------------------------------------------------------- M8 History
  /v1/taxpayers/{taxpayerId}/history:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [History]
      operationId: getHistory
      summary: Monthly summaries for a fiscal year
      x-module: module_history
      parameters:
        - name: fiscal_year
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FiscalYear' }
      responses:
        '200':
          description: Months of the fiscal year.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryYear' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/taxpayers/{taxpayerId}/history/{period}/viewed:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
      - $ref: '#/components/parameters/PeriodPath'
    post:
      tags: [History]
      operationId: markHistoryViewed
      summary: Mark a month as viewed (stores the current records fingerprint)
      x-module: module_history
      responses:
        '204': { description: Marked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M9 Reminders
  /v1/devices:
    post:
      tags: [Reminders]
      operationId: registerDevice
      summary: Register or refresh a push token
      x-module: module_reminders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '200':
          description: Already registered; refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    delete:
      tags: [Reminders]
      operationId: unregisterDevice
      summary: Remove a push token (logout / opt-out)
      x-module: module_reminders
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/reminder-settings:
    get:
      tags: [Reminders]
      operationId: getReminderSettings
      summary: Reminder preferences (defaults if never set)
      x-module: module_reminders
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Reminders]
      operationId: putReminderSettings
      summary: Replace reminder preferences
      x-module: module_reminders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderSettings' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /v1/tax-calendar:
    get:
      tags: [Reminders]
      operationId: getTaxCalendar
      summary: Monthly due dates for a year (day 17 moved past weekends/holidays)
      x-module: module_reminders
      parameters:
        - name: year
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FiscalYear' }
      responses:
        '200':
          description: Calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token, 15 min TTL (ADR-0001 O6).
    revenueCatWebhookSecret:
      type: http
      scheme: bearer
      description: Shared secret configured in the RevenueCat dashboard as the Authorization header value.

  parameters:
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RegimeCodePath:
      name: regimeCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RegimeCode' }
    PeriodPath:
      name: period
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    PeriodQuery:
      name: period
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    RegimeQuery:
      name: regime
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RegimeCode' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `next_cursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Confirm:
      name: confirm
      in: query
      required: false
      description: Must be `true` to perform a destructive or data-affecting action.
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: Input does not match the contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - field: amount_cents
                  code: minimum
                  message: Must be greater than or equal to 0.
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: Authentication required., request_id: req_01J9Z6Q4X8 }
    PaymentRequired:
      description: Trial ended or cap reached and no active plan (read-only access).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    NotFound:
      description: Resource does not exist, belongs to another user, or its module is disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    Conflict:
      description: State conflict (duplicate RFC, regime with records needs confirmation, client `id` reused with a different body).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rfc_already_registered, message: This RFC is already registered in your account., request_id: req_01J9Z6Q4X8 }
    UnprocessableEntity:
      description: Well-formed but violates a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: invalid_regime_combination
              message: RESICO cannot be combined with regime 612 for the same taxpayer.
              request_id: req_01J9Z6Q4X8
              details:
                - field: regimes
                  code: incompatible
                  message: 626 is incompatible with 612.
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., request_id: req_01J9Z6Q4X8 }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }
    ServiceUnavailable:
      description: Dependency unavailable (database, RevenueCat); retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: upstream_unavailable, message: Service temporarily unavailable., request_id: req_01J9Z6Q4X8 }

  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      examples: [0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80]
    Period:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    FiscalYear:
      type: integer
      minimum: 2022
      maximum: 2100
      examples: [2026]
    RegimeCode:
      type: string
      pattern: '^[0-9]{3}$'
      description: SAT c_RegimenFiscal code.
      examples: ['612']
    MoneyCents:
      type: integer
      format: int64
      description: Signed amount in MXN centavos.
      examples: [1250000]
    NonNegativeCents:
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999999999
      description: Amount in MXN centavos (>= 0).
      examples: [1250000]
    DecimalRate:
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,6})?$'
      description: Decimal fraction as string (0.16 = 16%). Never a float.
      examples: ['0.16']
    PersonType:
      type: string
      enum: [fisica, moral]
    IvaRate:
      type: string
      enum: [rate_16, rate_8, rate_0, exempt]
      description: |
        rate_8 is the northern/southern border stimulus rate. Validity is date-ranged
        tax-parameter data (in force until 2026-12-31 per DOF 31-12-2025); a rate not valid
        on the record date is rejected with 422 business_rule_violation.
    Treatment:
      type: string
      enum: [full, partial, informational]
    Legend:
      type: string
      const: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
      description: Mandatory legend; must be shown on every estimate surface.
    DisclaimerCode:
      type: string
      enum:
        - not_tax_advice
        - incomplete_inputs
        - provisional_parameters
        - informational_regime
        - deductibility_claimed
        - no_coefficient_first_year
    Disclaimer:
      type: object
      required: [code, text]
      description: Text is versioned with the tax parameter set (ADR-0002).
      properties:
        code: { $ref: '#/components/schemas/DisclaimerCode' }
        text: { type: string }
      examples:
        - code: not_tax_advice
          text: Estimación informativa. No sustituye la declaración ante el SAT ni la asesoría de un contador. Cálculo basado en LISR, LIVA, LIF 2026 y Anexo 8 RMF 2026.
    ModuleKey:
      x-frozen: sha256:bc858cea369b72b8ff0211331c7fa6ed39b19ae3504e8fb51d4607eb82df306f
      type: string
      pattern: '^module_[a-z_]+$'
      examples: [module_incomes]

    # ------------------------------------------------------------ errors
    ErrorResponse:
      x-frozen: sha256:e25753af878a2993d34c47a4d9689b3c8d7bda4605bcb3d845b8144e28aca449
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Human-readable, safe to show; never contains PII.
            request_id: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthorized
        - entitlement_required
        - not_found
        - conflict
        - rfc_already_registered
        - regime_has_records
        - invalid_regime_combination
        - business_rule_violation
        - taxpayer_limit_reached
        - rate_limited
        - upstream_unavailable
        - internal_error
    FieldError:
      x-frozen: sha256:8de017f335831a0658c87486c7cb050faa553f4215e6cd7df03de2b74384fc3d
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: JSON pointer-ish path of the offending field. }
        code: { type: string }
        message: { type: string }

    # ------------------------------------------------------------ platform
    HealthStatus:
      x-frozen: sha256:f042770d3a1748ad5236a9a3f1b42296684507e37420689bf6a61a27e360c9b9
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
        version: { type: string }
    EnabledFlags:
