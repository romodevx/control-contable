                      - { key: ptu_paid, label: PTU pagada en el ejercicio, kind: money, required: false }
                      - { key: prior_year_losses, label: Pérdidas fiscales de ejercicios anteriores, kind: money, required: false }
                      - { key: interest_withholding, label: Retención de ISR por intereses, kind: money, required: false }
                    values:
                      - { key: coeficiente_utilidad, month: null, value_cents: null, value_rate: '0.1500', value_bool: null }
                      - { key: first_fiscal_year, month: null, value_cents: null, value_rate: null, value_bool: false }
        '400': { $ref: '#/components/responses/TaxEngineBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaxEngineNotFound' }
        '422':
