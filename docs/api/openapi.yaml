    # ------------------------------------------------------------ taxpayers
    RegimeOptionDef:
      type: object
      required: [key, label, type, required]
      description: Per-regime option definition (from the research catalog).
      properties:
        key: { type: string, examples: [deduction_mode] }
        label: { type: string }
        type: { type: string, enum: [enum, multi_enum, rate, boolean] }
        allowed_values:
          type: array
          items: { type: string }
        default: { type: [string, boolean, 'null'] }
        required: { type: boolean }
    Regime:
      type: object
      required: [code, name, person_type, treatment, option_defs, required_inputs]
      description: Catalog key is (code, person_type); e.g. 626 exists as RESICO PF and RESICO PM.
      properties:
        code: { $ref: '#/components/schemas/RegimeCode' }
        name: { type: string }
        person_type: { $ref: '#/components/schemas/PersonType' }
        treatment: { $ref: '#/components/schemas/Treatment' }
        explanation:
          type: [string, 'null']
          description: Plain-language reason for partial/informational treatment.
        option_defs:
          type: array
          items: { $ref: '#/components/schemas/RegimeOptionDef' }
        required_inputs:
          type: array
          items: { type: string }
          description: Tax-input keys the strategy needs (see TaxInputs).
      examples:
        - code: '606'
          name: Arrendamiento
          person_type: fisica
          treatment: full
          explanation: null
          option_defs:
            - key: deduction_mode
              label: Tipo de deducción
              type: enum
              allowed_values: [blind_35, actual]
              default: blind_35
              required: true
          required_inputs: []
    RegimeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Regime' }
      examples:
        - items:
            - code: '606'
              name: Arrendamiento
              person_type: fisica
              treatment: full
              explanation: null
              option_defs:
                - key: deduction_mode
                  label: Tipo de deducción
                  type: enum
                  allowed_values: [blind_35, actual]
                  default: blind_35
                  required: true
              required_inputs: []
    RegimeOptions:
      type: object
      description: Values keyed by RegimeOptionDef.key; validated server-side against the catalog.
      additionalProperties:
        oneOf:
          - type: string
          - type: boolean
          - type: array
            items: { type: string }
      examples:
        - { deduction_mode: blind_35 }
    TaxpayerRegime:
      type: object
      required: [regime_code, name, treatment, options, start_period]
      properties:
        regime_code: { $ref: '#/components/schemas/RegimeCode' }
        name: { type: string }
        treatment: { $ref: '#/components/schemas/Treatment' }
        options: { $ref: '#/components/schemas/RegimeOptions' }
        start_period: { $ref: '#/components/schemas/Period' }
        end_period:
          oneOf:
            - $ref: '#/components/schemas/Period'
            - type: 'null'
      examples:
        - regime_code: '606'
          name: Arrendamiento
          treatment: full
          options: { deduction_mode: blind_35 }
          start_period: '2026-01'
          end_period: null
    TaxpayerRegimeCreate:
      type: object
      required: [regime_code]
      properties:
        regime_code: { $ref: '#/components/schemas/RegimeCode' }
        options: { $ref: '#/components/schemas/RegimeOptions' }
        start_period: { $ref: '#/components/schemas/Period' }
      examples:
        - regime_code: '606'
          options: { deduction_mode: blind_35 }
          start_period: '2026-01'
    TaxpayerRegimeUpdate:
      type: object
      required: [options]
      properties:
        options: { $ref: '#/components/schemas/RegimeOptions' }
      examples:
        - options: { deduction_mode: actual }
    Taxpayer:
      type: object
      required: [id, person_type, display_name, rfc_masked, regimes, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        person_type: { $ref: '#/components/schemas/PersonType' }
        display_name: { type: string }
        rfc_masked:
          type: string
          description: The full RFC is never returned.
        regimes:
          type: array
