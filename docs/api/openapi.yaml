      type: object
      required: [enabled]
      properties:
        enabled:
          type: array
          items: { $ref: '#/components/schemas/ModuleKey' }
      examples:
        - enabled: [module_auth, module_taxpayers, module_incomes, module_expenses, module_tax_engine, module_dashboard]

    # ------------------------------------------------------------ auth
    RegisterRequest:
      type: object
      required: [email, password, accepted_documents]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Policy enforced server-side (length + breached-password check).
        name: { type: string, maxLength: 120 }
        accepted_documents:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DocumentAcceptance' }
      examples:
        - email: ana@example.mx
          password: correct-horse-battery-staple
          name: Ana Gómez
          accepted_documents:
            - { kind: privacy_notice_integral, version: '2026-10-01' }
            - { kind: terms, version: '2026-10-01' }
    DocumentAcceptance:
      type: object
      required: [kind, version]
      properties:
        kind: { $ref: '#/components/schemas/LegalDocumentKind' }
        version: { type: string }
    RegisterAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, const: verification_sent }
      examples:
        - status: verification_sent
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^[0-9]{6}$' }
      examples:
        - { email: ana@example.mx, code: '482913' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
      examples:
        - email: ana@example.mx
          password: '<password>'
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 40, maxLength: 200 }
      examples:
        - refresh_token: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01.example-refresh-secret
    TokenPair:
      type: object
      required: [access_token, access_expires_in, refresh_token, refresh_expires_in, token_type]
      properties:
        access_token: { type: string }
        access_expires_in: { type: integer, description: Seconds. }
        refresh_token: { type: string, description: 'Opaque, format <user_uuid>.<secret>.' }
        refresh_expires_in: { type: integer, description: Seconds. }
        token_type: { type: string, const: Bearer }
      examples:
        - access_token: example-access-token
          access_expires_in: 900
          refresh_token: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01.example-refresh-secret
          refresh_expires_in: 2592000
          token_type: Bearer
    AuthSession:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
      examples:
        - user:
            id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
            email: ana@example.mx
            name: Ana Gómez
            created_at: '2026-10-13T16:00:00Z'
          tokens:
            access_token: example-access-token
            access_expires_in: 900
            refresh_token: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01.example-refresh-secret
            refresh_expires_in: 2592000
            token_type: Bearer
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
      examples:
        - id: 0199d4a2-7c1e-7b3a-9f10-2c5e8a1b4d01
          email: ana@example.mx
          name: Ana Gómez
          created_at: '2026-10-13T16:00:00Z'
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
      examples:
        - name: Ana Gómez Ruiz
    LegalDocumentKind:
      type: string
      enum: [privacy_notice_integral, privacy_notice_simplified, terms]
    LegalDocument:
      type: object
      required: [kind, version, url, published_at]
      properties:
        kind: { $ref: '#/components/schemas/LegalDocumentKind' }
        version: { type: string }
        url: { type: string, format: uri }
        published_at: { type: string, format: date-time }
    LegalDocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LegalDocument' }
      examples:
        - items:
            - kind: privacy_notice_integral
              version: '2026-10-01'
