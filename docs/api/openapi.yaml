                      message: A taxpayer needs at least one active regime. Archive the taxpayer instead.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimeCode, code: last_active_regime, message: Archive the taxpayer instead. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

