        period: { $ref: '#/components/schemas/Period' }
        income_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        expense_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        tax_payable_rounded_cents: { $ref: '#/components/schemas/NonNegativeCents' }
    Dashboard:
      type: object
      required: [taxpayer_id, period, is_empty, estimate, income_cents, expense_cents, trend, access, legend]
      properties:
        taxpayer_id: { $ref: '#/components/schemas/Uuid' }
        period: { $ref: '#/components/schemas/Period' }
        is_empty: { type: boolean, description: True when the taxpayer has no records (empty state). }
