        RFC as typed: spaces, dashes and lower case are accepted and normalized server-side
        (trim, upper-case, NFC, inner spaces and `-` removed). The edge bounds only the
        length, so every RFC rule is reported on `rfc` with a domain code:
        `rfc_length_mismatch` (13 for física, 12 for moral), `rfc_format`, `rfc_date`,
        `rfc_check_digit` (SAT módulo 11), `rfc_generic`. Never echoed back.
