      operationId: archiveTaxpayerRegime
      x-frozen: sha256:3bbcc90fb589f70563e590318fad3c8aeb8a10a84e4378226f44565abd30ff9c
      summary: End a regime at `end_period` (records are kept; never a hard delete)
      description: >-
        Sets `end_period`: `start_period` ≤ `end_period` ≤ the current month
        (`end_period` / `out_of_range`), and not before the latest period holding a record in
        the regime (`422`, `records_after_end_period`). Records are kept and still count for
        periods up to `end_period`. When the regime has records and `confirm` is not `true`
        the call answers `409 regime_has_records` and changes nothing. The last active regime
        cannot be ended (`422`, `last_active_regime`): archive the taxpayer instead. A regime
        already ended answers `409 conflict`. Allowed for a read-only user; an archived
        taxpayer answers `422` (`taxpayer_archived`).
      x-module: module_taxpayers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Confirm'
        - name: end_period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
      responses:
        '200':
          description: Ended.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxpayerRegime' }
        '400':
          description: '`end_period` is missing, malformed or out of range.'
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: end_period, code: out_of_range, message: El periodo final no puede ser posterior al mes actual. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The regime has records and `confirm=true` was not sent, or the regime has already
            ended.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                regimeHasRecords:
                  value:
                    error: { code: regime_has_records, message: This regime has records. Confirm to end it; the records are kept., request_id: req_01J9Z6Q4X8 }
                alreadyEnded:
                  value:
                    error: { code: conflict, message: This regime has already ended., request_id: req_01J9Z6Q4X8 }
        '422':
          description: >-
            Records exist after `end_period`, it is the last active regime, or the taxpayer
            is archived.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                recordsAfterEndPeriod:
                  value:
                    error:
                      code: business_rule_violation
                      message: This regime has records after the end period.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: end_period, code: records_after_end_period, message: Elige un periodo igual o posterior al último registro. }
                lastActiveRegime:
                  value:
                    error:
                      code: business_rule_violation
                      message: A taxpayer needs at least one active regime. Archive the taxpayer instead.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regimeCode, code: last_active_regime, message: Archive the taxpayer instead. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- M3 Incomes
  /v1/taxpayers/{taxpayerId}/incomes:
    parameters:
      - $ref: '#/components/parameters/TaxpayerId'
    get:
      tags: [Incomes]
      operationId: listIncomes
      x-frozen: sha256:ead5984c5b0b5db82e60c3b9bdeb9002e1fc8e86e91be10b4ece5ed2e3ee6769
      summary: List a month's incomes (keyset pagination) with period totals
      description: >-
        Live (not deleted) incomes of the taxpayer whose **booking date** falls in `period`:
        `invoiced_on` for accrual regimes (PM Título II), `collected_on` for cash regimes
        (MODULE-incomes §2.2). Ordered by booking date, then `id`, both descending; `cursor`
        is the opaque `next_cursor` of the previous page (`limit` 1–100, default 50). `regime`
        narrows items and totals. `totals` cover the whole filtered period, not the page.
        Accrual incomes with `collected_on: null` come with `pending_collection: true`
        ("Por cobrar"). Archived taxpayers can be listed. Reads are allowed for a read-only
        user. `warnings` is always `[]` here (warnings are computed per write, never stored).
      x-module: module_incomes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
        - $ref: '#/components/parameters/RegimeQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of incomes.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncomePage' }
        '400': { $ref: '#/components/responses/RecordBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RecordNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/RecordInternalError' }
    post:
      tags: [Incomes]
      operationId: createIncome
      x-frozen: sha256:0c6ff1a0d075386a3fd18127fc18a534dcc0dfd38d6c2857602d31ff64a055c9
      summary: Record an income (idempotent client id; trial cap enforced)
      description: >-
        Records an income of the active taxpayer. Amounts are MXN centavos (`int64`), the
        amount is the subtotal **before IVA**; there is no currency field.


        **Idempotency (double submit).** The client generates `id` (UUIDv7 recommended) once
        per form session and resends it on every retry; the server generates one when it is
        absent. Before any access check: a new `id` → `201`; an `id` the caller already owns
        for the same taxpayer, not deleted, with the same persisted fields (compared after
        normalization) → `200` with the stored income, no second record and no trial slot
        (even at 5/5); the same `id` with other fields, another taxpayer, or a soft-deleted
        income → `409 conflict` with `{field: id, code: id_reused}`; an `id` that belongs to
        another user → `409 conflict` with no `details` (it reveals no ownership).


        **Order of checks** (one transaction): schema (`400`) → idempotency (`200`/`409`) →
        read-only access (`402`) → regime window and archive (`422`) → domain rules (`400`/`422`)
        → trial slot (`402`, atomic) → insert. A failed insert gives the slot back.


        **Trial cap.** 5 incomes per user across all taxpayers, independent of the 5 expenses.
        A spent cap answers `402 entitlement_required` with
        `{field: incomes_remaining, code: trial_cap_reached}`; deleting never frees a slot.


        `FieldError.code` values beyond JSON Schema keywords (`required`, `minimum`, `enum`,
        `format`, `pattern`, `maxLength`, `additionalProperties`, …):
        `collected_on` / `invoiced_on` → `required` (the date the regime's basis needs:
        `collected_on` for cash regimes, `invoiced_on` for accrual), `out_of_range` (before
        2026-01-01, the first fiscal year with a tax parameter set, or after today,
        America/Mexico_City; see `BusinessDate`);
        `platform_activity` → `required` (625 with more than one activity), `not_for_regime`
        (sent for a regime other than 625);
        `amount_cents` → `minimum` (0 is refused at the edge; `must_be_positive` is the
        domain's backstop code for the same rule).
        `422 business_rule_violation` details: `regime_code` → `regime_not_active` (the regime
        is not held on one of the income's dates); `taxpayerId` → `taxpayer_archived`;
        `iva_rate` → `rate_not_valid_on_date` (rate not allowed on the IVA date, e.g. `rate_8`
        after the border decree ends); `iva_cents` → `iva_amount_mismatch` (`rate_0`/`exempt`
        with IVA > 0, or more than 100 centavos away from `amount_cents × rate`);
        `isr_withheld_cents` / `iva_withheld_cents` → `withholding_not_applicable` (the
        person type, regime and `counterparty_type` allow no such withholding),
        `withholding_exceeds_base` (ISR above `amount_cents`, IVA above `iva_cents`), both
        retired by WH-06; `platform_activity` → `activity_not_held` (not among the taxpayer's
        625 activities); `iva_rate` → `residential_rent_exempt` (`residential_rent: true` with
        a rate other than `exempt`). `via_platform: true` outside 625 and persona moral
        regimes → `400` `not_for_regime`.


        **Withholdings are derived (ADR-0008, MODULE-withholdings §3).** The server derives
        ISR and IVA withheld from the taxpayer's person type and regime, `counterparty_kind`,
        `operation_kind`, `residential_rent`, `via_platform` and the amounts, stores them with
        the rule ids and `table_version`, and returns them read-only in `withholding` (mirrored
        in `isr_withheld_cents` / `iva_withheld_cents`). There is no manual override.
        **Transition:** until WH-06 lands the server still stores the typed amounts of the
        deprecated fields and omits `withholding`; WH-06 removes the deprecated fields
        (contract step, 0.10.x).


        Success bodies carry non-blocking `warnings` (MODULE-incomes §2.8, MODULE-withholdings
        §6): `duplicate_cfdi_uuid` on `cfdi_uuid` (another live income of the taxpayer has the
        same folio fiscal: legit for partial collections); `provisional_parameters` on
        `collected_on` / `invoiced_on` (the date reads a provisional parameter set, see
        `WarningCode`); `withholding_cpa_unverified` on `withholding`;
        `foreign_counterparty_not_supported` on `counterparty_kind`.
        `withholding_differs_from_rate` (on the typed amounts) is sent only until WH-06.
        Messages never carry amounts, descriptions or UUIDs.
      x-module: module_incomes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeCreate' }
            examples:
              professionalFees:
                summary: 612 fees billed to a persona moral (ISR 10 %, IVA 2/3 derived)
                value:
                  id: 0199d4a3-1a2b-7d3c-8e4f-5a6b7c8d9e01
                  regime_code: '612'
                  counterparty_type: persona_moral
                  counterparty_kind: pm
                  operation_kind: professional_services
                  amount_cents: 1000000
                  iva_rate: rate_16
                  iva_cents: 160000
                  invoiced_on: '2026-09-05'
                  collected_on: '2026-09-10'
                  cfdi_uuid: 6F3B2C1D-8A4E-4B7F-9C2D-1E5A7B9C3D4F
                  description: Diseño de logotipo
              accrualPendingCollection:
                summary: 601 invoice not yet collected ("Por cobrar")
                value:
                  id: 0199d4a3-3c4d-7f5e-a061-7c8d9e0f1a23
                  regime_code: '601'
                  counterparty_type: persona_moral
                  counterparty_kind: pm
                  amount_cents: 4500000
                  iva_rate: rate_16
                  iva_cents: 720000
                  invoiced_on: '2026-09-05'
                  collected_on: null
                  description: Consultoría de procesos, septiembre
              resicoToCompany:
                summary: 626 RESICO services billed to a persona moral (US-W1, WH-01)
                value:
                  id: 0199d4a3-8192-7ea3-b5b6-2b3c4d5e6f78
                  regime_code: '626'
                  counterparty_type: persona_moral
                  counterparty_kind: pm
                  operation_kind: professional_services
                  amount_cents: 10000000
                  iva_rate: rate_16
                  iva_cents: 1600000
                  collected_on: '2026-07-10'
              platformLodging:
                summary: 625 lodging through a platform (activity defaulted when the taxpayer holds one)
                value:
                  id: 0199d4a3-4d5e-7a6f-b172-8d9e0f1a2b34
                  regime_code: '625'
                  counterparty_type: plataforma
                  counterparty_kind: pm
                  via_platform: true
                  amount_cents: 1500000
                  iva_rate: rate_16
                  iva_cents: 240000
                  collected_on: '2026-09-20'
      responses:
        '201':
          description: Created, with the derived `withholding` (and `warnings` when the folio fiscal repeats or a ⚠️ rule matched).
          headers:
