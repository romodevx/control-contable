    # ------------------------------------------------------------ annual (ANN-02, ADR-0009)
    AnnualLegend:
      x-frozen: sha256:d731bb476c478e9916b718123609da585edb37ec2e8e395932678b5f151be5ab
      type: string
      const: Esto es un aproximado; tu contador te dará las cifras reales.
      description: >-
        Mandatory legend of every annual surface (MODULE-annual owner decision 1, §2.8);
        rendered from this server field. Not the monthly `Legend`.
    AnnualYearStatus:
      x-frozen: sha256:5d6120c712eca0a43b0d3a25431b640eff9c2a37e1af1fb114488a658f4d1162
      type: string
      enum: [closed, in_progress]
      description: >-
        `in_progress` when the fiscal year is the current one (America/Mexico_City): figures
        use the records through `data_through`, never extrapolated (OQ-A3).
    AnnualSectionKind:
      x-frozen: sha256:4c366834f96f9fa5ad0a548261629532cf097aa49b3268cb4055e04cdf5850d8
      type: string
      enum: [pf_art152, pf_resico_check, pm_601, pm_resico, explanation]
      description: >-
        `pf_art152`: one aggregated LISR 152 computation of a persona física's 605, 606, 612
        and 625 non-definitive income. `pf_resico_check`: RESICO PF 113-F informative check,
        never a balance. `pm_601`, `pm_resico`: per regime (LISR 9). `explanation`: any other
        regime, text and deadline only.
    AnnualComputedSectionKind:
      x-frozen: sha256:579ee124a10aed9b819783030a0524203227096776206efb25f50d44a428d4a8
      type: string
      enum: [pf_art152, pf_resico_check, pm_601, pm_resico]
      description: The `AnnualSectionKind` values that have a computation trace.
    AnnualSectionStatus:
      x-frozen: sha256:2b6ec05a5d3d81565dd228260cf479e992005e130ecc3785e31c2e90b9d537be
      type: string
      enum: [complete, incomplete, informational]
      description: >-
        Precedence `informational` > `incomplete` > `complete`. `incomplete`: a required input
        is missing and the section is computed with its documented fallback ("Incompleto" chip
        and CTA). `informational`: `pf_resico_check` and `explanation`; no payable or
        refundable balance.
    AnnualObligation:
      x-frozen: sha256:6accad04257afa3b5d8784c32a960c2d565b84ead2d761055cbd12d300de0d60
      type: string
      enum: [obligated, optional, not_obligated, relieved]
      description: >-
        Whether the return must be filed (MODULE-annual §2.4): `pf_art152` is `obligated`,
        `optional` (salary only within the limits: filing is optional, a refund is the usual
        reason) or `not_obligated`; `pf_resico_check` is `relieved` (rule 3.13.7); PM
        sections are always `obligated`.
    AnnualBalanceKind:
      x-frozen: sha256:b79e23ea835fcdaf3e81f42d5c0256f8b319d99e04d3051bbaf04606045c6f4c
      type: string
      enum: [a_cargo, a_favor, cero]
      description: Shown in words ("Saldo a cargo", "Saldo a favor", "Sin saldo"), never by colour alone.
    AnnualBalance:
      x-frozen: sha256:643495e8ce580239df5760292557edaba345c09aa2150324792d11b4691c74a4
      type: object
      required: [kind, amount_cents]
      description: >-
        `isr_cents − credits.total_cents`, rounded once to the centavo (half away from zero):
        positive → `a_cargo`, negative → `a_favor` with its absolute value, zero → `cero`.
      properties:
        kind: { $ref: '#/components/schemas/AnnualBalanceKind' }
        amount_cents: { $ref: '#/components/schemas/NonNegativeCents' }
      examples:
        - { kind: a_favor, amount_cents: 940800 }
    PaymentSourceCounts:
      x-frozen: sha256:9c1cb607a4f698c70f11597fd1cabc9212df62b34684a3a41a0255b49590b0f6
      type: object
      required: [filed_months, tax_input_months, estimated_by_app_months]
      description: >-
        How many regime-months of provisional payments came from each source (MODULE-annual
        §2.5): confirmed here (`filed`), the M5 tax input (`tax_input`), or the app's own
        monthly estimate (`estimated_by_app`, which raises `payments_estimated`).
      properties:
        filed_months: { type: integer, minimum: 0, maximum: 60 }
        tax_input_months: { type: integer, minimum: 0, maximum: 60 }
        estimated_by_app_months: { type: integer, minimum: 0, maximum: 60 }
      examples:
        - { filed_months: 6, tax_input_months: 0, estimated_by_app_months: 3 }
    AnnualCredits:
      x-frozen: sha256:64190b35b07fb3e2afeaa79980d6ed526d0eecf51000231617aef10a285e5618
      type: object
      required: [payments_cents, withholdings_cents, salary_isr_cents, total_cents, payment_sources]
      description: >-
        What is subtracted from the annual ISR: provisional ISR payments of the section's
        regimes, ISR withheld from the taxpayer (10 % by a persona moral, platforms; PM:
        interest withholding), ISR withheld on salary (Σ constancias; 0 for PM).
        `total_cents` is their sum.
      properties:
        payments_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        withholdings_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        salary_isr_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        total_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        payment_sources: { $ref: '#/components/schemas/PaymentSourceCounts' }
      examples:
        - payments_cents: 5577386
          withholdings_cents: 3000000
          salary_isr_cents: 0
          total_cents: 8577386
          payment_sources: { filed_months: 12, tax_input_months: 0, estimated_by_app_months: 0 }
    AnnualTax:
      x-frozen: sha256:dcbc3ed9c6f71402a4c4e67355d815aab4dbaa5ff1e0eb2452458616c10cf418
      type: object
      required: [accumulable_income_cents, personal_deductions_cents, base_cents, isr_cents, credits, balance]
      description: >-
        The section's annual ISR. `accumulable_income_cents`: PF, Σ of each chapter's
        result floored at 0 (a 612 loss stays in 612, LISR 109); PM, ingresos acumulables.
        `personal_deductions_cents`: applied after caps (PF only, `null` for PM).
        `base_cents`: PF base (≤ 0 → 0); PM resultado fiscal. `isr_cents`: PF annual tariff
        (Anexo 8 C.II), PM 30 %.
      properties:
        accumulable_income_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        personal_deductions_cents:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeCents'
            - type: 'null'
        base_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        isr_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        credits: { $ref: '#/components/schemas/AnnualCredits' }
        balance: { $ref: '#/components/schemas/AnnualBalance' }
      examples:
        - accumulable_income_cents: 50000000
          personal_deductions_cents: 4000000
          base_cents: 46000000
          isr_cents: 7636586
          credits:
            payments_cents: 5577386
            withholdings_cents: 3000000
            salary_isr_cents: 0
            total_cents: 8577386
            payment_sources: { filed_months: 12, tax_input_months: 0, estimated_by_app_months: 0 }
          balance: { kind: a_favor, amount_cents: 940800 }
    PmAnnualExtras:
      x-frozen: sha256:d2bb58a4afe2418ff96b1f0aa7b2e08d2f466526ddee1487562512ff5341b8fb
      type: object
      required: [ptu_base_cents, ptu_to_distribute_cents, suggested_cu_next_year]
      description: >-
        Informative PM figures. `ptu_base_cents`: 601, ingresos acumulables − deductions
        (without PTU paid or losses; the art. 28 fr. XXX adjustment is not modelled ⚠️); RESICO
        PM, utilidad fiscal per art. 212 (⚠️ `resico_pm_ptu_base`). `ptu_to_distribute_cents`:
        10 % of the base (601 only, ⚠️ `ptu_rate`; `null` for RESICO PM).
        `suggested_cu_next_year`: utilidad fiscal ÷ ingresos nominales, 4 decimals half-up
        (601 only, ⚠️ `cu_rounding`; `"0.0000"` when the utilidad is ≤ 0; `null` for RESICO
        PM), "Sugerido para tus pagos de {fy+1}".
      properties:
        ptu_base_cents: { $ref: '#/components/schemas/MoneyCents' }
        ptu_to_distribute_cents:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeCents'
            - type: 'null'
        suggested_cu_next_year:
          oneOf:
            - $ref: '#/components/schemas/DecimalRate'
            - type: 'null'
      examples:
        - { ptu_base_cents: 150000000, ptu_to_distribute_cents: 15000000, suggested_cu_next_year: '0.1380' }
    ResicoPfCheck:
      x-frozen: sha256:b615124c689fbd04e669e34fcabd8fb6d563b86f301b73013217801117818c33
      type: object
      required: [income_cents, rate, annual_isr_cents, monthly_payments_cents, withheld_cents, difference_cents]
      description: >-
        RESICO PF 113-F informative reconciliation (MODULE-annual §2.7): annual income
        collected × the annual non-marginal `rate` − the monthly RESICO ISR − the 1.25 %
        withheld = `difference_cents`, shown as "diferencia informativa", **never** as an
        amount to pay or to get back (the monthly payments are definitive, rule 3.13.7).
      properties:
        income_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        rate: { $ref: '#/components/schemas/DecimalRate' }
        annual_isr_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        monthly_payments_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        withheld_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        difference_cents: { $ref: '#/components/schemas/MoneyCents' }
      examples:
        - { income_cents: 48000000, rate: '0.0110', annual_isr_cents: 528000, monthly_payments_cents: 660000, withheld_cents: 0, difference_cents: -132000 }
    AnnualNoteCode:
      type: string
      description: >-
        Append-only (like `ErrorCode`): clients show the `text` of a code they do not know.
        `refund_only_paid` (a saldo a favor that depends on a payment estimated by the app:
        only what was actually paid or withheld is refunded, LISR 152); `refund_needs_efirma`
