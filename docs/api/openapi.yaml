    RegimeOptionDef:
      x-frozen: sha256:9ebe84365f3228b32dcccc873d35a7c2db344d452f30e854755679efd5ddb50b
      type: object
      required: [key, label, type, required]
      description: >-
        One per-regime option (`regimes.option_defs`, data not code). `enum` takes one of
        `allowed_values`; `multi_enum` takes a non-empty array of distinct `allowed_values`;
        `boolean` takes `true`/`false`; `rate` takes a decimal string (`DecimalRate`, 0.16 =
        16%) within `[min, max]`; both bounds are always present for `rate` and absent for
        every other type. An omitted option with a `default` is filled server-side; a
        `required` option with `default: null` must be sent. The shape is exactly the stored
        `regimes.option_defs` element (its CHECK `regime_option_defs_valid` enforces it).
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9]*(_[a-z0-9]+)*$', maxLength: 64, examples: [deduction_mode] }
        label: { type: string, description: Spanish label shown in the options form. }
        type: { type: string, enum: [enum, multi_enum, boolean, rate] }
        allowed_values:
          type: array
          description: Present for `enum` and `multi_enum`.
          items: { type: string }
        min:
          oneOf:
            - $ref: '#/components/schemas/DecimalRate'
            - type: 'null'
          description: Inclusive lower bound for `rate`; `null` or absent otherwise.
        max:
          oneOf:
            - $ref: '#/components/schemas/DecimalRate'
            - type: 'null'
          description: Inclusive upper bound for `rate`; `null` or absent otherwise.
        default:
          type: [string, boolean, 'null']
          description: Default value, or `null` when the option has none.
        required: { type: boolean }
      examples:
