      - $ref: '#/components/parameters/TaxpayerId'
    post:
      tags: [Taxpayers]
      operationId: addTaxpayerRegime
      x-frozen: sha256:7235ffd91972db345773b2cff01594b2c65bd77c255e38bb25bc9141bf7f22cb
      summary: Add a regime to a taxpayer (or reopen an ended one)
      description: >-
        `start_period` defaults to the current month (America/Mexico_City); allowed
        `2026-01` (the first fiscal year with tax parameters) … the current month
        (`out_of_range`). Options are validated against the
        regime's `option_defs` (omitted options with a default are filled; same
        `details[].code` values as `createTaxpayer`, with `options.<key>` paths). A code not
        in the catalog for the taxpayer's person type answers `400` (`regime_code` /
