          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCalendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: EdDSA-signed access token, 15 min TTL (ADR-0001 O6).
    revenueCatWebhookSecret:
      type: http
      scheme: bearer
      description: Shared secret configured in the RevenueCat dashboard as the Authorization header value.

  parameters:
    TaxpayerId:
      name: taxpayerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IncomeId:
      name: incomeId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RegimeCodePath:
      name: regimeCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RegimeCode' }
    PeriodPath:
      name: period
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    PeriodQuery:
      name: period
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Period' }
    RegimeQuery:
      name: regime
      in: query
      required: false
      schema: { $ref: '#/components/schemas/RegimeCode' }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `next_cursor`.
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Confirm:
      name: confirm
      in: query
      required: false
      description: Must be `true` to perform a destructive or data-affecting action.
      schema: { type: boolean, default: false }

  headers:
    NoStore:
      x-frozen: sha256:0e38e657527212cb20ce74557d6a041ed2ba91434f6050d1a2e62d8897cf2496
      description: Responses carrying tokens or account data must not be stored by any cache (RFC 9111; RFC 6749 section 5.1).
      required: true
      schema: { type: string, const: no-store }

  responses:
    BadRequest:
      description: Input does not match the contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              request_id: req_01J9Z6Q4X8
              details:
                - field: amount_cents
                  code: minimum
                  message: Must be greater than or equal to 0.
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: unauthorized, message: Authentication required., request_id: req_01J9Z6Q4X8 }
    PaymentRequired:
      description: Trial ended or cap reached and no active plan (read-only access).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: entitlement_required, message: Your trial has ended. Subscribe to keep adding records., request_id: req_01J9Z6Q4X8 }
    NotFound:
      description: Resource does not exist, belongs to another user, or its module is disabled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    Conflict:
      description: State conflict (duplicate RFC, regime with records needs confirmation, client `id` reused with a different body).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rfc_already_registered, message: This RFC is already registered in your account., request_id: req_01J9Z6Q4X8 }
    UnprocessableEntity:
      description: Well-formed but violates a business rule.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: invalid_regime_combination
              message: RESICO cannot be combined with regime 612 for the same taxpayer.
              request_id: req_01J9Z6Q4X8
              details:
                - field: regimes
                  code: incompatible
                  message: 626 is incompatible with 612.
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: rate_limited, message: Too many requests. Try again later., request_id: req_01J9Z6Q4X8 }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }
    ServiceUnavailable:
      description: Dependency unavailable (database, RevenueCat); retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: upstream_unavailable, message: Service temporarily unavailable., request_id: req_01J9Z6Q4X8 }

  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      examples: [0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80]
    Period:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    FiscalYear:
      type: integer
      minimum: 2022
      maximum: 2100
      examples: [2026]
    RegimeCode:
      type: string
      pattern: '^[0-9]{3}$'
      description: SAT c_RegimenFiscal code.
      examples: ['612']
    MoneyCents:
      type: integer
      format: int64
      description: Signed amount in MXN centavos.
      examples: [1250000]
    NonNegativeCents:
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999999999
      description: Amount in MXN centavos (>= 0).
      examples: [1250000]
    DecimalRate:
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,6})?$'
      description: Decimal fraction as string (0.16 = 16%). Never a float.
      examples: ['0.16']
    PersonType:
      type: string
      enum: [fisica, moral]
    IvaRate:
      type: string
      enum: [rate_16, rate_8, rate_0, exempt]
      description: |
        rate_8 is the northern/southern border stimulus rate. Validity is date-ranged
        tax-parameter data (in force until 2026-12-31 per DOF 31-12-2025); a rate not valid
        on the record date is rejected with 422 business_rule_violation.
    Treatment:
      type: string
      enum: [full, partial, informational]
    Legend:
      type: string
      const: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
      description: Mandatory legend; must be shown on every estimate surface.
    DisclaimerCode:
      type: string
      enum:
        - not_tax_advice
        - incomplete_inputs
        - provisional_parameters
        - informational_regime
        - deductibility_claimed
        - no_coefficient_first_year
    Disclaimer:
      type: object
      required: [code, text]
      description: Text is versioned with the tax parameter set (ADR-0002).
      properties:
        code: { $ref: '#/components/schemas/DisclaimerCode' }
        text: { type: string }
      examples:
        - code: not_tax_advice
          text: Estimación informativa. No sustituye la declaración ante el SAT ni la asesoría de un contador. Cálculo basado en LISR, LIVA, LIF 2026 y Anexo 8 RMF 2026.
    ModuleKey:
      x-frozen: sha256:bc858cea369b72b8ff0211331c7fa6ed39b19ae3504e8fb51d4607eb82df306f
      type: string
      pattern: '^module_[a-z_]+$'
      examples: [module_incomes]

    # ------------------------------------------------------------ errors
    ErrorResponse:
      x-frozen: sha256:e25753af878a2993d34c47a4d9689b3c8d7bda4605bcb3d845b8144e28aca449
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Human-readable, safe to show; never contains PII.
            request_id: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthorized
        - entitlement_required
        - not_found
        - conflict
        - rfc_already_registered
        - regime_has_records
        - invalid_regime_combination
        - business_rule_violation
        - taxpayer_limit_reached
        - rate_limited
        - upstream_unavailable
        - internal_error
    FieldError:
      x-frozen: sha256:8de017f335831a0658c87486c7cb050faa553f4215e6cd7df03de2b74384fc3d
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: JSON pointer-ish path of the offending field. }
        code: { type: string }
        message: { type: string }

    # ------------------------------------------------------------ platform
    HealthStatus:
      x-frozen: sha256:f042770d3a1748ad5236a9a3f1b42296684507e37420689bf6a61a27e360c9b9
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
        version: { type: string }
    EnabledFlags:
      x-frozen: sha256:3b36d8b2bda2dd7679139e5d371d113f055c1f70b0d219fa0b174d7ecbdca7d1
      type: object
      required: [enabled]
      properties:
        enabled:
          type: array
          items: { $ref: '#/components/schemas/ModuleKey' }
      examples:
        - enabled: [module_auth, module_taxpayers, module_incomes, module_expenses, module_tax_engine, module_dashboard]

    # ------------------------------------------------------------ auth
    RegisterRequest:
      x-frozen: sha256:5aa24b9a1ba128130ece0e1d0043c934c126205da11e57c3a5e8d5380d46fcc1
      type: object
      required: [email, accepted_documents]
