                pairNeedsCpaReview:
                  summary: Allowed; the pair's compatibility is not yet verified, so the app shows the reason
                  value:
                    regime_code: '607'
                    name: Régimen de Enajenación o Adquisición de Bienes
                    treatment: informational
                    options: {}
                    start_period: '2026-10'
                    end_period: null
                    warnings:
                      - code: regime_combination_needs_cpa_review
                        field: regime_code
                        message: Esta combinación de regímenes está pendiente de revisión por un contador; verifícala con tu contador.
        '400':
          description: Input does not match the contract, or a regime, option or period rule.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regime_code, code: not_for_person_type, message: This regime is not available for a persona física. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The regime is already active for this taxpayer.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: conflict, message: This regime is already active., request_id: req_01J9Z6Q4X8 }
        '422':
          description: The regime overlaps an incompatible one, or the taxpayer is archived.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidRegimeCombination:
                  value:
                    error:
                      code: invalid_regime_combination
                      message: RESICO replaces regime 612 for the same periods.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: regime_code, code: incompatible, message: 626 is incompatible with 612. }
                taxpayerArchived:
                  value:
                    error:
                      code: business_rule_violation
                      message: This taxpayer is archived. Unarchive it to make changes.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: taxpayerId, code: taxpayer_archived, message: Unarchive the taxpayer first. }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
