          maxItems: 3
          uniqueItems: true
          description: The current version of `terms` and of one privacy notice (integral or simplified), as returned by `listLegalDocuments`.
          items: { $ref: '#/components/schemas/DocumentAcceptance' }
      examples:
        - email: ana.gomez@example.mx
