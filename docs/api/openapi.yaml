                    - { field: iva_withheld_cents, code: withholding_exceeds_base, message: La retención de IVA no puede ser mayor que el IVA. }
            supplierNotApplicable:
              summary: A persona física taxpayer describes its supplier (only a persona moral withholds)
              value:
                error:
                  code: business_rule_violation
                  message: Supplier details apply only to a persona moral.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: supplier_kind, code: supplier_not_applicable, message: Como persona física no retienes a tus proveedores. }
            residentialRentExempt:
              summary: Housing rent with an IVA rate other than exempt
              value:
                error:
                  code: business_rule_violation
                  message: Housing rent is exempt from IVA.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: iva_rate, code: residential_rent_exempt, message: La renta de vivienda no lleva IVA. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
    RecordInternalError:
      x-frozen: sha256:778febb4c49ea1194a778a4332ef5f202d725fde256b69437512616f1f0683b4
      description: Unexpected server error.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: internal_error, message: Something went wrong., request_id: req_01J9Z6Q4X8 }

    # M5 tax engine errors (MODULE-tax-engine §5, S-4); `Cache-Control: no-store` as every response.
    # 402 and 500 reuse RecordReadOnly and RecordInternalError; 401 and 429 are the shared ones.
    TaxEngineBadRequest:
      x-frozen: sha256:35e6dab7f9ce848a4ff516df11bdf56f623ca1b6fcf07fe6ebfea844944c63e2
      description: >-
        Input does not match the contract (malformed period, fiscal year, regime code or path
        id, unknown query parameter), or a future period or fiscal year (`out_of_range`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            invalidPeriod:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: period, code: pattern, message: Usa el formato AAAA-MM. }
            futurePeriod:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: period, code: out_of_range, message: Aún no podemos estimar un mes futuro. }
    TaxEngineNotFound:
      x-frozen: sha256:20fa0bdca10b8568e470e2b0ba85d60cb646a90a06c632c69b5d4ad87b06d9f2
      description: >-
        The taxpayer does not exist, belongs to another user, its id is malformed, or
        `module_tax_engine` (or `module_taxpayers`) is disabled (indistinguishable on purpose).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    TaxEngineParametersUnavailable:
      x-frozen: sha256:741e0e69776999527dea4aca042b6e6aeaf1a0e072c5a05a713510370fe244c6
      description: >-
        The period is before 2026, the first fiscal year with transcribed tax parameters
        (`parameters_unavailable`, OQ-T9). A well-formed request the engine cannot answer,
        hence `422`; a record date before 2026 is instead invalid input to the record
        operations (`400 out_of_range`, see `BusinessDate`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: business_rule_violation
              message: There are no tax parameters for that period.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: period, code: parameters_unavailable, message: Sólo podemos estimar desde enero de 2026. }

    # Annual errors (MODULE-annual §5, ADR-0009); `Cache-Control: no-store` as every response.
    # 402 reuses RecordReadOnly, 422 on delete/restore RecordTaxpayerArchived, 500
    # RecordInternalError; 401 and 429 are the shared ones.
    AnnualBadRequest:
      x-frozen: sha256:7db41b3ac4a06a23114efae438551d8f07665b8bcd998ecedad577acf22a57b4
      description: >-
        Input does not match the contract (malformed fiscal year, regime code, path id, query
        parameter or body; unknown field; bad enum; negative amount), a future fiscal year
        (`out_of_range`), or a field rule of the operation (`details[].code`: see it).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            futureYear:
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: fiscalYear, code: out_of_range, message: Aún no podemos estimar un año futuro. }
            categoryFieldMissing:
              summary: A tuition deduction without its level
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: tuition_level, code: required, message: Indica el nivel escolar. }
            paidOnOutOfRange:
              summary: A deduction paid after today
              value:
                error:
                  code: validation_failed
                  message: One or more fields are invalid.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: paid_on, code: out_of_range, message: La fecha no puede ser futura ni anterior a 2026. }
    AnnualNotFound:
      x-frozen: sha256:3fe0062e7ca6b5c93283c0a9bcfa65ee9a3ab6abba31e13e1313c2bd15b0a879
      description: >-
        The taxpayer, constancia or deduction does not exist, belongs to another user or is
        purged, or `module_annual` is effectively OFF (`module_annual`, `module_tax_engine`
        or `module_taxpayers` disabled), which answers `404` before any input check, a
        malformed request included (indistinguishable on purpose). With the module ON a
        malformed id is `400`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
    AnnualParametersUnavailable:
      x-frozen: sha256:b35ddf5f16dd1ae1cf4e1cd617b2f9ef8e43fd90f097d752f8e0517f2d31e3e8
      description: >-
        The fiscal year is before 2026, the first fiscal year with transcribed tax parameters
        (`parameters_unavailable`). A well-formed request the engine cannot answer, hence
        `422`, as `getTaxpayerEstimate` and `getHistory`.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: business_rule_violation
              message: There are no tax parameters for that fiscal year.
              request_id: req_01J9Z6Q4X8
              details:
                - { field: fiscal_year, code: parameters_unavailable, message: Sólo podemos estimar desde 2026. }
    AnnualRuleViolation:
      x-frozen: sha256:095a1a62b2cd469589ed94a45943040bd3ef268a4a03ed94bf4dabc82adbf119
      description: >-
        Well-formed but violates an annual rule (`details[].code`, the subset each operation
        lists): `parameters_unavailable` (fiscal year before 2026), `person_type_not_allowed`
        (a persona moral writing personas físicas' data), `taxpayer_archived`,
        `regime_not_active` (regime not held in the year, or a month outside its window),
        `payments_not_applicable` (a regime with no provisional ISR payments),
        `limit_reached` (list bound of the year).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            parametersUnavailable:
              value:
                error:
                  code: business_rule_violation
                  message: There are no tax parameters for that fiscal year.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: fiscal_year, code: parameters_unavailable, message: Sólo podemos estimar desde 2026. }
            personTypeNotAllowed:
              value:
                error:
                  code: business_rule_violation
                  message: This applies only to a persona física.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: person_type_not_allowed, message: Las deducciones personales y constancias de sueldos son sólo de personas físicas. }
            taxpayerArchived:
              value:
                error:
                  code: business_rule_violation
                  message: This taxpayer is archived. Unarchive it to make changes.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: taxpayerId, code: taxpayer_archived, message: Desarchiva al contribuyente primero. }
            regimeNotActive:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime in that fiscal year.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regimeCode, code: regime_not_active, message: No tienes este régimen en ese ejercicio. }
            monthOutsideWindow:
              value:
                error:
                  code: business_rule_violation
                  message: The taxpayer does not hold this regime in that month.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: months.0.month, code: regime_not_active, message: No tenías este régimen en ese mes. }
            paymentsNotApplicable:
              value:
                error:
                  code: business_rule_violation
                  message: This regime has no provisional ISR payments.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: regimeCode, code: payments_not_applicable, message: Este régimen no hace pagos provisionales de ISR. }
            limitReached:
              value:
                error:
                  code: business_rule_violation
                  message: This fiscal year already has the maximum number of entries.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: body, code: limit_reached, message: Ya registraste el máximo de este año. }
    AnnualIdConflict:
      x-frozen: sha256:987899d67722a80c94463a642c3de280bc60c26ae2ce163d772679ac20cc27fc
      description: >-
        The client `id` is reused: by the caller with other fields, another taxpayer or a
        deleted row (`details`: `id` / `id_reused`), or it belongs to another user (no
        `details`).
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            idReused:
              value:
                error:
                  code: conflict
                  message: The request conflicts with the current state.
                  request_id: req_01J9Z6Q4X8
                  details:
                    - { field: id, code: id_reused, message: Este identificador ya se usó con otros datos. }
            foreignId:
              value:
                error: { code: conflict, message: The request conflicts with the current state., request_id: req_01J9Z6Q4X8 }
  schemas:
    # ------------------------------------------------------------ primitives
    Uuid:
      type: string
      format: uuid
      examples: [0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80]
    Period:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    FiscalYear:
      type: integer
      minimum: 2022
      maximum: 2100
      examples: [2026]
    RegimeCode:
      x-frozen: sha256:3f49f98d72a3b659908b61f100b5335d9748fd3ede9229802c6a4c82c1904014
      type: string
      pattern: '^[0-9]{3}$'
      description: SAT c_RegimenFiscal code.
      examples: ['612']
    MoneyCents:
      type: integer
      format: int64
      description: Signed amount in MXN centavos.
      examples: [1250000]
    NonNegativeCents:
      type: integer
      format: int64
      minimum: 0
      maximum: 99999999999999
      description: Amount in MXN centavos (>= 0).
      examples: [1250000]
    DecimalRate:
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,6})?$'
      description: Decimal fraction as string (0.16 = 16%). Never a float.
      examples: ['0.16']
    PersonType:
      x-frozen: sha256:af437a6aad19e5eb477200d38631e6231245088525568857b0539688ad28e27c
      type: string
      enum: [fisica, moral]
      description: Chosen first at onboarding and immutable; fixes the RFC length (13 física, 12 moral).
    IvaRate:
      x-frozen: sha256:4c6f053f333244b4dcfe1824b01b00d543b61ba2bf1286e9deb209905e185141
      type: string
      enum: [rate_16, rate_8, rate_0, exempt]
      description: |
        rate_8 is the northern/southern border stimulus rate. Validity is date-ranged
        tax-parameter data (in force until 2026-12-31 per DOF 31-12-2025); a rate not valid
        on the record date is rejected with 422 business_rule_violation.
    Treatment:
      x-frozen: sha256:fd1cccbfd11813bba72e268ca76b47439ba5c5725f79e01b68098d5c1c3c37a2
      type: string
      enum: [full, partial, informational]
      description: >-
        Support level of a regime: `full` (estimated), `partial` (some taxes only, e.g. IVA)
        or `informational` (selectable, not estimated; carries an explanation).
    Legend:
      x-frozen: sha256:71d09177095c3074f20dc4565cec4add6cbfee2c793570c7befc34901aec86cd
      type: string
      const: Esto es un aproximado. No todos los gastos aplican para tu giro comercial.
      description: Mandatory legend; must be shown on every estimate surface.
    DisclaimerCode:
      type: string
      description: >-
        Append-only (like `ErrorCode`): clients show the `text` of a code they do not know.
        `not_tax_advice` always; `incomplete_inputs` when a regime is `incomplete`;
        `provisional_parameters` when the period's fiscal year has no published parameters
        yet; `informational_regime` / `partial_regime` when a regime has that status;
        `deductibility_claimed` when a deductible expense entered the ISR base;
        `no_coefficient_first_year` for a 601 in its first fiscal year; `iva_mixed_activity`
        when a regime's creditable IVA was taken in full although it has exempt acts
        (`iva_fully_taxable = false`, or exempt collections in the month; LIVA 5 fr. V);
        `cpa_review_pending` when a line applies a rule a CPA has not validated;
        `resico_cap_exceeded` when a RESICO (626) regime's income collected in the year is above
        its cap (PF 3,500,000, LISR 113-E; PM 35,000,000, LISR 206): the taxpayer leaves RESICO
        (PF from the next month, LISR 113-E/113-I; PM from the next fiscal year, LISR 214), the
        month is still estimated under RESICO (MODULE-tax-engine §2.3, §2.9). Annual
        estimate (MODULE-annual §2.8, 0.11.0; `annual_estimate` is first there instead of
        `not_tax_advice`, and `incomplete_inputs` / `cpa_review_pending` are reused):
        `annual_estimate` always; `year_in_progress` (current fiscal year);
        `payments_estimated` (a provisional payment taken from the app's estimate);
        `deductions_as_entered` (a personal deduction applied); `resico_pf_definitive` (a
        RESICO PF check section); `informative_income` (PF total income over 500,000.00,
        LISR 150); `rmf_2027_pending` (fiscal year 2026); `inflation_adjustment_excluded`
        (PM sections); `no_annual_iva` always.
      enum:
        - not_tax_advice
        - incomplete_inputs
        - provisional_parameters
        - informational_regime
        - partial_regime
        - deductibility_claimed
        - no_coefficient_first_year
        - iva_mixed_activity
        - cpa_review_pending
        - resico_cap_exceeded
        - annual_estimate
        - year_in_progress
        - payments_estimated
        - deductions_as_entered
        - resico_pf_definitive
        - informative_income
        - rmf_2027_pending
        - inflation_adjustment_excluded
        - no_annual_iva
    DisclaimerSeverity:
      x-frozen: sha256:8429837655ae31f5f2ec2bbcdb5e05b87988db4e779030e4cf985bd03611eafc
      type: string
      enum: [info, warning, strong]
      description: >-
        `strong` is the non-dismissible amber banner above the number (`cpa_review_pending`);
        `warning` and `info` are shown under the estimate.
    Disclaimer:
      x-frozen: sha256:722b602df34046d80ff612fcd6c04d539b012968b6c92dc8bfe5020a7aa75e35
      type: object
      required: [code, severity, text]
      description: >-
        Text is versioned with the tax parameter set (ADR-0002), so it tracks the law year;
        es-MX, safe to show, never an amount. Order in a response: `not_tax_advice` first,
        then by severity (`strong`, `warning`, `info`), then by code.
      properties:
        code: { $ref: '#/components/schemas/DisclaimerCode' }
        severity: { $ref: '#/components/schemas/DisclaimerSeverity' }
        text: { type: string }
      examples:
        - code: not_tax_advice
          severity: info
          text: Estimación informativa. No sustituye la declaración ante el SAT ni la asesoría de un contador. Cálculo basado en LISR, LIVA, LIF 2026 y Anexo 8 RMF 2026.
    ModuleKey:
      x-frozen: sha256:bc858cea369b72b8ff0211331c7fa6ed39b19ae3504e8fb51d4607eb82df306f
      type: string
      pattern: '^module_[a-z_]+$'
      examples: [module_incomes]

    # ------------------------------------------------------------ errors
    ErrorResponse:
      x-frozen: sha256:e25753af878a2993d34c47a4d9689b3c8d7bda4605bcb3d845b8144e28aca449
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id]
          additionalProperties: false
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Human-readable, safe to show; never contains PII.
            request_id: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthorized
        - entitlement_required
        - not_found
        - conflict
        - rfc_already_registered
        - regime_has_records
        - invalid_regime_combination
        - business_rule_violation
        - taxpayer_limit_reached
        - rate_limited
        - upstream_unavailable
        - internal_error
        - invalid_password
    FieldError:
      x-frozen: sha256:8de017f335831a0658c87486c7cb050faa553f4215e6cd7df03de2b74384fc3d
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: JSON pointer-ish path of the offending field. }
        code: { type: string }
        message: { type: string }

    # ------------------------------------------------------------ platform
    HealthStatus:
      x-frozen: sha256:f042770d3a1748ad5236a9a3f1b42296684507e37420689bf6a61a27e360c9b9
      type: object
      required: [status, database, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unreachable] }
        version: { type: string }
    EnabledFlags:
      x-frozen: sha256:3b36d8b2bda2dd7679139e5d371d113f055c1f70b0d219fa0b174d7ecbdca7d1
      type: object
      required: [enabled]
      properties:
        enabled:
          type: array
          items: { $ref: '#/components/schemas/ModuleKey' }
      examples:
        - enabled: [module_auth, module_taxpayers, module_incomes, module_expenses, module_tax_engine, module_dashboard]

    # ------------------------------------------------------------ auth
    RegisterRequest:
      x-frozen: sha256:5aa24b9a1ba128130ece0e1d0043c934c126205da11e57c3a5e8d5380d46fcc1
      type: object
