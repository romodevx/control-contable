            iva_cents: 1066667
            isr_rate: '0.0125'
            iva_basis: two_thirds_of_iva
            withholder: counterparty
            net_cents: 10408333
            remit_due_on: null
            rule_ids: [ISR-4, IVA-6]
            explanations:
              - rule_id: ISR-4
                text: La empresa te retiene 1.25 % de ISR porque estás en RESICO (LISR art. 113-J).
              - rule_id: IVA-6
                text: Y 2/3 del IVA por servicios de persona física (LIVA art. 1-A, RLIVA art. 3).
            table_version: '2026.1'
            cpa_unverified: false
          warnings: []
