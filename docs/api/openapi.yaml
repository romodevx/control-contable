    # ------------------------------------------------------------ records
    PositiveCents:
      x-frozen: sha256:185f6d4be46dcd0694813767e2764d3be91b883a355ce45d2bf2aef5094e2c9c
      type: integer
      format: int64
      minimum: 1
      maximum: 99999999999999
      description: Amount in MXN centavos (>= 1). Same upper bound as `NonNegativeCents`.
      examples: [1000000]
    BusinessDate:
      x-frozen: sha256:1c0f561d9984643950d0d6b56092f089122f0811fd40d38bf979c0835d7b6075
      type: string
      format: date
      description: >-
        A record date on the America/Mexico_City calendar. The server refuses dates before
        2026-01-01 or after today with `400 validation_failed`, `out_of_range` on that date:
        2026 is the first fiscal year with a tax parameter set, so no IVA rate or withholding
        on an earlier date can be validated, and a record the server cannot validate is invalid
        input. The bounds move with the clock and the parameter catalog, so they are not schema
        keywords. A date outside the taxpayer's regime window answers `422 regime_not_active`
        first (the window is checked before the parameters). Not the same answer as the
        estimates: a month before 2026 there is a well-formed period the engine has no
        parameters for, `422 business_rule_violation` / `parameters_unavailable`
        (`getTaxpayerEstimate`).
      examples: ['2026-09-10']
    CounterpartyType:
      x-frozen: sha256:72a87f097acbb3f963c1c6a1c21c0b14ee23359f92328b3d27aac2dedc27c4a1
      type: string
      deprecated: true
      x-deprecated-reason: Removed by WH-06 (ADR-0008); withholdings are derived.
      enum: [persona_fisica, persona_moral, publico_general, plataforma]
      description: >-
        **Deprecated in 0.10.0** (ADR-0008): replaced by `CounterpartyKind` plus `via_platform`.
        Removed from requests, responses and `getIncomeDefaults` by WH-06 (the contract step,
        0.10.x). Until then it is who paid the income (MODULE-incomes §2.6): persona física and
        público en general never withhold; a persona moral withholds from a física in
        612/606/626; a platform withholds in 625 and from a persona moral.
    CounterpartyKind:
      x-frozen: sha256:433b4468f211c06d296a8427c56e8efee1c6c682f7e2dd460d36c1d1da5e8e54
      type: string
      enum: [pm, pf_with_activity, pf_no_activity_or_public, gov_federal, gov_state_municipal, foreign]
      description: >-
        "¿A quién le facturaste?" (MODULE-withholdings §2.1 Q1): `pm` a persona moral,
        `pf_with_activity` a persona física with a business or profession,
        `pf_no_activity_or_public` a persona física without activity or the general public,
        `gov_federal` the federal government or a federal body, `gov_state_municipal` a state or
        municipal government, `foreign` someone abroad (derives zero and warns
        `foreign_counterparty_not_supported`). The payer's regime is never asked: it cannot
        change the result (OQ-W1).
      examples: [pm]
    OperationKind:
      x-frozen: sha256:4d78480ae0ede98cb3157dd1eeb98c08d94d0ccaf38867834390a1cbbdecbf4f
      type: string
      enum:
        - professional_services
        - business_services
        - rent_real_estate
        - rent_movable
        - sale_of_goods
        - ground_freight
        - commission
        - scrap
        - other
      description: >-
        What was sold or which service was given (MODULE-withholdings §2.1 Q2, §2.2 E3).
        `rent_real_estate` is the one that asks `residential_rent`; `ground_freight` is road
        freight of goods (IVA withheld 4 % of the price); `scrap` is desperdicios y reciclables
        (IVA withheld 100 %); `other` never withholds IVA. There is no subcontracting value: LIVA
        1-A fr. IV (6 %) was repealed in 2021 (owner decision 4). A platform sale is not an
        operation kind on the wire: it is `via_platform: true`.
      examples: [professional_services]
    SupplierKind:
      x-frozen: sha256:667df6e4f6e57528fe7ec3220ecc9ba2b24521e0a380310c5a1ed9f75acf4982
      type: string
      enum: [pm, pf_with_activity, foreign]
      description: >-
        "¿Quién te vendió o te dio el servicio?" (MODULE-withholdings §2.2 E1), only when the
        taxpayer is a persona moral. `foreign` derives zero and warns
        `foreign_counterparty_not_supported`.
      examples: [pf_with_activity]
    SupplierRegime:
      x-frozen: sha256:f2eea0d359656a175c51309105af2c04fd9975ede944b1da5209f7c5ada4a26c
      type: string
      enum: ['612', '606', '626', '625', '621', unknown]
      description: >-
        Regime of a persona física supplier as printed on its CFDI (MODULE-withholdings §2.2
        E2), only with `supplier_kind: pf_with_activity`. `unknown` ("No sé") derives as 612 and
        warns `supplier_regime_unknown` (612 fees withhold 10 % ISR, RESICO 1.25 %).
      examples: ['612']
    WithholdingRuleId:
      x-frozen: sha256:2173a30721280f9d106aed92979b97e8f37259c60bf4f2e0c9e95a2ef1b76089
      type: string
      pattern: '^(ISR-[0-9]{1,2}|IVA-([0-9]{1,2}|NONE))$'
      description: >-
        A rule of the withholdings decision table (docs/research/withholdings-matrix-2026.md
        §4.2), `ISR-n` or `IVA-n`, or `IVA-NONE`: the table's preamble, the operation charges
        no IVA to withhold (`rate_0`, `exempt` or residential rent). An identifier only:
        clients show `Withholding.explanations`, never a rule table of their own.
      examples: [ISR-4]
    WithholdingBasis:
      x-frozen: sha256:be533ec58dc224efad7abde47db2fd54041fd90a053a7a94d7122af5a14cad80
      type: string
      enum: [none, two_thirds_of_iva, half_of_iva, all_of_iva, four_percent_of_price]
      description: >-
        How the IVA withholding was computed: a share of the IVA charged (2/3, 1/2, all) or 4 %
        of the subtotal (road freight); `none` when no IVA is withheld.
    Withholder:
      x-frozen: sha256:46583fa2f1fa154e0d008683bbc7f373a8a0c2474007bd61469b34d3f806a0d8
      type: string
      enum: [counterparty, you, platform, none]
      description: >-
        Who withholds: `counterparty` (the payer of an income), `you` (the taxpayer, a persona
        moral paying a supplier, who must remit it), `platform` (625, and platform sales of a
        persona moral) or `none`.
    WithholdingExplanation:
      x-frozen: sha256:cd2600dcc45bfc387e06daf346e14a82d206af9812318e66176952f08c8009cd
      type: object
      required: [rule_id, text]
      properties:
        rule_id: { $ref: '#/components/schemas/WithholdingRuleId' }
        text:
          type: string
          description: >-
            One plain-words line for a matched rule, with its legal basis (es-MX), written by
            the server from the decision table. Safe to show; never an RFC, a name or a
            description.
      examples:
        - rule_id: ISR-4
          text: La empresa te retiene 1.25 % de ISR porque estás en RESICO (LISR art. 113-J).
    Withholding:
      x-frozen: sha256:a6de646fe15289d67f7ed8612c5fd27d21a04a35297574c04decabb220168058
      type: object
      required:
        - isr_cents
        - iva_cents
        - isr_rate
        - iva_basis
        - withholder
        - net_cents
        - remit_due_on
        - rule_ids
        - explanations
        - table_version
        - cpa_unverified
      description: >-
        **Derived, never entered** (ADR-0008, MODULE-withholdings §3). The server computes it
        with the kernel's decision table from the facts of the record (person type and regime
        of the taxpayer, `counterparty_kind` or the supplier fields, `operation_kind`,
        `residential_rent`, `via_platform`, amounts, dates) and stores it with the
        `table_version` that produced it. No request accepts it. `isr_cents` and `iva_cents`
        are the record's `isr_withheld_cents` / `iva_withheld_cents`. Amounts:
        `isr_cents = round(amount_cents × isr_rate)`; `iva_cents` is the `iva_basis` share of
        the record's IVA, or 4 % of `amount_cents`; one rounding to the centavo, half away from
        zero. `net_cents` = subtotal + IVA − both withholdings: what the taxpayer receives
        (income) or pays the supplier (expense).
      properties:
        isr_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        iva_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        isr_rate:
          $ref: '#/components/schemas/DecimalRate'
          description: Fraction of `amount_cents` (RESICO `0.0125`, fees and rent `0.10`); `'0'` when no ISR is withheld.
        iva_basis: { $ref: '#/components/schemas/WithholdingBasis' }
        withholder: { $ref: '#/components/schemas/Withholder' }
        net_cents: { $ref: '#/components/schemas/NonNegativeCents' }
        remit_due_on:
          type: [string, 'null']
          format: date
          description: >-
            Expenses with `withholder: you` and an amount above 0: the 17th of the month after
            `paid_on`, when the taxpayer must remit both withholdings (never netted against
            IVA). `null` otherwise.
        rule_ids:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/WithholdingRuleId' }
        explanations:
          type: array
          maxItems: 4
          description: One line per entry of `rule_ids`, same order.
          items: { $ref: '#/components/schemas/WithholdingExplanation' }
        table_version:
          type: string
          pattern: '^[0-9]{4}\.[0-9]{1,3}$'
          description: >-
            Version of the decision table and rates that produced the figures (e.g. `2026.1`).
            A CPA answer or a new year's rates bumps it, and `cmd/backfill-withholdings`
            re-derives older records (MODULE-withholdings §5.3).
        cpa_unverified:
          type: boolean
          description: A ⚠️ rule a CPA has not confirmed matched (warning `withholding_cpa_unverified`).
      examples:
        - isr_cents: 125000
          iva_cents: 1066667
          isr_rate: '0.0125'
          iva_basis: two_thirds_of_iva
          withholder: counterparty
          net_cents: 10408333
          remit_due_on: null
          rule_ids: [ISR-4, IVA-6]
          explanations:
            - rule_id: ISR-4
              text: La empresa te retiene 1.25 % de ISR porque estás en RESICO (LISR art. 113-J).
            - rule_id: IVA-6
              text: Y 2/3 del IVA por servicios de persona física (LIVA art. 1-A, RLIVA art. 3).
          table_version: '2026.1'
          cpa_unverified: false
    WithholdingPreview:
      x-frozen: sha256:91695366d3aac745a44c2689ab69b7653a60d644af6acebe2e7b84ede1ac91a5
      type: object
      required: [withholding, warnings]
      description: >-
        What the matching create would derive for the same facts; nothing is stored. `warnings`
        holds the withholding warnings only: `withholding_cpa_unverified`,
        `foreign_counterparty_not_supported`, `supplier_regime_unknown`,
        `deduction_requires_remittance`.
      properties:
        withholding: { $ref: '#/components/schemas/Withholding' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
      examples:
        - withholding:
