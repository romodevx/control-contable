        `incomplete` > `partial` > `complete`. `complete`: every input this period needs is
        present. `incomplete`: an input is missing; computed with zero for it, still shown
        with an "Incompleto" chip and the CTA. `partial`: only some taxes are estimated
        (621, 622, 603, 625 without the definitive option); `explanation` says what is not.
