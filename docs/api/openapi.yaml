      examples:
        - display_name: Ana (negocio)
    TaxpayerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Taxpayer' }
      examples:
        - items:
            - id: 0199d4a2-8f00-7c44-a1b2-3c4d5e6f7a80
              person_type: fisica
              display_name: Ana (personal)
              rfc_masked: GOMA******AB3
              regimes:
                - regime_code: '612'
                  name: Actividad Empresarial y Profesional
                  treatment: full
                  options: {}
                  start_period: '2026-01'
