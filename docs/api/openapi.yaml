    post:
      tags: [History]
      operationId: markHistoryViewed
      x-frozen: sha256:428120cfe76ea48381bd2d4c4133ef21f9f45d05052254623569afb5ec57b87d
      summary: Record that the caller saw a month's estimate (clears its changed marker)
      description: >-
        Stores, for the caller, the taxpayer and `period`, the fingerprints and versions of
        the estimate the app **rendered**: the body is copied from the `TaxpayerEstimate`
        shown (`records_fingerprint`, `figures_fingerprint`, `engine_version`,
        `parameter_set`), not recomputed by the server, so a record changed between render and
        POST still marks the month on the next `getHistory`. Idempotent: one upsert per
        (user, taxpayer, period), the last view wins; repeating it answers `204` again.


        The app calls it whenever the estimate screen of a past month renders successfully,
        **from any entry point** (History row, dashboard "Ver detalle"; OQ-H7), only while
        `module_history` is ON; fire-and-forget (a failure never blocks the screen). The
        current month is accepted and stored but is never marked. The values are only ever
        compared with later estimates of the caller's own month (RLS); they never feed a
        figure.


        **Flags.** Same as `getHistory`: `module_history`, `module_tax_engine` or
        `module_taxpayers` OFF → `404`.


        **Access.** Allowed for read-only users and archived taxpayers (it creates no record:
        no `402`, no cap). Per-user budget `history_views`, 1,200 per hour (burst 120,
        ADR-0005); spent → `429 rate_limited` with `Retry-After`.


        `FieldError.code` values beyond JSON Schema keywords: `period` → `out_of_range` (a
        future month, America/Mexico_City). `422 business_rule_violation` details: `period`
        → `parameters_unavailable` (before 2026-01).
      x-module: module_history
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HistoryViewedRequest' }
      responses:
        '204':
          description: Recorded (or already recorded with the same values).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400':
          description: >-
            Input does not match the contract (malformed `period` or path id; missing,
            malformed or unknown body field, e.g. a fingerprint that is not 64 lower-case hex
            characters), or a future `period` (`out_of_range`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                malformedFingerprint:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: figures_fingerprint, code: pattern, message: Formato no válido. }
                futurePeriod:
                  value:
                    error:
                      code: validation_failed
                      message: One or more fields are invalid.
                      request_id: req_01J9Z6Q4X8
                      details:
                        - { field: period, code: out_of_range, message: Aún no hay datos de un mes futuro. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            The taxpayer does not exist or belongs to another user, or `module_history` is
            effectively OFF (`module_history`, `module_tax_engine` or `module_taxpayers`
            disabled), which answers `404` before any input check, a malformed request
            included (indistinguishable on purpose). With the module ON a malformed id is
            `400`.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: not_found, message: Not found., request_id: req_01J9Z6Q4X8 }
        '422':
          description: >-
            `period` is before 2026-01, the first month any estimate can exist
            (`parameters_unavailable`).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
