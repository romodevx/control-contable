              schema: { $ref: '#/components/schemas/TaxpayerRegime' }
        '400':
          description: '`end_period` is missing, malformed or out of range.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
